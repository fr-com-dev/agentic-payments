# L2 control HTTP API (SPEC.md §8.2 L2-5) as OpenAPI 3.1.
# SPEC.md and src/shared/contracts.ts stay normative. test/openapi.test.ts (T-API-01..04) fails when this
# file and the running service disagree on routes, bearer tokens or response shapes, so change both together.
openapi: 3.1.0
info:
  title: L2 control API
  version: "1.4"
  summary: Policy, signing and ledger service of the x402 three-layer agent payments PoC.
  description: |
    L2 is the only process that holds the payer key. It decides every payment against the spending
    mandate, signs the approved ones, and records everything in a hash-chained, append-only ledger.

    - **Loopback only.** L2 binds `127.0.0.1` (SPEC §3.1); `CONTROL_PORT` changes the port, never the host.
    - **One bearer token per caller** (INV-13). Each `/v1` operation accepts exactly one of the four tokens,
      and a wrong or missing token gets 401 before the body is read, so it never appends a ledger entry.
    - **User accounts** (v1.10, L2-8). With `USER_ACCOUNTS=1`, L2 also serves the `portal` operations to the
      portal's own token, and an intent that names a user is decided against that user's policy and signed with
      that user's account. Off (the default), those operations are not mounted and answer 404, and
      `PaymentIntent.userId` is ignored.
    - **Amounts** are decimal strings of atomic units (USDC has 6 decimals: `"1000"` is 0.001 USDC).
    - **Single writer.** Writes run in one serialized section; run one L2 per ledger file.
    - **API docs.** With `API_DOCS=1`, L2 also serves this document and Swagger UI at `/docs`. Those
      routes take no token and are not mounted by default. When served, `servers` points at that L2.
servers:
  - url: http://127.0.0.1:4020
    description: Default local bind (loopback only)
tags:
  - name: agent
    description: Called by the agent process (L1) with `CONTROL_TOKEN`.
  - name: settlement
    description: Called by the settlement verifier (L3) with `SETTLEMENT_TOKEN`.
  - name: operator
    description: Called by the human operator's CLIs with `OPERATOR_TOKEN`.
  - name: portal
    description: >-
      v1.10 user accounts (L2-8). Called by the portal process with `PORTAL_TOKEN`. Mounted only when
      `USER_ACCOUNTS=1`. No body carries text typed by a person: only identifiers, seller hosts, ISO dates and
      atomic amounts.
  - name: docs
    description: Swagger UI and this document. Mounted only when `API_DOCS=1`; no token.

paths:
  /v1/authorize:
    post:
      tags: [agent]
      operationId: authorize
      summary: Decide a payment intent and, when authorized, sign it
      description: |
        Runs the policy over the x402 challenge and answers AUTHORIZED (with signed payment headers),
        DENIED or ESCALATE. Every call appends an `INTENT` entry and one outcome entry. `purpose` is
        recorded for audit only and is never an input to the decision (INV-5).
      security:
        - controlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntent"
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "400":
          description: >-
            Malformed intent (missing ids, `paymentRequired.accepts` not an array, non-http(s) URL, a non-boolean
            `operatorApprovalOnly`, or a `userId` that is not a user identifier).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Unexpected failure inside the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/budget/{sessionId}:
    get:
      tags: [agent]
      operationId: getBudget
      summary: Session budget, derived from the ledger
      description: |
        An unknown session returns 200 with zero spend. v1.10: with user accounts on, `?userId=` returns the user
        view instead (`scope: user_daily`): the user daily ceiling, the user's committed spend over the last 24
        hours, and the highest auto-approve limit among the user's active policies. A user who has not finished
        onboarding or is disabled gets zeros.
      security:
        - controlToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: false
          description: v1.10. A user identifier. Ignored when user accounts are off.
          schema:
            $ref: "#/components/schemas/UserId"
      responses:
        "200":
          description: Budget status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetStatus"
        "400":
          description: v1.10. `userId` is not a user identifier (user accounts on only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/reconcile:
    post:
      tags: [settlement]
      operationId: reconcile
      summary: Record a settlement report for an authorization
      description: |
        Stores L3's on-chain verdict. A CONFIRMED settlement is final; a later contradicting report
        is stored with `anomaly: true` and does not change the effective status (INV-11).
      security:
        - settlementToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementReport"
      responses:
        "200":
          description: Report recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          description: Malformed report (missing `authorizationId` or a `verified` field).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No AUTHORIZED entry has this `authorizationId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/approvals/{authorizationId}:
    post:
      tags: [operator]
      operationId: approveEscalation
      summary: Approve a pending escalation
      description: |
        Appends one `HUMAN_APPROVAL`. Payee, amount, resource and session come from the ESCALATED entry,
        never from this request (INV-12). Approving again returns the existing approval with
        `alreadyApproved: true` and ignores the request's `ttlSeconds` and `approver`, so an escalation
        pays at most once.
      security:
        - operatorToken: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Approved now, or already approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResult"
        "400":
          description: "`ttlSeconds` is not a positive integer, or `approver` is empty."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/EscalationNotFound"
        "409":
          description: The escalation was rejected or has expired.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeniedConflict"
                  - $ref: "#/components/schemas/ExpiredConflict"

  /v1/rejections/{authorizationId}:
    post:
      tags: [operator]
      operationId: rejectEscalation
      summary: Reject a pending escalation
      description: |
        Appends one `HUMAN_REJECTION`. Later requests for the same (session, resource) are DENIED with
        `human_rejected` (R15) at any amount. Rejecting again returns the first rejection with
        `alreadyRejected: true`. `operator` and `reason` stay in the ledger; they never reach the agent.
      security:
        - operatorToken: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionRequest"
      responses:
        "200":
          description: Rejected now, or already rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectionResult"
        "400":
          description: "`operator` is not 1–64 characters, or `reason` is longer than 280."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/EscalationNotFound"
        "409":
          description: The escalation was approved or has expired.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovedConflict"
                  - $ref: "#/components/schemas/ExpiredConflict"

  /v1/escalations:
    get:
      tags: [operator]
      operationId: listPendingEscalations
      summary: Pending escalations, oldest first
      security:
        - operatorToken: []
      responses:
        "200":
          description: Pending escalations and the ledger cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingEscalations"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/escalations/events:
    get:
      tags: [operator]
      operationId: listEscalationEvents
      summary: Escalation lifecycle events after a ledger cursor
      description: |
        One event per lifecycle entry with `seq > after`. Poll with the returned `cursor` to follow new
        events (`npm run escalations -- --watch` does this every second). Events are built from a field
        whitelist and never carry tokens, payment headers, `accepts` or `purpose`.
      security:
        - operatorToken: []
      parameters:
        - name: after
          in: query
          required: false
          description: Ledger `seq` to start after. Integer ≥ -1; defaults to -1 (from the beginning).
          schema:
            type: integer
            minimum: -1
            default: -1
      responses:
        "200":
          description: Events and the ledger cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationEvents"
        "400":
          description: "`after` is not an integer ≥ -1."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/ledger/verify:
    get:
      tags: [operator]
      operationId: verifyLedger
      summary: Re-read the ledger file and verify its hash chain
      security:
        - operatorToken: []
      responses:
        "200":
          description: Chain check result. `ok` is false and `brokenAt` set when an entry was altered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/platform:
    get:
      tags: [portal]
      operationId: getPlatform
      summary: The platform limits and the seller list in force
      description: |
        The operator's ceilings for every user and the sellers users may list (CFG-4). Read-only.
      security:
        - portalToken: []
      responses:
        "200":
          description: The platform configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformView"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/{userId}:
    get:
      tags: [portal]
      operationId: getUser
      summary: One user's state, derived from the ledger
      description: |
        Registration, account state, onboarding steps, wallet figures, card identifiers and policies.
        An unknown user returns 200 with `registered: false` and empty lists, never 404: it is the caller's own user.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/{userId}/registration:
    put:
      tags: [portal]
      operationId: registerUser
      summary: Record that the user completed their profile
      description: |
        The first call appends `USER_REGISTERED`; later calls append nothing. The profile itself (name, email)
        stays in the portal and never reaches L2.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: The user, registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: "`userId` is not a user identifier, `acknowledgedTestFunds` is not `true`, or the body has another field."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/{userId}/wallet:
    put:
      tags: [portal]
      operationId: createWallet
      summary: Create the user's crypto account, once
      description: |
        The first call appends `WALLET_CREATED` with the next wallet index and its address; later calls append
        nothing and return the same address. The key never leaves the signer.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user, with the wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`not_registered`, or `account_disabled` when the user has no wallet yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/policies:
    post:
      tags: [portal]
      operationId: createPolicy
      summary: Create an expense policy
      description: |
        Appends `POLICY_CREATED` (version 1). Creating a policy always counts as loosening, so it needs a fresh
        `identityConfirmedAtMs` (at most 15 minutes old).
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreateRequest"
      responses:
        "201":
          description: The new policy, with its history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is malformed (a wrong type, a missing or unknown field, an unparsable date)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "409":
          description: "`not_registered`, `no_wallet` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidPolicy"

  /v1/users/{userId}/policies/{policyId}:
    get:
      tags: [portal]
      operationId: getPolicy
      summary: One policy with its full history
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
    put:
      tags: [portal]
      operationId: changePolicy
      summary: Change a policy's values
      description: |
        Appends `POLICY_CHANGED` with the next version. The same values again append nothing and return the current
        policy. A change that raises a limit or the rate, adds a seller or moves the end date later is loosening and
        needs a fresh `identityConfirmedAtMs`; a change that only tightens does not.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyChangeRequest"
      responses:
        "200":
          description: The policy after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is malformed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`policy_removed`, `account_disabled`, or `version_conflict` with the current policy."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/VersionConflict"
        "422":
          $ref: "#/components/responses/InvalidPolicy"

  /v1/users/{userId}/policies/{policyId}/pause:
    post:
      tags: [portal]
      operationId: pausePolicy
      summary: Pause a policy
      description: |
        Appends `POLICY_PAUSED` unless it is already paused. A paused policy authorizes nothing.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: The policy, paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is not empty."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`policy_removed` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/policies/{policyId}/resume:
    post:
      tags: [portal]
      operationId: resumePolicy
      summary: Resume a paused policy
      description: |
        Appends `POLICY_RESUMED` unless it is already active. Resuming restores spending, so it needs a fresh
        `identityConfirmedAtMs`, and the policy is validated again against today's seller list and the user's other
        policies.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
      responses:
        "200":
          description: The policy, active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body has an unknown field."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`policy_removed` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidPolicy"

  /v1/users/{userId}/policies/{policyId}/remove:
    post:
      tags: [portal]
      operationId: removePolicy
      summary: Remove a policy
      description: |
        Appends `POLICY_REMOVED` unless it is already removed. A removed policy never authorizes again and stays
        in the history.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: The policy, removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is not empty."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/disable:
    post:
      tags: [portal]
      operationId: disableUser
      summary: Disable the user's account
      description: |
        Appends `USER_DISABLED` unless already disabled. From the next decision on, every payment for the user is
        DENIED with `user_disabled`. Nothing is deleted.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user, disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`not_registered`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/enable:
    post:
      tags: [portal]
      operationId: enableUser
      summary: Enable a disabled account
      description: |
        Needs a fresh `identityConfirmedAtMs`. In one serialized section it appends one `POLICY_PAUSED` (cause
        `account_enabled`) for each active policy and then `USER_ENABLED`, so enabling alone never restarts
        spending. Nothing is appended when the account is already enabled.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
      responses:
        "200":
          description: The user, enabled, with every policy that was active now paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: "`userId` is not a user identifier, or the body has an unknown field."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/StepUpRequired"
        "409":
          description: "`not_registered`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/cards/{cardId}:
    put:
      tags: [portal]
      operationId: addCard
      summary: Record a registered card
      description: |
        Appends `CARD_ADDED` with the card's identifier unless it is already there. The ledger never holds a
        brand, digits or an expiry, and a card never pays (FR-021).
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: The user's card identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "400":
          description: "`userId` is not a user identifier, or `cardId` is not a card identifier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`not_registered`, `account_disabled` or `card_limit` (5 cards)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [portal]
      operationId: removeCard
      summary: Record a removed card
      description: |
        Appends `CARD_REMOVED` if the card is there. Allowed while the account is disabled.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: The user's card identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "400":
          description: "`userId` is not a user identifier, or `cardId` is not a card identifier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /docs:
    get:
      tags: [docs]
      operationId: getApiDocsPage
      summary: Swagger UI for this document
      description: |
        Only with `API_DOCS=1`. The page loads its scripts and styles from L2 itself (`/docs/{asset}`),
        never from a CDN, and its Content-Security-Policy limits scripts and requests to the L2 origin.
      security: []
      responses:
        "200":
          description: The Swagger UI page.
          content:
            text/html:
              schema:
                type: string

  /docs/{asset}:
    get:
      tags: [docs]
      operationId: getApiDocsAsset
      summary: A Swagger UI file
      description: Only with `API_DOCS=1`. Serves these three files and nothing else.
      security: []
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [swagger-ui.css, swagger-ui-bundle.js, swagger-initializer.js]
      responses:
        "200":
          description: The file.
          content:
            text/css:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
        "404":
          description: Not one of the three files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi.yaml:
    get:
      tags: [docs]
      operationId: getApiDocument
      summary: This document
      description: Only with `API_DOCS=1`. Identical to the file, except `servers` is `/`, the L2 serving it.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    controlToken:
      type: http
      scheme: bearer
      description: "`CONTROL_TOKEN`, held by the agent process (L1)."
    settlementToken:
      type: http
      scheme: bearer
      description: "`SETTLEMENT_TOKEN`, held by the settlement verifier (L3)."
    operatorToken:
      type: http
      scheme: bearer
      description: "`OPERATOR_TOKEN`, held by the operator CLIs."
    portalToken:
      type: http
      scheme: bearer
      description: "`PORTAL_TOKEN`, held by the portal process (v1.10). It reaches the `portal` operations only."

  parameters:
    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      description: The `authorizationId` of the ESCALATE decision.
      schema:
        type: string
        examples: [auth_009b55fe-307f-43ea-9014-a50e72f5576c]
    UserId:
      name: userId
      in: path
      required: true
      description: The user identifier the portal derived from the person's verified sign-in.
      schema:
        $ref: "#/components/schemas/UserId"
    PolicyId:
      name: policyId
      in: path
      required: true
      description: A policy of this user. Another user's policy is 404, like an unknown one.
      schema:
        type: string
        examples: [pol_5d261ce5-d9c0-4e73-a3ec-ce1e79af4be4]
    CardId:
      name: cardId
      in: path
      required: true
      description: The opaque identifier the portal gave the card.
      schema:
        type: string
        pattern: "^card_[0-9a-f-]{36}$"

  responses:
    Unauthorized:
      description: Missing or wrong bearer token. Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EscalationNotFound:
      description: No ESCALATED entry has this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidUserId:
      description: "`userId` is not a user identifier."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PolicyNotFound:
      description: This user has no policy with this ID. Another user's policy answers the same.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StepUpRequired:
      description: >-
        A loosening change without a sign-in time at most 15 minutes old (60 s tolerance). Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StepUpRequired"
    InvalidPolicy:
      description: The policy breaks one or more rules. Every issue is listed. Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidPolicy"

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    AtomicAmount:
      type: string
      pattern: "^[0-9]+$"
      description: Decimal string of atomic units.
      examples: ["50000"]

    IsoTime:
      type: string
      format: date-time

    ResourceInfo:
      type: object
      required: [url]
      properties:
        url:
          type: string
        description:
          type: string
        mimeType:
          type: string
        serviceName:
          type: string
        tags:
          type: array
          items:
            type: string
        iconUrl:
          type: string

    PaymentRequirements:
      type: object
      description: One x402 v2 payment option (`@x402/core` `PaymentRequirements`).
      required: [scheme, network, asset, amount, payTo, maxTimeoutSeconds, extra]
      properties:
        scheme:
          type: string
          examples: [exact]
        network:
          type: string
          description: CAIP-2 network ID.
          examples: ["eip155:84532"]
        asset:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        payTo:
          type: string
        maxTimeoutSeconds:
          type: integer
        extra:
          type: object
          description: Scheme data; for `exact` on EVM, the token's EIP-712 `name` and `version`.

    PaymentRequired:
      type: object
      description: The seller's decoded `PAYMENT-REQUIRED` challenge, verbatim (`@x402/core` `PaymentRequired`).
      required: [x402Version, resource, accepts]
      properties:
        x402Version:
          type: integer
          examples: [2]
        error:
          type: string
        resource:
          $ref: "#/components/schemas/ResourceInfo"
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequirements"
        extensions:
          type: object

    PaymentIntent:
      type: object
      required: [intentId, sessionId, resourceUrl, paymentRequired, purpose, createdAt]
      properties:
        intentId:
          type: string
          minLength: 1
          examples: [int_5d261ce5-d9c0-4e73-a3ec-ce1e79af4be4]
        sessionId:
          type: string
          minLength: 1
        resourceUrl:
          type: string
          format: uri
          description: The URL L1 requested; http or https only.
        paymentRequired:
          $ref: "#/components/schemas/PaymentRequired"
        purpose:
          type: string
          description: The model's stated reason. Audit only; never a decision input (INV-5).
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        operatorApprovalOnly:
          type: boolean
          description: >-
            v1.8 (L2-7, FR-007). true marks the intent operator-only: an escalation it creates sends no backchannel
            approval request and returns at once. It can only remove an approval path. Set by the L1-4 scripted
            agent; the hosted agent never sets it. A non-boolean value is 400.
        userId:
          $ref: "#/components/schemas/UserId"
          description: >-
            v1.10 (L2-8, FR-033). The verified person who started the run, set by the hosted agent service and never
            from model text or a tool input. With user accounts on, the intent is decided against this user's
            policy and signed with this user's account. Absent: the platform account. Ignored when user accounts
            are off.

    PolicyViolation:
      type: object
      additionalProperties: false
      required: [rule, detail]
      properties:
        rule:
          type: string
          description: Snake_case rule ID from SPEC §8.2 L2-2.
          examples: [human_approval_required]
        detail:
          type: string

    AuthorizationDecision:
      oneOf:
        - $ref: "#/components/schemas/AuthorizedDecision"
        - $ref: "#/components/schemas/UnauthorizedDecision"
      discriminator:
        propertyName: status
        mapping:
          AUTHORIZED: "#/components/schemas/AuthorizedDecision"
          DENIED: "#/components/schemas/UnauthorizedDecision"
          ESCALATE: "#/components/schemas/UnauthorizedDecision"

    AuthorizedDecision:
      type: object
      additionalProperties: false
      required: [status, authorizationId, intentId, requirement, paymentHeaders, payer, validBefore, remainingSessionBudgetAtomic]
      properties:
        status:
          const: AUTHORIZED
        authorizationId:
          type: string
        intentId:
          type: string
        requirement:
          $ref: "#/components/schemas/PaymentRequirements"
        paymentHeaders:
          type: object
          description: Headers for the paid retry (`PAYMENT-SIGNATURE`). A signed payment; treat it as a secret.
          additionalProperties:
            type: string
        payer:
          type: string
        validBefore:
          type: integer
          description: Unix seconds after which the signed authorization is void.
        remainingSessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"

    UnauthorizedDecision:
      type: object
      additionalProperties: false
      required: [status, authorizationId, intentId, violations]
      properties:
        status:
          type: string
          enum: [DENIED, ESCALATE]
          description: ESCALATE waits for an operator decision; DENIED is final for this request.
        authorizationId:
          type: string
        intentId:
          type: string
        violations:
          type: array
          items:
            $ref: "#/components/schemas/PolicyViolation"

    BudgetStatus:
      type: object
      additionalProperties: false
      required: [sessionId, asset, decimals, sessionCapAtomic, spentOrReservedAtomic, remainingAtomic, perPaymentCapAtomic]
      properties:
        sessionId:
          type: string
        asset:
          type: string
        decimals:
          type: integer
        sessionCapAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        spentOrReservedAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        remainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        perPaymentCapAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: The auto-approve limit; larger payments escalate.
        scope:
          type: string
          enum: [session, user_daily]
          description: >-
            v1.10. What the figures count. Absent means the session (the platform account). `user_daily`: the user
            daily ceiling and the user's last 24 hours, with the highest auto-approve limit among their policies.

    SettlementReport:
      type: object
      required: [authorizationId, status, network, finalityClass, detail, observedAt, verified]
      properties:
        authorizationId:
          type: string
        status:
          type: string
          enum: [CONFIRMED, PENDING, MISMATCH, NOT_SETTLED]
        transaction:
          type: string
        network:
          type: string
        blockNumber:
          type: string
        confirmations:
          type: integer
        finalityClass:
          type: string
          enum: [included, confirmed-depth, l1-safe]
        detail:
          type: string
        observedAt:
          $ref: "#/components/schemas/IsoTime"
        verified:
          type: object
          required: [asset, payer, payTo, amount]
          properties:
            asset:
              type: string
            payer:
              type: string
            payTo:
              type: string
            amount:
              $ref: "#/components/schemas/AtomicAmount"

    ReconcileResult:
      type: object
      additionalProperties: false
      required: [ok, anomaly]
      properties:
        ok:
          const: true
        anomaly:
          type: boolean
          description: True when the report contradicts the authorization or an earlier CONFIRMED.

    ApprovalRequest:
      type: object
      properties:
        approver:
          type: string
          minLength: 1
          default: operator
        ttlSeconds:
          type: integer
          minimum: 1
          default: 600
          description: How long the approval stays usable before it lapses.

    ApprovalResult:
      type: object
      additionalProperties: false
      required: [ok, approvalId, expiresAt]
      properties:
        ok:
          const: true
        approvalId:
          type: string
          examples: [apr_22489548-bc61-4ebe-87bc-df46de614eca]
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        alreadyApproved:
          const: true
          description: Present only when the escalation was already approved.

    RejectionRequest:
      type: object
      properties:
        operator:
          type: string
          minLength: 1
          maxLength: 64
          default: operator
          description: Self-declared label of whoever rejects.
        reason:
          type: string
          maxLength: 280

    RejectionResult:
      type: object
      additionalProperties: false
      required: [ok, rejectionId, rejectedAt, alreadyRejected]
      properties:
        ok:
          const: true
        rejectionId:
          type: string
          examples: [rej_03a1deba-0e67-4642-952d-0baca6103364]
        rejectedAt:
          $ref: "#/components/schemas/IsoTime"
        alreadyRejected:
          type: boolean

    DeniedConflict:
      type: object
      additionalProperties: false
      required: [error, state, rejectionId]
      properties:
        error:
          type: string
        state:
          const: denied
        rejectionId:
          type: string

    ApprovedConflict:
      type: object
      additionalProperties: false
      required: [error, state, approvalId]
      properties:
        error:
          type: string
        state:
          const: approved
        approvalId:
          type: string

    ExpiredConflict:
      type: object
      additionalProperties: false
      required: [error, state, expiresAt]
      properties:
        error:
          type: string
        state:
          const: expired
        expiresAt:
          $ref: "#/components/schemas/IsoTime"

    PendingEscalation:
      type: object
      additionalProperties: false
      required: [authorizationId, sessionId, resourceKey, payTo, amount, createdAt, expiresAt, referenceCode]
      properties:
        authorizationId:
          type: string
        sessionId:
          type: string
        resourceKey:
          type: string
        payTo:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        referenceCode:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: v1.8. The first 8 hex characters of the escalation ID; the approver's phone shows the same code.
        approvalRequest:
          $ref: "#/components/schemas/ApprovalRequestState"
        userId:
          $ref: "#/components/schemas/UserId"
          description: v1.10. Whose payment it is, when the escalation is a user's. An identifier, never a name.

    ApprovalRequestState:
      type: string
      description: >-
        v1.8 (L2-7). The backchannel approval request's state for a pending escalation. Present only when backchannel
        approval is on.
      enum: [requested, capped, operator_only, reevaluation, failed, verification_failed, lapsed]

    PendingEscalations:
      type: object
      additionalProperties: false
      required: [pending, cursor]
      properties:
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PendingEscalation"
        cursor:
          type: integer
          description: Last ledger `seq` (-1 when the ledger is empty). Pass it as `after` to the events feed.

    EscalationEvent:
      type: object
      additionalProperties: false
      required: [seq, at, kind, authorizationId, sessionId, resourceKey, payTo, amount]
      properties:
        seq:
          type: integer
        at:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum:
            - escalated
            - approved
            - denied
            - expired
            - approval_lapsed
            - approval_requested
            - approval_request_failed
            - approval_request_lapsed
            - approval_verification_failed
        authorizationId:
          type: string
        sessionId:
          type: string
        resourceKey:
          type: string
        payTo:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalId:
          type: string
        approver:
          type: string
        approvalExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        rejectionId:
          type: string
        operator:
          type: string
          description: Operator-channel rejections only.
        reason:
          type: string
          description: Operator-channel rejections only.
        referenceCode:
          type: string
          pattern: "^[0-9a-f]{8}$"
        approvalRequest:
          type: string
          enum: [requested, capped, operator_only, reevaluation]
          description: v1.8. On `escalated` events, when backchannel approval is on.
        channel:
          type: string
          enum: [operator, backchannel]
          description: v1.8. On `approved` and `denied` events, the path that decided.
        decidedBy:
          type: string
          description: v1.8. The operator's label, or the approver's verified identity (`sub`).
        requestId:
          type: string
        requestExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        failure:
          type: string
          enum: [unreachable, transient, permanent, interrupted, unrecoverable]
        error:
          type: string
          description: An OAuth error code from a fixed list, or `other`. Never the service's text.
        cause:
          type: string
          enum: [expired, late_refusal]
        check:
          type: string
          enum: [malformed, signature, issuer, audience, client, expired, approver, request, details, replay]
        userId:
          $ref: "#/components/schemas/UserId"
          description: v1.10. On `escalated` events of a user's payment.

    EscalationEvents:
      type: object
      additionalProperties: false
      required: [events, cursor]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EscalationEvent"
        cursor:
          type: integer

    ChainCheck:
      type: object
      additionalProperties: false
      required: [entries, ok]
      properties:
        entries:
          type: integer
        ok:
          type: boolean
        brokenAt:
          type: integer
          description: "`seq` of the first entry that fails verification."

    # ---- v1.10 user accounts (L2-8) ---------------------------------------------------------------

    UserId:
      type: string
      pattern: "^usr_[0-9a-f]{32}$"
      description: >-
        v1.10. An opaque user identifier, derived from the person's verified sign-in. It reveals neither a name nor
        an email.
      examples: [usr_deeee4478bc01dab1b0afa3fbe31f010]

    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [acknowledgedTestFunds]
      properties:
        acknowledgedTestFunds:
          const: true
          description: The person acknowledged that the wallet holds test funds only.

    StepUpRequest:
      type: object
      additionalProperties: false
      properties:
        identityConfirmedAtMs:
          type: integer
          description: >-
            When the person last signed in interactively (epoch milliseconds), as the portal verified it. L2
            accepts it for a loosening change when it is at most 15 minutes old.

    PolicyValues:
      type: object
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
      properties:
        sellers:
          type: array
          description: Where. Seller hosts (`host[:port]`) from the operator's seller list; 1 to 20.
          items:
            type: string
        autoApproveMaxAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: How much without asking. `0` means every payment needs a person.
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        sessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Per agent run.
        dailyBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Per trailing 24 hours, for this policy.
        maxAuthorizationsPerMinute:
          type: integer
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string
          enum: [crypto_account]
          description: How. A registered card can't pay (FR-021).

    PolicyCreateRequest:
      type: object
      additionalProperties: false
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
      properties:
        sellers:
          type: array
          items:
            type: string
        autoApproveMaxAtomic:
          type: string
        hardCapPerPaymentAtomic:
          type: string
        sessionBudgetAtomic:
          type: string
        dailyBudgetAtomic:
          type: string
        maxAuthorizationsPerMinute:
          type: number
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string
        identityConfirmedAtMs:
          type: integer

    PolicyChangeRequest:
      type: object
      additionalProperties: false
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
        - expectedVersion
      properties:
        sellers:
          type: array
          items:
            type: string
        autoApproveMaxAtomic:
          type: string
        hardCapPerPaymentAtomic:
          type: string
        sessionBudgetAtomic:
          type: string
        dailyBudgetAtomic:
          type: string
        maxAuthorizationsPerMinute:
          type: number
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string
        expectedVersion:
          type: integer
          description: The version the caller edited. A mismatch is 409 `version_conflict`.
        identityConfirmedAtMs:
          type: integer

    PolicyVersion:
      type: object
      additionalProperties: false
      required: [seq, ts, kind, version]
      properties:
        seq:
          type: integer
        ts:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum: [created, changed, paused, resumed, removed]
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        cause:
          type: string
          enum: [user, account_enabled]

    PolicyView:
      type: object
      additionalProperties: false
      required: [policyId, version, values, state, displayState, expired, limitedByPlatform, unlistedSellers, updatedAt]
      properties:
        policyId:
          type: string
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        state:
          type: string
          enum: [active, paused, removed]
        displayState:
          type: string
          enum: [active, paused, removed, expired, disabled]
        expired:
          type: boolean
        limitedByPlatform:
          type: array
          description: Fields where the platform limit is currently stricter than the saved value (FR-043).
          items:
            type: string
        unlistedSellers:
          type: array
          description: Sellers no longer on the seller list (FR-042).
          items:
            type: string
        updatedAt:
          $ref: "#/components/schemas/IsoTime"
        history:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"

    UserWallet:
      type: object
      additionalProperties: false
      required: [address, network, asset, decimals, committedAtomic, spent24hAtomic, dailyCeilingAtomic, dailyRemainingAtomic]
      properties:
        address:
          type: string
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer
        committedAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Authorized amounts that can still settle.
        spent24hAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Committed spend over the last 24 hours, the figure the daily budget counts.
        dailyCeilingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyRemainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"

    UserView:
      type: object
      additionalProperties: false
      required: [userId, registered, enabled, onboarding, cards, policies]
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        registered:
          type: boolean
        enabled:
          type: boolean
        onboarding:
          type: object
          additionalProperties: false
          required: [profile, wallet, policy]
          properties:
            profile:
              type: boolean
            wallet:
              type: boolean
            policy:
              type: boolean
        wallet:
          $ref: "#/components/schemas/UserWallet"
        cards:
          type: array
          items:
            type: string
        policies:
          type: array
          items:
            $ref: "#/components/schemas/PolicyView"

    CardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            type: string
            pattern: "^card_[0-9a-f-]{36}$"

    PlatformLimits:
      type: object
      additionalProperties: false
      required: [hardCapPerPaymentAtomic, sessionBudgetAtomic, userDailyCeilingAtomic, maxAuthorizationsPerMinute, maxPolicyDays]
      properties:
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        sessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        userDailyCeilingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: The user daily ceiling (FR-032), and the highest daily budget one policy may have.
        maxAuthorizationsPerMinute:
          type: integer
        maxPolicyDays:
          type: integer

    PlatformSeller:
      type: object
      additionalProperties: false
      required: [host, name, payees]
      properties:
        host:
          type: string
        name:
          type: string
          description: The operator's name for the seller, shown to users.
        payees:
          type: array
          description: Accepted payee addresses, lower-cased. Empty means any payee at that host.
          items:
            type: string

    PlatformView:
      type: object
      additionalProperties: false
      required: [platformId, digest, limits, sellers, network, asset, decimals]
      properties:
        platformId:
          type: string
        digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        limits:
          $ref: "#/components/schemas/PlatformLimits"
        sellers:
          type: array
          items:
            $ref: "#/components/schemas/PlatformSeller"
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer

    PolicyIssue:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          enum:
            - not_atomic
            - order_auto_below_cap
            - order_cap_within_session
            - above_platform_limit
            - rate_invalid
            - no_sellers
            - too_many_sellers
            - seller_not_listed
            - seller_conflict
            - expires_in_past
            - expires_too_late
            - payment_method_unsupported
            - policy_limit
        host:
          type: string
        policyId:
          type: string
        limitAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        limit:
          type: integer

    InvalidPolicy:
      type: object
      additionalProperties: false
      required: [error, issues]
      properties:
        error:
          const: invalid_policy
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PolicyIssue"

    StepUpRequired:
      type: object
      additionalProperties: false
      required: [error, maxAgeSec]
      properties:
        error:
          const: step_up_required
        maxAgeSec:
          type: integer

    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, current]
      properties:
        error:
          const: version_conflict
        current:
          $ref: "#/components/schemas/PolicyView"
