# L2 control HTTP API (SPEC.md §8.2 L2-5) as OpenAPI 3.1.
# SPEC.md and src/shared/contracts.ts stay normative. test/openapi.test.ts (T-API-01..04) fails when this
# file and the running service disagree on routes, bearer tokens or response shapes, so change both together.
openapi: 3.1.0
info:
  title: L2 control API
  version: "1.30.1"
  summary: Policy, signing and ledger service of the x402 three-layer agent payments PoC.
  description: |
    L2 is the only process that holds the payer key. It decides every payment against the spending
    mandate, signs the approved ones, and records everything in a hash-chained, append-only ledger.

    - **Loopback only.** L2 binds `127.0.0.1` (SPEC §3.1); `CONTROL_PORT` changes the port, never the host.
    - **One bearer token per caller** (INV-13). Each `/v1` operation accepts exactly one role token,
      and a wrong or missing token gets 401 before the body is read, so it never appends a ledger entry.
      Forwarded JWT headers (`X-Caller-Authorization` on the two `agent` routes when sign-in is configured;
      `X-Person-Authorization` on `portal` user routes and `admin` routes) are verified by L2 itself after the
      role token and open nothing on their own.
    - **User accounts** (v1.10, L2-8). With `USER_ACCOUNTS=1` (which also requires sign-in configured via
      `AUTH_ISSUER`, `AUTH_AUDIENCE`, `AGENT_CLIENT_IDS`, plus `PORTAL_CLIENT_ID`), L2 serves the `portal`
      operations behind `PORTAL_TOKEN` (and `X-Person-Authorization` on every user route; `GET /v1/platform`
      needs `PORTAL_TOKEN` only), and a person's verified `X-Caller-Authorization` token on `/v1/authorize` or
      `/v1/budget/{sessionId}` is decided against that person's effective policy and signed with that person's
      account, never the platform account. Off (the default), the `portal` operations are not mounted and answer
      404, and (v1.29) a person's caller token on the two agent routes is refused with 403 `user_accounts_off`.
      In either mode (v1.17), `PaymentIntent.userId` and `PaymentIntent.approvalSubject` are never accepted and
      are rejected with 400 (`malformed PaymentIntent`): who a payment is for comes only from
      `X-Caller-Authorization`.
    - **Portal administration** (v1.15, L2-8). With `PORTAL_ADMIN=1` as well, L2 serves the `admin` operations
      behind `PORTAL_ADMIN_TOKEN` and the administrator's own `X-Person-Authorization` token (`portal:admin`):
      the pending escalations, the two decisions, the events, the budget behind an escalation and the ledger
      check. Off (the default), they are not mounted and answer 404. The operator's operations are separate and
      unchanged.
    - **Request bodies** (v1.18). Every route that reads a JSON body checks authentication first, accepts at most
      16 KB (`256 KB` on `POST /v1/authorize`), and never inflates compressed bodies (`Content-Encoding` other
      than identity is 415; oversized bodies are 413). Unreadable bodies receive a fixed JSON error without
      echoing or logging the request.
    - **Amounts** are decimal strings of atomic units (USDC has 6 decimals: `"1000"` is 0.001 USDC).
    - **Single writer & ledger integrity.** Writes run in one serialized section under an exclusive lock file
      (`<ledger>.lock`, fenced before every append and head write, L2-6); run one L2 per ledger file. With
      `LEDGER_MAC_KEY` (v1.19), every entry carries an HMAC-SHA256 MAC over its hash. With `LEDGER_HEAD_URL`
      (v1.23), L2 writes the ledger head outside the share inside every serialized section that appended, before
      returning the response; if the head cannot be written, the request answers 500 `internal error` and
      returns nothing it decided.
    - **API docs.** With `API_DOCS=1`, L2 also serves this document and Swagger UI at `/docs`. Those
      routes take no token and are not mounted by default. When served, `servers` points at that L2.
servers:
  - url: http://127.0.0.1:4020
    description: Default local bind (loopback only)
tags:
  - name: agent
    description: >-
      Called by the agent process (L1) with `CONTROL_TOKEN`, and `X-Caller-Authorization` beside it when sign-in
      is configured (v1.17).
  - name: settlement
    description: Called by the settlement verifier (L3) with `SETTLEMENT_TOKEN`.
  - name: operator
    description: Called by the human operator's CLIs with `OPERATOR_TOKEN`.
  - name: portal
    description: >-
      v1.10 user accounts (L2-8). Called by the portal process with `PORTAL_TOKEN`, plus the person's own
      `X-Person-Authorization` token on every user route (`GET /v1/platform` excepted; v1.19, bounded at 6,000
      checks/min per address). Mounted only when `USER_ACCOUNTS=1`. No body carries text typed by a person: only
      identifiers, seller hosts, platform codes (v1.30), ISO dates and atomic amounts.
  - name: admin
    description: >-
      v1.15 portal administration (L2-8). Called by the portal process with `PORTAL_ADMIN_TOKEN` and the
      administrator's own `X-Person-Authorization` token holding `portal:admin` (v1.19, bounded at 6,000
      checks/min per address). Mounted only when `USER_ACCOUNTS=1` and `PORTAL_ADMIN=1`. Reads append nothing.
      No body carries text typed by a person: approve takes an empty object `{}` and reject takes only a
      `reasonCode` from a fixed list; the administrator and confirmation times come from `X-Person-Authorization`.
  - name: docs
    description: Swagger UI and this document. Mounted only when `API_DOCS=1`; no token.

paths:
  /v1/authorize:
    post:
      tags: [agent]
      operationId: authorize
      summary: Decide a payment intent and, when authorized, sign it
      description: |
        Runs the policy over the x402 challenge and answers AUTHORIZED (with signed payment headers),
        DENIED or ESCALATE. Every call appends an `INTENT` entry and one outcome entry (`AUTHORIZED`,
        `DENIED`, `ESCALATED` or `ESCALATION_REPEATED`). `purpose` is recorded for audit only and is never
        an input to the decision (INV-5). If policy evaluation throws unexpectedly, L2 records `DENIED` with
        `decision_failed` (v1.19); if signing fails, L2 records `DENIED` with `signer_rejected`.

        v1.8/v1.16 (L2-7): with backchannel approval on (`CIBA_APPROVAL=1`), a call that creates a new
        eligible escalation sends an approval request to the owner's phone and waits up to 120 s outside the
        serialized section; if the escalation reaches `approved` or `denied` on any path during that wait, L2
        runs a second serialized decision (`INTENT` with `reevaluationOf`) and returns that decision instead
        of `ESCALATE`.

        v1.17: who the payment is for comes from the caller's token (`X-Caller-Authorization`), which L2
        verifies itself: a person's token decides under that person's policy and signs with that person's
        account, never the platform account (or gets 403 `user_accounts_off` when user accounts are off,
        v1.29); a machine caller's token (or no token when sign-in is unconfigured) names no user, and the
        platform account pays. Checks run in this order: the control token (401), the per-address rate limit
        when sign-in is configured (429 beyond 600/min, shared with `/v1/budget/{sessionId}`), the caller's
        token (400, 401, 403), then the body (uncompressed JSON up to 256 KB; 413 oversized, 415 compressed,
        400 malformed). A refusal decides nothing, signs nothing and appends nothing.
      security:
        - controlToken: []
      parameters:
        - $ref: "#/components/parameters/CallerAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntent"
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationDecision"
        "400":
          description: >-
            Malformed intent (missing `intentId`/`sessionId`, non-http(s) `resourceUrl`, `paymentRequired.accepts`
            not an array or more than 20 options or an option missing valid requirement field types, non-object
            `paymentRequired.resource`, `purpose` not a string or longer than 500 characters, non-boolean
            `operatorApprovalOnly`, or, v1.17, a `userId` or `approvalSubject`: a request names nobody), or a
            body that is not JSON (`malformed PaymentIntent`). Also `caller_token_not_accepted`: a caller's token
            was sent to an L2 with no sign-in configured. The answer never repeats a value, and L2 logs nothing
            of the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrCaller"
        "403":
          $ref: "#/components/responses/CallerForbidden"
        "429":
          $ref: "#/components/responses/TooManyCallerChecks"
        "500":
          description: >-
            Unexpected failure inside the decision, or (v1.23) failure to write the external ledger head after
            the serialized section; returns fixed `{ "error": "internal error" }` and returns no signed payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/budget/{sessionId}:
    get:
      tags: [agent]
      operationId: getBudget
      summary: Session budget, derived from the ledger
      description: |
        An unknown session returns 200 with zero spend. v1.17: for a person's token (`X-Caller-Authorization`)
        the answer is the user view (`scope: user_daily`): the user daily ceiling, that person's committed spend
        over the last 24 hours, and the highest auto-approve limit among their active, unexpired policies
        (bounded by the platform cap). A person who has not finished onboarding or is disabled gets zeros. For a
        machine caller's token, or with no sign-in configured, it is the session view. When sign-in is configured
        and user accounts are off, a person's token gets 403 `user_accounts_off` (v1.29). The `userId` query of
        v1.10 is no longer accepted. v1.29: the user view also says whether the person can pay now (`account`),
        from the ledger, in the same read: the hosted agent asks before a person's run. Shares the 600/min
        per-address caller-token check limit with `POST /v1/authorize` when sign-in is configured. Nothing is
        appended.
      security:
        - controlToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CallerAuthorization"
      responses:
        "200":
          description: Budget status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetStatus"
        "400":
          description: >-
            v1.17. A `userId` query, whatever its value: the user comes from the caller's token. Also
            `caller_token_not_accepted`: a caller's token was sent to an L2 with no sign-in configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrCaller"
        "403":
          $ref: "#/components/responses/CallerForbidden"
        "429":
          $ref: "#/components/responses/TooManyCallerChecks"

  /v1/reconcile:
    post:
      tags: [settlement]
      operationId: reconcile
      summary: Record a settlement report for an authorization
      description: |
        Stores L3's on-chain verdict. Compares `verified.{asset, payer, payTo, amount}` (case-insensitive) and,
        v1.19, `verified.nonce` (when both the `AUTHORIZED` entry and the report carry one) against the
        authorization; any mismatch is stored as `status: "MISMATCH"` with `anomaly: true`. A CONFIRMED
        settlement is final; a later contradicting report is stored with `anomaly: true` and does not change the
        effective status (INV-11). For an authorization that recorded a `nonce` (v1.19), a `NOT_SETTLED` report
        releases its committed amount only when `verified.nonce` matches and both `observedAt` and the read time
        are after `validBefore`.
      security:
        - settlementToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementReport"
      responses:
        "200":
          description: Report recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          description: Malformed report (missing non-empty `authorizationId` or `verified.{asset, payer, payTo, amount}`, or non-JSON body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No AUTHORIZED entry has this `authorizationId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/approvals/{authorizationId}:
    post:
      tags: [operator]
      operationId: approveEscalation
      summary: Approve a pending escalation
      description: |
        Appends one `HUMAN_APPROVAL`. Payee, amount, resource and session come from the ESCALATED entry,
        never from this request (INV-12). Approving again returns the existing approval with
        `alreadyApproved: true` and ignores the request's `ttlSeconds` and `approver`, so an escalation
        pays at most once.
      security:
        - operatorToken: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Approved now, or already approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResult"
        "400":
          description: "`ttlSeconds` is not a whole number from 1 to 3600, or `approver` is not 1-64 characters (1.19)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/EscalationNotFound"
        "409":
          description: The escalation was rejected or has expired.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeniedConflict"
                  - $ref: "#/components/schemas/ExpiredConflict"

  /v1/rejections/{authorizationId}:
    post:
      tags: [operator]
      operationId: rejectEscalation
      summary: Reject a pending escalation
      description: |
        Appends one `HUMAN_REJECTION`. Later requests for the same (session, resource) are DENIED with
        `human_rejected` (R15) at any amount. Rejecting again returns the first rejection with
        `alreadyRejected: true`. `operator` and `reason` stay in the ledger; they never reach the agent.
      security:
        - operatorToken: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionRequest"
      responses:
        "200":
          description: Rejected now, or already rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectionResult"
        "400":
          description: "`operator` is not 1–64 characters, or `reason` is longer than 280."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/EscalationNotFound"
        "409":
          description: The escalation was approved or has expired.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovedConflict"
                  - $ref: "#/components/schemas/ExpiredConflict"

  /v1/escalations:
    get:
      tags: [operator]
      operationId: listPendingEscalations
      summary: Pending escalations, oldest first
      description: |
        Runs the escalation sweep inside the serialized section so due expiries and lapses are recorded first,
        then returns pending escalations oldest first with the ledger cursor.
      security:
        - operatorToken: []
      responses:
        "200":
          description: Pending escalations and the ledger cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingEscalations"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/escalations/events:
    get:
      tags: [operator]
      operationId: listEscalationEvents
      summary: Escalation lifecycle events after a ledger cursor
      description: |
        One event per lifecycle entry with `seq > after`. Poll with the returned `cursor` to follow new
        events (`npm run escalations -- --watch` does this every second). Events are built from a field
        whitelist and never carry tokens, payment headers, `accepts` or `purpose`.
      security:
        - operatorToken: []
      parameters:
        - name: after
          in: query
          required: false
          description: Ledger `seq` to start after. Integer ≥ -1; defaults to -1 (from the beginning).
          schema:
            type: integer
            minimum: -1
            default: -1
      responses:
        "200":
          description: Events and the ledger cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationEvents"
        "400":
          description: "`after` is not an integer ≥ -1."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/escalations:
    get:
      tags: [admin]
      operationId: adminListPendingEscalations
      summary: Pending escalations for the portal's administration area, oldest first
      description: |
        What `GET /v1/escalations` returns, for the administration role, plus the time of the read. It derives the
        list from the entries and the clock and appends nothing (no sweep): an escalation leaves the list at
        exactly 300 s, whether or not its expiry entry has been written yet.
      security:
        - portalAdminToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
      responses:
        "200":
          description: Pending escalations, the ledger cursor and the time of the read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPendingEscalations"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"

  /v1/admin/escalations/events:
    get:
      tags: [admin]
      operationId: adminListEscalationEvents
      summary: Escalation lifecycle events for the portal's administration area, in pages
      description: |
        The events of `GET /v1/escalations/events`, read one page at a time, oldest first. With `after`: the first
        `limit` events with a higher `seq` (poll with the returned `cursor`, or continue from `last` while `more`).
        With `before`: the `limit` events just below it. With neither: the latest `limit`. Every event here also
        carries the payment's `referenceCode` and, for a user's payment, the owner's `userId`. Appends nothing.
      security:
        - portalAdminToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - name: after
          in: query
          required: false
          description: Ledger `seq` to read after. Integer ≥ -1. Not together with `before`.
          schema:
            type: integer
            minimum: -1
        - name: before
          in: query
          required: false
          description: Ledger `seq` to read before. Integer ≥ -1. Not together with `after`.
          schema:
            type: integer
            minimum: -1
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          description: A bad `limit` or cursor, both cursors, or any other query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"

  /v1/admin/escalations/{authorizationId}:
    get:
      tags: [admin]
      operationId: adminGetEscalation
      summary: One escalation in any state, with how it ended and the budget behind it
      description: |
        The escalation as its `ESCALATED` entry describes it, its state, the decision when a person ended it, and
        the budget it counts against. The owner, the session and the resource come from the entry: the caller names a
        payment, never a user or a session. The budget is computed from the ledger by the function the decision
        itself uses, against the rules in force now. Appends nothing.
      security:
        - portalAdminToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/EscalationId"
      responses:
        "200":
          description: The escalation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationDetail"
        "400":
          description: The ID is not an escalation ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "404":
          $ref: "#/components/responses/EscalationNotFound"

  /v1/admin/escalations/{authorizationId}/approve:
    post:
      tags: [admin]
      operationId: adminApproveEscalation
      summary: Approve a pending escalation for an administrator of the portal
      description: |
        Appends one `HUMAN_APPROVAL` with `channel: "portal"`, the administrator's identifier as `approver` and the
        time they confirmed their identity. The approval has exactly the effect of an operator's: it lifts only the
        approval requirement, for one exact (session, resource, payee, amount), once, and never overrides a rule that
        denies (INV-12). It is valid for 600 s; the request can't choose that.

        Checked inside the serialized section, in this order: the escalation exists (404); it is pending (the same
        decision returns the first one with `already: true`, any other final state is 409); the decider is not the
        escalation's owner (403 `own_payment`); the identity confirmation is at most 15 minutes old, 60 s tolerance
        (403 `step_up_required`); v1.19: so is the second factor (`https://x402.dev/mfa_time`). The decider and both
        times are the administrator's own token's (`X-Person-Authorization`), never body fields. A refusal appends
        nothing.
      security:
        - portalAdminToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/EscalationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminApprovalRequest"
      responses:
        "200":
          description: Approved now, or already approved on any path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedOutcome"
        "400":
          description: >-
            A malformed `authorizationId`, a non-JSON or non-object body, or any body field (including `decidedBy`
            or `identityConfirmedAtMs`, which come from `X-Person-Authorization`). Nothing is appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          description: >-
            The administrator's token is refused (`person_forbidden`), the decider owns this payment
            (`own_payment`), or their sign-in time or second-factor time (`https://x402.dev/mfa_time`) is missing
            or older than 15 minutes (`step_up_required`). Nothing is appended.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OwnPayment"
                  - $ref: "#/components/schemas/StepUpRequired"
                  - $ref: "#/components/schemas/PersonRefusal"
        "404":
          $ref: "#/components/responses/EscalationNotFound"
        "409":
          description: The escalation was rejected or has expired. Nothing is appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotPending"

  /v1/admin/escalations/{authorizationId}/reject:
    post:
      tags: [admin]
      operationId: adminRejectEscalation
      summary: Reject a pending escalation for an administrator of the portal
      description: |
        Appends one `HUMAN_REJECTION` with `channel: "portal"`, the administrator's identifier as `approver` and a
        reason code from a fixed list. No text is accepted. Later requests for the same (session, resource) are
        DENIED with `human_rejected` (R15); the agent learns only the rejection's ID. A rejection needs no fresh
        sign-in or second-factor confirmation; the administrator still comes from `X-Person-Authorization` (with
        `portal:admin`). The same checks as an approval otherwise.
      security:
        - portalAdminToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/EscalationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRejectionRequest"
      responses:
        "200":
          description: Rejected now, or already rejected on any path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedOutcome"
        "400":
          description: >-
            A malformed `authorizationId`, a non-JSON or non-object body, a `reasonCode` outside the fixed list,
            or any other body field (including `decidedBy`, which comes from `X-Person-Authorization`). Nothing
            is appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          description: >-
            The administrator's token is refused (`person_forbidden`), or the decider owns this payment
            (`own_payment`). Nothing is appended.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OwnPayment"
                  - $ref: "#/components/schemas/PersonRefusal"
        "404":
          $ref: "#/components/responses/EscalationNotFound"
        "409":
          description: The escalation was approved or has expired. Nothing is appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotPending"

  /v1/admin/ledger/verify:
    get:
      tags: [admin]
      operationId: adminVerifyLedger
      summary: Re-read the ledger file and verify its hash chain, for the portal's administration area
      description: >-
        What `GET /v1/ledger/verify` answers, for the administration role. Read-only; it repairs nothing. A check
        re-reads the whole ledger, so one caller's address gets at most 30 a minute; the portal asks at most six.
      security:
        - portalAdminToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
      responses:
        "200":
          description: >-
            Chain check result. `ok` is false and `brokenAt` set when an entry is malformed or altered; (v1.19)
            with `LEDGER_MAC_KEY`, when a MAC is missing or invalid or the file is shorter than `keyedFrom`
            (`brokenAt` is then the file's length); and (v1.23) with `LEDGER_HEAD_URL`, when the file is shorter
            than the ledger head L2 last wrote outside the share (`brokenAt` is the file's length) or the entry
            at `head.entries - 1` has another hash (`brokenAt` is that entry's index).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainCheck"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "429":
          description: More than 30 checks in a minute from one address (or more than 6,000 person-token checks on `/v1/admin`). `Retry-After` says when to ask again. Nothing was read.
          headers:
            Retry-After:
              description: Seconds until the next check is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ledger/verify:
    get:
      tags: [operator]
      operationId: verifyLedger
      summary: Re-read the ledger file and verify its hash chain
      description: >-
        A check re-reads the whole ledger, so one caller's address gets at most 30 a minute (v1.19), counted after the
        operator's token: a caller without it is refused before it counts.
      security:
        - operatorToken: []
      responses:
        "200":
          description: >-
            Chain check result. `ok` is false and `brokenAt` set when an entry is malformed or altered; (v1.19)
            with `LEDGER_MAC_KEY`, when a MAC is missing or invalid or the file is shorter than `keyedFrom`
            (`brokenAt` is then the file's length); and (v1.23) with `LEDGER_HEAD_URL`, when the file is shorter
            than the ledger head L2 last wrote outside the share (`brokenAt` is the file's length) or the entry
            at `head.entries - 1` has another hash (`brokenAt` is that entry's index).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: More than 30 checks in a minute from one address. `Retry-After` says when to ask again. Nothing was read.
          headers:
            Retry-After:
              description: Seconds until the next check is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/platform:
    get:
      tags: [portal]
      operationId: getPlatform
      summary: The platform limits and the seller list in force
      description: |
        The operator's ceilings for every user and the sellers users may list (CFG-4). Read-only.
        Names no user, so `PORTAL_TOKEN` alone is required (no `X-Person-Authorization`).
      security:
        - portalToken: []
      responses:
        "200":
          description: The platform configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformView"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/{userId}:
    get:
      tags: [portal]
      operationId: getUser
      summary: One user's state, derived from the ledger
      description: |
        Registration, account state, onboarding steps, wallet figures, card identifiers, active connected
        platforms (`connections`, v1.30 — identifiers only, never grants or balances), and policies (sorted by
        newest `updatedAt` first, without `history`). An unknown user returns 200 with `registered: false` and
        empty lists, never 404: it is the caller's own user.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"

  /v1/users/{userId}/registration:
    put:
      tags: [portal]
      operationId: registerUser
      summary: Record that the user completed their profile
      description: |
        The first call appends `USER_REGISTERED`; later calls append nothing. The profile itself (name, email)
        stays in the portal and never reaches L2.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: The user, registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: "`userId` is not a user identifier, `acknowledgedTestFunds` is not `true`, or the body has another field."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"

  /v1/users/{userId}/wallet:
    put:
      tags: [portal]
      operationId: createWallet
      summary: Create the user's crypto account, once
      description: |
        The first call appends `WALLET_CREATED` with the next wallet index and its address; later calls append
        nothing and return the same address. The key never leaves the signer.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user, with the wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "409":
          description: "`not_registered`, or `account_disabled` when the user has no wallet yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/policies:
    post:
      tags: [portal]
      operationId: createPolicy
      summary: Create an expense policy
      description: |
        Appends `POLICY_CREATED` (version 1). Creating a policy always counts as loosening, so it needs a fresh
        sign-in time (at most 15 minutes old; v1.19 the person's token's, never a body field).
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreateRequest"
      responses:
        "201":
          description: The new policy, with its history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is malformed (a wrong type, a missing or unknown field including `identityConfirmedAtMs`, or an unparsable date)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          description: A loosening change without a fresh sign-in time (`step_up_required`), or (v1.19) the person's token refused (`person_forbidden`, `person_mismatch`). Nothing is appended.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StepUpRequired"
                  - $ref: "#/components/schemas/PersonRefusal"
        "409":
          description: "`not_registered`, `no_wallet` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidPolicy"

  /v1/users/{userId}/policies/{policyId}:
    get:
      tags: [portal]
      operationId: getPolicy
      summary: One policy with its full history
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
    put:
      tags: [portal]
      operationId: changePolicy
      summary: Change a policy's values
      description: |
        Appends `POLICY_CHANGED` with the next version. The same values again append nothing and return the current
        policy. A change that raises a limit or the rate, adds a seller or moves the end date later is loosening and
        needs a fresh sign-in time (v1.19 the person's token's); a change that only tightens does not.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyChangeRequest"
      responses:
        "200":
          description: The policy after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is malformed (a wrong type, `expectedVersion` < 1, a missing or unknown field including `identityConfirmedAtMs`, or an unparsable date)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          description: A loosening change without a fresh sign-in time (`step_up_required`), or (v1.19) the person's token refused (`person_forbidden`, `person_mismatch`). Nothing is appended.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StepUpRequired"
                  - $ref: "#/components/schemas/PersonRefusal"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`policy_removed`, `account_disabled`, or `version_conflict` with the current policy."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/VersionConflict"
        "422":
          $ref: "#/components/responses/InvalidPolicy"

  /v1/users/{userId}/policies/{policyId}/pause:
    post:
      tags: [portal]
      operationId: pausePolicy
      summary: Pause a policy
      description: |
        Appends `POLICY_PAUSED` unless it is already paused. A paused policy authorizes nothing.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: The policy, paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is not empty."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`policy_removed` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/policies/{policyId}/resume:
    post:
      tags: [portal]
      operationId: resumePolicy
      summary: Resume a paused policy
      description: |
        Appends `POLICY_RESUMED` unless it is already active. Resuming restores spending, so it needs a fresh
        sign-in time (v1.19 the person's token's), and the policy is validated again against today's seller list and the user's other
        policies.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
      responses:
        "200":
          description: The policy, active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body has an unknown field."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          description: A loosening change without a fresh sign-in time (`step_up_required`), or (v1.19) the person's token refused (`person_forbidden`, `person_mismatch`). Nothing is appended.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StepUpRequired"
                  - $ref: "#/components/schemas/PersonRefusal"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`policy_removed` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidPolicy"

  /v1/users/{userId}/policies/{policyId}/remove:
    post:
      tags: [portal]
      operationId: removePolicy
      summary: Remove a policy
      description: |
        Appends `POLICY_REMOVED` unless it is already removed. A removed policy never authorizes again and stays
        in the history.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: The policy, removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyView"
        "400":
          description: "`userId` is not a user identifier, or the body is not empty."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "404":
          $ref: "#/components/responses/PolicyNotFound"
        "409":
          description: "`account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/disable:
    post:
      tags: [portal]
      operationId: disableUser
      summary: Disable the user's account
      description: |
        Appends `USER_DISABLED` unless already disabled. From the next decision on, every payment for the user is
        DENIED with `user_disabled`. Nothing is deleted.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user, disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "409":
          description: "`not_registered`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/enable:
    post:
      tags: [portal]
      operationId: enableUser
      summary: Enable a disabled account
      description: |
        Needs a fresh sign-in time (v1.19 the person's token's). In one serialized section it appends one `POLICY_PAUSED` (cause
        `account_enabled`) for each active policy and then `USER_ENABLED`, so enabling alone never restarts
        spending. Nothing is appended when the account is already enabled.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
      responses:
        "200":
          description: The user, enabled, with every policy that was active now paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          description: "`userId` is not a user identifier, or the body has an unknown field."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          description: A loosening change without a fresh sign-in time (`step_up_required`), or (v1.19) the person's token refused (`person_forbidden`, `person_mismatch`). Nothing is appended.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StepUpRequired"
                  - $ref: "#/components/schemas/PersonRefusal"
        "409":
          description: "`not_registered`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/users/{userId}/cards/{cardId}:
    put:
      tags: [portal]
      operationId: addCard
      summary: Record a registered card
      description: |
        Appends `CARD_ADDED` with the card's identifier unless it is already there. The ledger never holds a
        brand, digits or an expiry, and a card never pays (FR-021).
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: The user's card identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "400":
          description: "`userId` is not a user identifier, or `cardId` is not a card identifier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "409":
          description: "`not_registered`, `account_disabled` or `card_limit` (5 cards)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [portal]
      operationId: removeCard
      summary: Record a removed card
      description: |
        Appends `CARD_REMOVED` if the card is there. Allowed while the account is disabled.
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: The user's card identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "400":
          description: "`userId` is not a user identifier, or `cardId` is not a card identifier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"

  /v1/users/{userId}/connections/{connectionId}:
    put:
      tags: [portal]
      operationId: openConnection
      summary: Record a connection to an outside platform (020)
      description: |
        Appends `CONNECTION_OPENED` with the portal's identifier and the platform unless this connection is already
        active. When another connection of the same platform is active, first appends `CONNECTION_CLOSED` for it with
        `cause: "replaced"`, in the same serialized section, and names it in `replaced`: a user has at most one
        connection per platform (specs/020 FR-010). The ledger never holds a grant, an account identifier, a balance,
        a name or an email (FR-023), and nothing here is read by a payment decision (FR-020).
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform]
              properties:
                platform:
                  $ref: "#/components/schemas/ConnectedPlatform"
      responses:
        "200":
          description: The user's active connections, and the one this call replaced, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "400":
          description: "`userId` is not a user identifier, `connectionId` is not a connection identifier, the platform is not `coinbase`, or the body has another key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"
        "409":
          description: "`not_registered`, `account_disabled`, or `connection_reused` (this identifier was previously opened in the ledger; an identifier is never reused)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [portal]
      operationId: closeConnection
      summary: Record a closed connection (020)
      description: |
        Appends `CONNECTION_CLOSED` if the connection is active; nothing otherwise. Allowed while the account is
        disabled (specs/020 FR-019).
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PersonAuthorization"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: The user's active connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "400":
          description: "`userId` is not a user identifier, or `connectionId` is not a connection identifier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPerson"
        "403":
          $ref: "#/components/responses/PersonRefused"

  /docs:
    get:
      tags: [docs]
      operationId: getApiDocsPage
      summary: Swagger UI for this document
      description: |
        Only with `API_DOCS=1`. The page loads its scripts and styles from L2 itself (`/docs/{asset}`),
        never from a CDN, and its Content-Security-Policy limits scripts and requests to the L2 origin.
      security: []
      responses:
        "200":
          description: The Swagger UI page.
          content:
            text/html:
              schema:
                type: string

  /docs/{asset}:
    get:
      tags: [docs]
      operationId: getApiDocsAsset
      summary: A Swagger UI file
      description: Only with `API_DOCS=1`. Serves these three files and nothing else.
      security: []
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [swagger-ui.css, swagger-ui-bundle.js, swagger-initializer.js]
      responses:
        "200":
          description: The file.
          content:
            text/css:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
        "404":
          description: Not one of the three files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi.yaml:
    get:
      tags: [docs]
      operationId: getApiDocument
      summary: This document
      description: Only with `API_DOCS=1`. Identical to the file, except `servers` is `/`, the L2 serving it.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    controlToken:
      type: http
      scheme: bearer
      description: "`CONTROL_TOKEN`, held by the agent process (L1)."
    settlementToken:
      type: http
      scheme: bearer
      description: "`SETTLEMENT_TOKEN`, held by the settlement verifier (L3)."
    operatorToken:
      type: http
      scheme: bearer
      description: "`OPERATOR_TOKEN`, held by the operator CLIs."
    portalToken:
      type: http
      scheme: bearer
      description: "`PORTAL_TOKEN`, held by the portal process (v1.10). It reaches the `portal` operations only."
    portalAdminToken:
      type: http
      scheme: bearer
      description: >-
        `PORTAL_ADMIN_TOKEN`, held by the portal process (v1.15). It reaches the `admin` operations only: no
        user-account operation, and never authorize, budget, reconcile or the operator's operations.

  parameters:
    CallerAuthorization:
      name: X-Caller-Authorization
      in: header
      required: false
      description: >-
        v1.17 (SEC-32). `Bearer <token>`: the access token the hosted agent's caller presented, forwarded
        unchanged beside the control token. L2 verifies it itself (signature, issuer, audience, validity, usable
        `sub`, the permission `agent:run`, for a machine caller `sub === <client>@clients`, and for a person a
        client in `AGENT_CLIENT_IDS`) and takes the user from it. Required where sign-in is configured at L2
        (`AUTH_ISSUER`, `AUTH_AUDIENCE`, `AGENT_CLIENT_IDS`), which user accounts need; not accepted where it is
        not (400 `caller_token_not_accepted`). A person's token when user accounts are off gets 403
        `user_accounts_off` (v1.29). Bounded at 600 checks/min per address across `/v1/authorize` and
        `/v1/budget/{sessionId}` when sign-in is configured. It opens nothing by itself and no other operation
        reads it. It is never stored, logged or returned.
      schema:
        type: string
        pattern: "^Bearer \\S+$"
    PersonAuthorization:
      name: X-Person-Authorization
      in: header
      required: true
      description: >-
        v1.19 (SEC-35). `Bearer <token>`: the person's own access token, forwarded by the portal unchanged beside
        its role token. Checked after the role token and a 6,000/min per-address rate limit (429 `too many
        requests` with `Retry-After`), before the body is read. L2 verifies it itself: the sign-in tenant's
        signature, issuer, audience, validity and a usable `sub` (401 `person_token_invalid`), not a machine token
        and issued to the portal's client `PORTAL_CLIENT_ID` (403 `person_forbidden`), and a sign-in time claim
        (`AUTH_TIME_CLAIM`, default `https://x402.dev/auth_time`) that is a non-negative integer not in the future
        beyond 60 s (401 `person_token_invalid`). The user is the token's, never a request value: on user-account
        routes, `:userId` format is checked first (400 `invalid userId`), then it must equal the token's user
        (403 `person_mismatch`). The step-up time of a loosening change is the token's sign-in time; an
        administrator's approval also needs its second-factor time (`https://x402.dev/mfa_time`). The
        administration routes need `portal:admin` in the token (403 `person_forbidden`). It opens nothing by
        itself and is never stored, logged or returned.
      schema:
        type: string
        pattern: "^Bearer \\S+$"
    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      description: The `authorizationId` of the ESCALATE decision.
      schema:
        type: string
        examples: [auth_009b55fe-307f-43ea-9014-a50e72f5576c]
    EscalationId:
      name: authorizationId
      in: path
      required: true
      description: The `authorizationId` of the ESCALATE decision. Anything of another shape is a 400.
      schema:
        type: string
        pattern: "^auth_[0-9a-f-]{36}$"
        examples: [auth_009b55fe-307f-43ea-9014-a50e72f5576c]
    UserId:
      name: userId
      in: path
      required: true
      description: The user identifier the portal derived from the person's verified sign-in.
      schema:
        $ref: "#/components/schemas/UserId"
    PolicyId:
      name: policyId
      in: path
      required: true
      description: A policy of this user. Another user's policy is 404, like an unknown one.
      schema:
        type: string
        examples: [pol_5d261ce5-d9c0-4e73-a3ec-ce1e79af4be4]
    CardId:
      name: cardId
      in: path
      required: true
      description: The opaque identifier the portal gave the card.
      schema:
        type: string
        pattern: "^card_[0-9a-f-]{36}$"
    ConnectionId:
      name: connectionId
      in: path
      required: true
      description: The portal's own identifier for one connection (020); a reconnect makes a new one.
      schema:
        type: string
        pattern: "^conn_[0-9a-f-]{36}$"

  responses:
    Unauthorized:
      description: Missing or wrong role bearer token (`unauthorized`). Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnauthorizedOrPerson:
      description: >-
        Missing or wrong role bearer token (`unauthorized`). Or, v1.19, with the role token accepted, the person's
        token in `X-Person-Authorization`: `person_token_required` (missing or malformed header) or
        `person_token_invalid` (invalid signature, issuer, audience, expiry, `sub`, or sign-in time claim).
        Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnauthorizedOrCaller:
      description: >-
        Missing or wrong bearer token (`unauthorized`). Or, v1.17, with the control token accepted, the caller's
        token: `caller_token_required` (sign-in is configured and none was forwarded), `caller_token_expired`
        (only its validity period is wrong) or `caller_token_invalid` (anything else about it). Nothing is
        appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyCallerChecks:
      description: >-
        v1.17. Where sign-in is configured: more than 600 requests in a minute from one address on the two routes
        that take a caller's token, counted together, after the control token was accepted and before the caller's
        token is verified. `Retry-After` says when to ask again. Nothing was verified, read, decided or appended.
      headers:
        Retry-After:
          description: Seconds until the next request is accepted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CallerForbidden:
      description: >-
        v1.17. `caller_forbidden`: the caller's token is valid and its holder may not call the agent: no
        `agent:run`, or a person's token from a client that is not one of the agent's (the portal's included).
        v1.29: `user_accounts_off`: a person's token, valid and allowed, while user accounts are off at this L2 (a
        person pays from their own account or not at all); its own code, so the agent can tell this state of L2
        from a token L2 refuses. Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PersonRefused:
      description: >-
        v1.19. The person's token is valid but not accepted here: `person_forbidden` (a machine token, another
        client's token, or on an administration route a token without `portal:admin`) or `person_mismatch` (the
        path names another user). Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PersonRefusal"
    EscalationNotFound:
      description: No ESCALATED entry has this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidUserId:
      description: "`userId` is not a user identifier."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PolicyNotFound:
      description: This user has no policy with this ID. Another user's policy answers the same.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StepUpRequired:
      description: >-
        A loosening change without a sign-in time at most 15 minutes old (60 s tolerance). Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StepUpRequired"
    InvalidPolicy:
      description: The policy breaks one or more rules. Every issue is listed. Nothing is appended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidPolicy"

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    AtomicAmount:
      type: string
      pattern: "^[0-9]+$"
      description: Decimal string of atomic units.
      examples: ["50000"]

    IsoTime:
      type: string
      format: date-time

    ResourceInfo:
      type: object
      required: [url]
      properties:
        url:
          type: string
        description:
          type: string
        mimeType:
          type: string
        serviceName:
          type: string
        tags:
          type: array
          items:
            type: string
        iconUrl:
          type: string

    PaymentRequirements:
      type: object
      description: One x402 v2 payment option (`@x402/core` `PaymentRequirements`).
      required: [scheme, network, asset, amount, payTo, maxTimeoutSeconds, extra]
      properties:
        scheme:
          type: string
          examples: [exact]
        network:
          type: string
          description: CAIP-2 network ID.
          examples: ["eip155:84532"]
        asset:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        payTo:
          type: string
        maxTimeoutSeconds:
          type: integer
        extra:
          type: object
          description: Scheme data; for `exact` on EVM, the token's EIP-712 `name` and `version`.

    PaymentRequired:
      type: object
      description: The seller's decoded `PAYMENT-REQUIRED` challenge, verbatim (`@x402/core` `PaymentRequired`).
      required: [x402Version, resource, accepts]
      properties:
        x402Version:
          type: integer
          examples: [2]
        error:
          type: string
        resource:
          $ref: "#/components/schemas/ResourceInfo"
        accepts:
          type: array
          maxItems: 20
          description: 1.19 at most 20 options, each with the field types of PaymentRequirements; otherwise 400.
          items:
            $ref: "#/components/schemas/PaymentRequirements"
        extensions:
          type: object

    PaymentIntent:
      type: object
      description: >-
        Payment authorization request from L1. Must not include `userId` or `approvalSubject` (v1.17: rejected
        with 400; the user comes from `X-Caller-Authorization`).
      required: [intentId, sessionId, resourceUrl, paymentRequired, purpose, createdAt]
      properties:
        intentId:
          type: string
          minLength: 1
          examples: [int_5d261ce5-d9c0-4e73-a3ec-ce1e79af4be4]
        sessionId:
          type: string
          minLength: 1
        resourceUrl:
          type: string
          format: uri
          description: The URL L1 requested; http or https only.
        paymentRequired:
          $ref: "#/components/schemas/PaymentRequired"
        purpose:
          type: string
          maxLength: 500
          description: The model's stated reason. Audit only; never a decision input (INV-5). 1.19 at most 500 characters; L1 cuts it to that.
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        operatorApprovalOnly:
          type: boolean
          description: >-
            v1.8 (L2-7, FR-007). true marks the intent operator-only: an escalation it creates sends no backchannel
            approval request and returns at once. It can only remove an approval path. Set by the L1-4 scripted
            agent; the hosted agent never sets it. A non-boolean value is 400.

    PolicyViolation:
      type: object
      additionalProperties: false
      required: [rule, detail]
      properties:
        rule:
          type: string
          description: >-
            Snake_case rule ID from SPEC §8.2 L2-2 (R1–R17, plus `no_payment_options`, `signer_rejected`, and
            v1.19 `decision_failed`).
          examples: [human_approval_required]
        detail:
          type: string

    AuthorizationDecision:
      oneOf:
        - $ref: "#/components/schemas/AuthorizedDecision"
        - $ref: "#/components/schemas/UnauthorizedDecision"
      discriminator:
        propertyName: status
        mapping:
          AUTHORIZED: "#/components/schemas/AuthorizedDecision"
          DENIED: "#/components/schemas/UnauthorizedDecision"
          ESCALATE: "#/components/schemas/UnauthorizedDecision"

    AuthorizedDecision:
      type: object
      additionalProperties: false
      required: [status, authorizationId, intentId, requirement, paymentHeaders, payer, validBefore, remainingSessionBudgetAtomic]
      properties:
        status:
          const: AUTHORIZED
        authorizationId:
          type: string
        intentId:
          type: string
        requirement:
          $ref: "#/components/schemas/PaymentRequirements"
        paymentHeaders:
          type: object
          description: Headers for the paid retry (`PAYMENT-SIGNATURE`). A signed payment; treat it as a secret.
          additionalProperties:
            type: string
        payer:
          type: string
        validBefore:
          type: integer
          description: Unix seconds after which the signed authorization is void.
        nonce:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          description: >-
            v1.19 the signed authorization's EIP-3009 nonce. L1 passes it to L3 in the settlement claim, and a
            NOT_SETTLED report releases the amount only for this nonce, read on-chain after validBefore (L2-4.1).
        remainingSessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"

    UnauthorizedDecision:
      type: object
      additionalProperties: false
      required: [status, authorizationId, intentId, violations]
      properties:
        status:
          type: string
          enum: [DENIED, ESCALATE]
          description: ESCALATE waits for an operator, administrator or backchannel phone decision; DENIED is final for this request.
        authorizationId:
          type: string
        intentId:
          type: string
        violations:
          type: array
          items:
            $ref: "#/components/schemas/PolicyViolation"

    BudgetStatus:
      type: object
      additionalProperties: false
      required: [sessionId, asset, decimals, sessionCapAtomic, spentOrReservedAtomic, remainingAtomic, perPaymentCapAtomic]
      properties:
        sessionId:
          type: string
        asset:
          type: string
        decimals:
          type: integer
        sessionCapAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        spentOrReservedAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        remainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        perPaymentCapAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: The auto-approve limit; larger payments escalate.
        scope:
          type: string
          enum: [session, user_daily]
          description: >-
            v1.10. What the figures count. Absent means the session (the platform account). `user_daily`: the user
            daily ceiling and the user's last 24 hours, with the highest auto-approve limit among their active,
            unexpired policies bounded by the platform cap (or zeros when not onboarded or disabled).
        account:
          type: string
          enum: [ready, not_onboarded, disabled]
          description: >-
            v1.29, on the user view only. Whether the person in the verified token can pay now: `not_onboarded`
            (no account set up at the portal), `disabled` (turned off at the portal), else `ready`. Paused or
            removed policies leave it `ready`: each purchase is then denied by policy. Never personal data.

    SettlementReport:
      type: object
      required: [authorizationId, status, network, finalityClass, detail, observedAt, verified]
      properties:
        authorizationId:
          type: string
        status:
          type: string
          enum: [CONFIRMED, PENDING, MISMATCH, NOT_SETTLED]
        transaction:
          type: string
        network:
          type: string
        blockNumber:
          type: string
        confirmations:
          type: integer
        finalityClass:
          type: string
          enum: [included, confirmed-depth, l1-safe]
        detail:
          type: string
        observedAt:
          $ref: "#/components/schemas/IsoTime"
        verified:
          type: object
          required: [asset, payer, payTo, amount]
          properties:
            asset:
              type: string
            payer:
              type: string
            payTo:
              type: string
            amount:
              $ref: "#/components/schemas/AtomicAmount"
            nonce:
              type: string
              description: v1.19 the authorization's EIP-3009 nonce, when the claim carried one. L2 compares it with its own.
        settlesBy:
          $ref: "#/components/schemas/IsoTime"
          description: >-
            v1.19, on a PENDING report only: the authorization could still be used, so L3 reads its nonce on-chain
            after this time (validBefore plus a margin), and re-checks then.

    ReconcileResult:
      type: object
      additionalProperties: false
      required: [ok, anomaly]
      properties:
        ok:
          const: true
        anomaly:
          type: boolean
          description: True when the report contradicts the authorization or an earlier CONFIRMED.

    ApprovalRequest:
      type: object
      properties:
        approver:
          type: string
          minLength: 1
          maxLength: 64
          default: operator
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 600
          description: How long the approval stays usable before it lapses (1.19 at most an hour).

    ApprovalResult:
      type: object
      additionalProperties: false
      required: [ok, approvalId, expiresAt]
      properties:
        ok:
          const: true
        approvalId:
          type: string
          examples: [apr_22489548-bc61-4ebe-87bc-df46de614eca]
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        alreadyApproved:
          const: true
          description: Present only when the escalation was already approved.

    RejectionRequest:
      type: object
      properties:
        operator:
          type: string
          minLength: 1
          maxLength: 64
          default: operator
          description: Self-declared label of whoever rejects.
        reason:
          type: string
          maxLength: 280

    RejectionResult:
      type: object
      additionalProperties: false
      required: [ok, rejectionId, rejectedAt, alreadyRejected]
      properties:
        ok:
          const: true
        rejectionId:
          type: string
          examples: [rej_03a1deba-0e67-4642-952d-0baca6103364]
        rejectedAt:
          $ref: "#/components/schemas/IsoTime"
        alreadyRejected:
          type: boolean

    DeniedConflict:
      type: object
      additionalProperties: false
      required: [error, state, rejectionId]
      properties:
        error:
          type: string
        state:
          const: denied
        rejectionId:
          type: string

    ApprovedConflict:
      type: object
      additionalProperties: false
      required: [error, state, approvalId]
      properties:
        error:
          type: string
        state:
          const: approved
        approvalId:
          type: string

    ExpiredConflict:
      type: object
      additionalProperties: false
      required: [error, state, expiresAt]
      properties:
        error:
          type: string
        state:
          const: expired
        expiresAt:
          $ref: "#/components/schemas/IsoTime"

    PendingEscalation:
      type: object
      additionalProperties: false
      required: [authorizationId, sessionId, resourceKey, payTo, amount, createdAt, expiresAt, referenceCode]
      properties:
        authorizationId:
          type: string
        sessionId:
          type: string
        resourceKey:
          type: string
        payTo:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        referenceCode:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: v1.8. The first 8 hex characters of the escalation ID; the phone of the person asked shows the same code.
        approvalRequest:
          $ref: "#/components/schemas/ApprovalRequestState"
        userId:
          $ref: "#/components/schemas/UserId"
          description: v1.10. Whose payment it is, when the escalation is a user's. An identifier, never a name.

    ApprovalRequestState:
      type: string
      description: >-
        v1.8 (L2-7). The backchannel approval request's state for a pending escalation. Present only when backchannel
        approval is on. v1.16/v1.17: `no_owner` (the escalation records no user, e.g., a machine caller or
        unconfigured sign-in), `no_identity` (a user with no subject; no longer arises from a request since v1.17
        because user and subject come from the same verified caller token), and `identity_mismatch` (`AUTH_ISSUER`
        differs from `CIBA_ISSUER`) ask nobody: the escalation waits for the operator and the administrators.
      enum: [requested, capped, operator_only, reevaluation, no_owner, no_identity, identity_mismatch, failed, verification_failed, lapsed]

    PendingEscalations:
      type: object
      additionalProperties: false
      required: [pending, cursor]
      properties:
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PendingEscalation"
        cursor:
          type: integer
          description: Last ledger `seq` (-1 when the ledger is empty). Pass it as `after` to the events feed.

    RejectionReasonCode:
      type: string
      description: v1.15. Why an administrator rejected a payment. A fixed list; the portal sends no text.
      enum: [not_expected, amount_too_high, wrong_seller, duplicate, other]

    DecisionChannel:
      type: string
      description: Where a decision came from. `portal` is v1.15.
      enum: [operator, backchannel, portal]

    AdminApprovalRequest:
      type: object
      additionalProperties: false
      description: >-
        v1.19: empty. The administrator, the time they last entered their credentials and the time of their second
        factor come from their own token (`X-Person-Authorization`); a body naming any of them is 400.
      properties: {}

    AdminRejectionRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      description: v1.19 the administrator comes from their own token; a body naming a decider is 400.
      properties:
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"

    ApprovedOutcome:
      type: object
      additionalProperties: false
      required: [ok, state, approvalId, expiresAt, already, channel, decidedBy]
      properties:
        ok:
          const: true
        state:
          const: approved
        approvalId:
          type: string
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        already:
          type: boolean
          description: True when the approval existed before this request, on any path. Nothing was appended.
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string

    DeniedOutcome:
      type: object
      additionalProperties: false
      required: [ok, state, rejectionId, rejectedAt, already, channel, decidedBy]
      properties:
        ok:
          const: true
        state:
          const: denied
        rejectionId:
          type: string
        rejectedAt:
          $ref: "#/components/schemas/IsoTime"
        already:
          type: boolean
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string

    OwnPayment:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          const: own_payment

    PersonRefusal:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          enum: [person_forbidden, person_mismatch]

    NotPending:
      type: object
      additionalProperties: false
      required: [error, state]
      description: The escalation already ended another way. `channel` and `decidedBy` are present when a person ended it.
      properties:
        error:
          const: not_pending
        state:
          type: string
          enum: [approved, denied, expired]
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
        approvalId:
          type: string
        rejectionId:
          type: string
        expiresAt:
          $ref: "#/components/schemas/IsoTime"

    AdminPendingEscalations:
      type: object
      additionalProperties: false
      required: [pending, cursor, readAt]
      properties:
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PendingEscalation"
        cursor:
          type: integer
          description: Last ledger `seq` (-1 when the ledger is empty).
        readAt:
          $ref: "#/components/schemas/IsoTime"

    EscalationEvent:
      type: object
      additionalProperties: false
      required: [seq, at, kind, authorizationId, sessionId, resourceKey, payTo, amount]
      properties:
        seq:
          type: integer
        at:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum:
            - escalated
            - approved
            - denied
            - expired
            - approval_lapsed
            - approval_requested
            - approval_request_failed
            - approval_request_lapsed
            - approval_verification_failed
        authorizationId:
          type: string
        sessionId:
          type: string
        resourceKey:
          type: string
        payTo:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalId:
          type: string
        approver:
          type: string
          description: >-
            On `approved` events, who approved, as the entry holds it: the operator's label; the administrator's
            `usr_…` for the portal; for the backchannel the owner's `usr_…` (v1.16), or the configured approver's
            subject in an entry written before v1.16.
        approvalExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        rejectionId:
          type: string
        operator:
          type: string
          description: Operator-channel rejections only.
        reason:
          type: string
          description: Operator-channel rejections only.
        referenceCode:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: >-
            Present on `escalated` and `approval_requested` events in `GET /v1/escalations/events`, and on every
            event in `GET /v1/admin/escalations/events`.
        approvalRequest:
          type: string
          enum: [requested, capped, operator_only, reevaluation, no_owner, no_identity, identity_mismatch]
          description: >-
            v1.8. On `escalated` events, when backchannel approval is on: the mark written with the escalation.
            v1.16 adds `no_owner`, `no_identity` and `identity_mismatch`, which ask nobody.
        channel:
          type: string
          enum: [operator, backchannel, portal]
          description: v1.8. On `approved` and `denied` events, the path that decided. v1.15 adds `portal`.
        decidedBy:
          type: string
          description: >-
            v1.8. The operator's label, or who answered on the phone. v1.15: for the portal channel, the
            administrator's identifier (`usr_…`). v1.16: for the backchannel, the identifier (`usr_…`) of the
            escalation's owner, the only person asked; an entry written before v1.16 holds the configured approver's
            subject (`sub`) instead, and is shown as it is.
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        requestId:
          type: string
        requestExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        failure:
          type: string
          enum: [unreachable, transient, permanent, interrupted, unrecoverable, no_owner]
          description: >-
            v1.16 adds `no_owner`: after a restart, an open request of an escalation that records no user (written
            before v1.16) is not polled again for anybody.
        error:
          type: string
          description: An OAuth error code from a fixed list, or `other`. Never the service's text.
        cause:
          type: string
          enum: [expired, late_refusal]
        check:
          type: string
          enum: [malformed, signature, issuer, audience, client, expired, owner, approver, request, details, replay]
          description: >-
            The verification step an answer failed. v1.16: `owner` (the answer is not from the person the
            escalation is for) replaces `approver`, which only entries written before v1.16 hold.
        userId:
          $ref: "#/components/schemas/UserId"
          description: >-
            v1.10. On `escalated` events of a user's payment in `GET /v1/escalations/events`, and on every event
            of a user's payment in `GET /v1/admin/escalations/events`.

    EscalationEvents:
      type: object
      additionalProperties: false
      required: [events, cursor]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EscalationEvent"
        cursor:
          type: integer

    BudgetLine:
      type: object
      additionalProperties: false
      required: [capAtomic, spentAtomic, remainingAtomic]
      description: v1.15. One budget a payment counts against. `remainingAtomic` is never below 0.
      properties:
        capAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        spentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        remainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"

    EscalationBudget:
      type: object
      additionalProperties: false
      required: [asset, decimals, applies, autoApproveMaxAtomic, hardCapPerPaymentAtomic, run, day, fits]
      description: >-
        v1.15. The budget behind an escalation, as of the read, under the rules that apply to its owner now: the
        same ledger-derived figures a decision uses. `fits: true` is no promise; the payment is decided again when
        the agent retries.
      properties:
        asset:
          type: string
        decimals:
          type: integer
        applies:
          type: boolean
          description: False when no rule set applies to this purchase now. Every line is then zero.
        notApplying:
          type: string
          enum: [user_not_onboarded, user_disabled, no_active_policy]
        autoApproveMaxAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        run:
          $ref: "#/components/schemas/BudgetLine"
        day:
          $ref: "#/components/schemas/BudgetLine"
        userDay:
          $ref: "#/components/schemas/BudgetLine"
        fits:
          type: boolean
          description: The amount is within the per-payment cap and within every remaining amount.

    EscalationDecision:
      type: object
      additionalProperties: false
      required: [at, channel, decidedBy]
      description: v1.15. How a person ended an escalation.
      properties:
        at:
          $ref: "#/components/schemas/IsoTime"
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
          description: "An identifier (`usr_…`) for the portal; for the phone the owner's identifier (`usr_…`, v1.16; an entry written before holds the configured approver's subject); the operator's label for the command line (text someone typed)."
        approvalId:
          type: string
        approvalExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        rejectionId:
          type: string
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        reason:
          type: string
          description: An operator's own words, from the command line. Untrusted text.

    EscalationDetail:
      type: object
      additionalProperties: false
      required: [authorizationId, sessionId, resourceKey, payTo, amount, createdAt, expiresAt, referenceCode, state, budget]
      description: v1.15. An escalation in any state.
      properties:
        authorizationId:
          type: string
        sessionId:
          type: string
        resourceKey:
          type: string
        payTo:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        referenceCode:
          type: string
          pattern: "^[0-9a-f]{8}$"
        approvalRequest:
          type: string
          description: >-
            The phone request's state; once the escalation has ended it may also be `answered`, `abandoned` (a
            person decided on another path while the request was open) or, v1.16, `unanswered` (nobody answered and
            the escalation expired). v1.16 also adds the marks that ask nobody: `no_owner`, `no_identity` and
            `identity_mismatch`.
          enum: [requested, capped, operator_only, reevaluation, no_owner, no_identity, identity_mismatch, failed, verification_failed, lapsed, answered, abandoned, unanswered]
        userId:
          $ref: "#/components/schemas/UserId"
        state:
          type: string
          enum: [pending, approved, denied, expired]
        decision:
          $ref: "#/components/schemas/EscalationDecision"
        budget:
          $ref: "#/components/schemas/EscalationBudget"

    EventPage:
      type: object
      additionalProperties: false
      required: [events, first, last, cursor, more]
      description: v1.15. One page of escalation events, oldest first.
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EscalationEvent"
        first:
          type: integer
          description: "`seq` of the first event of the page, or -1 when it is empty."
        last:
          type: integer
          description: "`seq` of the last event of the page, or -1 when it is empty."
        cursor:
          type: integer
          description: The ledger's last `seq` at the read.
        more:
          type: boolean
          description: Events exist beyond this page, in the direction asked.

    ChainCheck:
      type: object
      additionalProperties: false
      required: [entries, ok]
      properties:
        entries:
          type: integer
        ok:
          type: boolean
        brokenAt:
          type: integer
          description: >-
            0-based index (`seq`) of the first entry that fails hash, link, MAC (v1.19), or ledger-head hash
            verification, or the file's entry count (`entries`) when the file is shorter than `keyedFrom` (v1.19)
            or shorter than the stored ledger head (v1.23).

    # ---- v1.10 user accounts (L2-8) ---------------------------------------------------------------

    UserId:
      type: string
      pattern: "^usr_[0-9a-f]{32}$"
      description: >-
        v1.10. An opaque user identifier, derived from the person's verified sign-in. It reveals neither a name nor
        an email.
      examples: [usr_deeee4478bc01dab1b0afa3fbe31f010]

    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [acknowledgedTestFunds]
      properties:
        acknowledgedTestFunds:
          const: true
          description: The person acknowledged that the wallet holds test funds only.

    StepUpRequest:
      type: object
      additionalProperties: false
      description: >-
        v1.19: empty. The time the person last signed in interactively is their own token's sign-in time
        (`X-Person-Authorization`), which L2 accepts for a loosening change when it is at most 15 minutes old; a
        body naming a time is 400.
      properties: {}

    PolicyValues:
      type: object
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
      properties:
        sellers:
          type: array
          description: Where. Seller hosts (`host[:port]`) from the operator's seller list; 1 to 20.
          items:
            type: string
        autoApproveMaxAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: How much without asking. `0` means every payment needs a person.
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        sessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Per agent run.
        dailyBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Per trailing 24 hours, for this policy.
        maxAuthorizationsPerMinute:
          type: integer
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string
          enum: [crypto_account]
          description: How. A registered card can't pay (FR-021).

    PolicyCreateRequest:
      type: object
      additionalProperties: false
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
      properties:
        sellers:
          type: array
          items:
            type: string
        autoApproveMaxAtomic:
          type: string
        hardCapPerPaymentAtomic:
          type: string
        sessionBudgetAtomic:
          type: string
        dailyBudgetAtomic:
          type: string
        maxAuthorizationsPerMinute:
          type: number
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string

    PolicyChangeRequest:
      type: object
      additionalProperties: false
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
        - expectedVersion
      properties:
        sellers:
          type: array
          items:
            type: string
        autoApproveMaxAtomic:
          type: string
        hardCapPerPaymentAtomic:
          type: string
        sessionBudgetAtomic:
          type: string
        dailyBudgetAtomic:
          type: string
        maxAuthorizationsPerMinute:
          type: number
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string
        expectedVersion:
          type: integer
          minimum: 1
          description: The version the caller edited (integer ≥ 1). A mismatch is 409 `version_conflict`.

    PolicyVersion:
      type: object
      additionalProperties: false
      required: [seq, ts, kind, version]
      properties:
        seq:
          type: integer
        ts:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum: [created, changed, paused, resumed, removed]
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        cause:
          type: string
          enum: [user, account_enabled]

    PolicyView:
      type: object
      additionalProperties: false
      required: [policyId, version, values, state, displayState, expired, limitedByPlatform, unlistedSellers, updatedAt]
      properties:
        policyId:
          type: string
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        state:
          type: string
          enum: [active, paused, removed]
        displayState:
          type: string
          enum: [active, paused, removed, expired, disabled]
        expired:
          type: boolean
        limitedByPlatform:
          type: array
          description: Fields where the platform limit is currently stricter than the saved value (FR-043).
          items:
            type: string
        unlistedSellers:
          type: array
          description: Sellers no longer on the seller list (FR-042).
          items:
            type: string
        updatedAt:
          $ref: "#/components/schemas/IsoTime"
        history:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"

    UserWallet:
      type: object
      additionalProperties: false
      required: [address, network, asset, decimals, committedAtomic, spent24hAtomic, dailyCeilingAtomic, dailyRemainingAtomic]
      properties:
        address:
          type: string
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer
        committedAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Authorized amounts that can still settle.
        spent24hAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Committed spend over the last 24 hours, the figure the daily budget counts.
        dailyCeilingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyRemainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"

    UserView:
      type: object
      additionalProperties: false
      required: [userId, registered, enabled, onboarding, cards, connections, policies]
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        registered:
          type: boolean
        enabled:
          type: boolean
        onboarding:
          type: object
          additionalProperties: false
          required: [profile, wallet, policy]
          properties:
            profile:
              type: boolean
            wallet:
              type: boolean
            policy:
              type: boolean
        wallet:
          $ref: "#/components/schemas/UserWallet"
        cards:
          type: array
          items:
            type: string
        connections:
          description: 020 the active connections to outside platforms, identifiers only.
          type: array
          items:
            $ref: "#/components/schemas/UserConnection"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/PolicyView"

    ConnectedPlatform:
      type: string
      enum: [coinbase]

    UserConnection:
      type: object
      additionalProperties: false
      required: [connectionId, platform, connectedAt]
      properties:
        connectionId:
          type: string
          pattern: "^conn_[0-9a-f-]{36}$"
        platform:
          $ref: "#/components/schemas/ConnectedPlatform"
        connectedAt:
          type: string
          format: date-time

    ConnectionList:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [connectionId, platform]
            properties:
              connectionId:
                type: string
                pattern: "^conn_[0-9a-f-]{36}$"
              platform:
                $ref: "#/components/schemas/ConnectedPlatform"
        replaced:
          type: string
          pattern: "^conn_[0-9a-f-]{36}$"

    CardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            type: string
            pattern: "^card_[0-9a-f-]{36}$"

    PlatformLimits:
      type: object
      additionalProperties: false
      required: [hardCapPerPaymentAtomic, sessionBudgetAtomic, userDailyCeilingAtomic, maxAuthorizationsPerMinute, maxPolicyDays]
      properties:
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        sessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        userDailyCeilingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: The user daily ceiling (FR-032), and the highest daily budget one policy may have.
        maxAuthorizationsPerMinute:
          type: integer
        maxPolicyDays:
          type: integer

    PlatformSeller:
      type: object
      additionalProperties: false
      required: [host, name, payees]
      properties:
        host:
          type: string
        name:
          type: string
          description: The operator's name for the seller, shown to users.
        payees:
          type: array
          description: >-
            Accepted payee addresses, lower-cased. Empty means any payee at that host (allowed only on
            `NETWORK=local`; outside local, L2 refuses to start if any listed seller has empty `payees`, v1.19).
          items:
            type: string

    PlatformView:
      type: object
      additionalProperties: false
      required: [platformId, digest, limits, sellers, network, asset, decimals, phoneApproval]
      properties:
        platformId:
          type: string
        digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        limits:
          $ref: "#/components/schemas/PlatformLimits"
        sellers:
          type: array
          items:
            $ref: "#/components/schemas/PlatformSeller"
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer
        phoneApproval:
          type: boolean
          description: >-
            v1.16 (L2-7): whether phone approval is advertised to the portal; currently always `false` until the
            per-user waiting-payments view lands.

    PolicyIssue:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          enum:
            - not_atomic
            - order_auto_below_cap
            - order_cap_within_session
            - above_platform_limit
            - rate_invalid
            - no_sellers
            - too_many_sellers
            - seller_not_listed
            - seller_conflict
            - expires_in_past
            - expires_too_late
            - payment_method_unsupported
            - policy_limit
        host:
          type: string
        policyId:
          type: string
        limitAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        limit:
          type: integer

    InvalidPolicy:
      type: object
      additionalProperties: false
      required: [error, issues]
      properties:
        error:
          const: invalid_policy
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PolicyIssue"

    StepUpRequired:
      type: object
      additionalProperties: false
      required: [error, maxAgeSec]
      properties:
        error:
          const: step_up_required
        maxAgeSec:
          type: integer

    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, current]
      properties:
        error:
          const: version_conflict
        current:
          $ref: "#/components/schemas/PolicyView"
