# Seller HTTP API (SPEC.md CP-1, CP-3) as OpenAPI 3.1: the demo counterparty, an x402 v2 resource server.
# SPEC.md stays normative. test/openapi-seller.test.ts (T-API-09..11) fails when this file and the running seller
# disagree on routes, tiers, prices, statuses, headers or response shapes, so change both together. Each route's tier
# and price come from its decorators in src/counterparty/seller-api.ts.
openapi: 3.1.0
info:
  title: Seller API
  version: "1.30.1"
  summary: The demo seller of the x402 three-layer agent payments PoC, selling JSON resources for USDC.
  description: |
    A simulated external party: a free catalog and four priced routes, paid with x402 v2 (`exact` scheme, an
    EIP-3009 USDC transfer authorization). Its responses are mock data, deterministic per input.

    **Monetization model** (`x-monetization-tier` on each operation; the catalog lists each route's `tier`):
    freemium discovery plus pay-per-use in tiers priced by value, two of the models in Stripe's "What is API
    monetization?". x402 has no accounts, so every paid call is a single purchase.

    | Tier | Routes | Price per call | For |
    |---|---|---|---|
    | `free` | `/api/catalog` | none | discovery; answers even while payments can't be taken |
    | `pay-per-use` | `/api/weather`, `/api/market-brief` | 0.001, 0.005 USDC | everyday data |
    | `premium` | `/api/premium-report` | 0.05 USDC | high-value data, priced higher |
    | `enterprise` | `/api/dataset-export` | 0.50 USDC | bulk data |

    A tier is a label with a price. The buyer's own policy decides from the price: with L2's default mandate an
    agent's premium purchase escalates to an operator and an enterprise purchase is denied.

    **Paying for a route** (what L1 does, with L2 signing):
    1. `GET` the route without payment: **402** with `Cache-Control: no-store`, a JSON body
       (`{"error": "Payment required"}`, since `@x402/*` 2.31), and a `PAYMENT-REQUIRED` header (base64 JSON
       naming the price `amount` in atomic units, the asset, the network, `payTo`, `maxTimeoutSeconds: 120`,
       and the token's EIP-712 domain in `extra`).
    2. Sign a payment for exactly those requirements and repeat the request with it in `PAYMENT-SIGNATURE`.
    3. The seller has its facilitator verify the payment, prepares the resource, settles, and answers **200**
       with the resource, `Cache-Control: private`, and a `PAYMENT-RESPONSE` header (base64 JSON with the
       transaction hash).

    A rejected payment, or one for another route, gets the 402 challenge again (its `error` — in both the
    `PAYMENT-REQUIRED` payload and the JSON body — says why). A failed settlement gets 402 with an empty JSON
    body `{}` and a `PAYMENT-RESPONSE` whose `success` is false (no `PAYMENT-REQUIRED`), and the resource is
    not served. When the facilitator fails (`unavailable`, `authentication`, `rate-limited`, or `unsupported`),
    priced routes answer 503 before a challenge (lazy `/supported` sync, retried on the next priced request)
    and 502 during a paid retry (`/verify` or `/settle`). Hosted facilitators time out after 30 s.

    **Limits** (v1.24): at most 600 requests a minute per client address to anything other than the free routes
    (the catalog and, when enabled, the docs), counted in memory before the payment middleware — so before any
    facilitator call, including retried `/supported` syncs. Beyond 600/min, the seller answers 429 with
    `Retry-After` (and no `RateLimit-*` headers). Behind a single reverse proxy (`TRUSTED_PROXY_HOPS=1`, as in
    Azure) the address comes from `X-Forwarded-For`; when unset or `0`, that header is ignored.

    - **Amounts** are decimal strings of atomic units (USDC has 6 decimals: `"1000"` is 0.001 USDC; the seller
      refuses any network profile whose asset does not have 6 decimals).
    - **Networks & facilitators.** Locally `eip155:31337` with a mock USDC (EIP-712 name `"USD Coin"`) and the
      local facilitator (`FACILITATOR=local`); on Base Sepolia `eip155:84532` with Circle USDC (EIP-712 name
      `"USDC"`) and the JWT-authenticated CDP facilitator (`FACILITATOR=cdp` by default; `FACILITATOR=public`
      opts into `https://x402.org/facilitator` with no runtime fallback; CP-3). The catalog names the network
      and asset in use.
    - **API docs.** With `API_DOCS=1`, the seller also serves this document and Swagger UI at `/docs`, mounted
      before the rate limiter and payment middleware (free, never rate-limited, never calls the facilitator).
      Unset, empty, or `0` leaves those routes unmounted; any other value fails startup. The Azure deployment
      never sets `API_DOCS`. A browser can't sign a payment, so "Try it out" on a priced route shows its 402
      challenge.
servers:
  - url: http://127.0.0.1:4021
    description: Default local URL (npm run seller binds 0.0.0.0:4021; override port with SELLER_PORT)
tags:
  - name: free
    description: Freemium discovery, no payment.
  - name: pay-per-use
    description: Everyday data, paid per call with x402 (`exact`, USDC).
  - name: premium
    description: High-value data, priced higher.
  - name: enterprise
    description: Bulk data at a substantial per-call price.
  - name: docs
    description: Swagger UI and this document. Mounted only when `API_DOCS=1`; free.

paths:
  /api/catalog:
    get:
      tags: [free]
      operationId: getCatalog
      summary: The price list
      description: Free, never rate-limited, and always available, even while the facilitator is down.
      x-monetization-tier: free
      responses:
        "200":
          description: The network, the asset and every priced route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"

  /api/weather:
    get:
      tags: [pay-per-use]
      operationId: getWeather
      summary: Current weather for a city (0.001 USDC)
      description: The price doesn't depend on the query. Mock data, deterministic per city.
      x-monetization-tier: pay-per-use
      x-x402-price-atomic: "1000"
      parameters:
        - name: city
          in: query
          required: false
          description: The city; defaults to `Lima` when missing, empty, or repeated.
          schema:
            type: string
            examples: [Lima]
        - $ref: "#/components/parameters/PaymentSignature"
      responses:
        "200":
          description: Paid and settled.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
            Cache-Control:
              $ref: "#/components/headers/PaidCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/FacilitatorFailed"
        "503":
          $ref: "#/components/responses/FacilitatorUnavailable"

  /api/market-brief:
    get:
      tags: [pay-per-use]
      operationId: getMarketBrief
      summary: Daily market brief (0.005 USDC)
      x-monetization-tier: pay-per-use
      x-x402-price-atomic: "5000"
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
      responses:
        "200":
          description: Paid and settled.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
            Cache-Control:
              $ref: "#/components/headers/PaidCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketBrief"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/FacilitatorFailed"
        "503":
          $ref: "#/components/responses/FacilitatorUnavailable"

  /api/premium-report:
    get:
      tags: [premium]
      operationId: getPremiumReport
      summary: Premium research report (0.05 USDC)
      description: Above L2's default auto-approve limit, so the agent's purchase escalates to an operator.
      x-monetization-tier: premium
      x-x402-price-atomic: "50000"
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
      responses:
        "200":
          description: Paid and settled.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
            Cache-Control:
              $ref: "#/components/headers/PaidCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PremiumReport"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/FacilitatorFailed"
        "503":
          $ref: "#/components/responses/FacilitatorUnavailable"

  /api/dataset-export:
    get:
      tags: [enterprise]
      operationId: getDatasetExport
      summary: Full dataset export (0.50 USDC)
      description: Above L2's default per-payment cap, so the agent's purchase is denied.
      x-monetization-tier: enterprise
      x-x402-price-atomic: "500000"
      parameters:
        - $ref: "#/components/parameters/PaymentSignature"
      responses:
        "200":
          description: Paid and settled.
          headers:
            PAYMENT-RESPONSE:
              $ref: "#/components/headers/PaymentResponse"
            Cache-Control:
              $ref: "#/components/headers/PaidCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetExport"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/FacilitatorFailed"
        "503":
          $ref: "#/components/responses/FacilitatorUnavailable"

  /docs:
    get:
      tags: [docs]
      operationId: getApiDocsPage
      summary: Swagger UI for this document
      description: |
        Only with `API_DOCS=1` (free, never rate-limited, makes no facilitator call). The page loads its scripts
        and styles from the seller itself (`/docs/{asset}`), never from a CDN, and its Content-Security-Policy
        limits scripts and requests to the seller's origin.
      responses:
        "200":
          description: The Swagger UI page.
          headers:
            Content-Security-Policy:
              description: >-
                `default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;
                connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'`
              required: true
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string

  /docs/{asset}:
    get:
      tags: [docs]
      operationId: getApiDocsAsset
      summary: A Swagger UI file
      description: Only with `API_DOCS=1` (free, never rate-limited). Serves these three files and nothing else.
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [swagger-ui.css, swagger-ui-bundle.js, swagger-initializer.js]
      responses:
        "200":
          description: The file.
          content:
            text/css:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
        "404":
          description: Not one of the three files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi.yaml:
    get:
      tags: [docs]
      operationId: getApiDocument
      summary: This document
      description: Only with `API_DOCS=1` (free, never rate-limited). Identical to the file, except `servers` is `/`, the seller serving it.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

components:
  parameters:
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      required: false
      description: |
        The x402 payment: base64 JSON of a `PaymentPayload` whose `accepted` repeats the requirements of the 402
        challenge. Without it, or with one that doesn't verify, the route answers 402.
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json
        contentSchema:
          $ref: "#/components/schemas/PaymentPayload"

  headers:
    PaymentRequired:
      description: The x402 challenge, base64 JSON. Absent when the 402 answers a failed settlement.
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json
        contentSchema:
          $ref: "#/components/schemas/PaymentRequired"
    PaymentResponse:
      description: The settlement, base64 JSON. On a 200 `success` is true and `transaction` is the hash.
      required: true
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json
        contentSchema:
          $ref: "#/components/schemas/SettleResponse"
    FailedSettlement:
      description: Present only when the 402 answers a failed settlement (`success` false).
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json
        contentSchema:
          $ref: "#/components/schemas/SettleResponse"
    PaidCacheControl:
      description: Always `private` on settled 200 responses so shared caches do not store settlement metadata.
      required: true
      schema:
        type: string
        const: private
    PaymentRequiredCacheControl:
      description: Always `no-store` on 402 responses (challenges and failed settlements).
      required: true
      schema:
        type: string
        const: no-store

  responses:
    PaymentRequired:
      description: |
        No payment, a payment that doesn't verify or matches no requirement of this route (the challenge's
        `error` says which), or a failed settlement (`PAYMENT-RESPONSE` with `success` false instead of a
        challenge). The resource is not served.
      headers:
        PAYMENT-REQUIRED:
          $ref: "#/components/headers/PaymentRequired"
        PAYMENT-RESPONSE:
          $ref: "#/components/headers/FailedSettlement"
        Cache-Control:
          $ref: "#/components/headers/PaymentRequiredCacheControl"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            description: |
              Repeats the challenge's `error` (e.g. `"Payment required"` when unpaid, or the verification
              rejection reason, since `@x402/*` 2.31), or an empty object `{}` on a failed settlement (where
              `PAYMENT-RESPONSE` carries `errorReason`).
            properties:
              error:
                type: string
    FacilitatorFailed:
      description: |
        The facilitator failed while verifying or settling a paid retry (30 s timeout on hosted facilitators).
        The resource is not served. Only the failure category is returned; upstream detail is redacted and logged
        to stderr.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: string
                pattern: "^facilitator (unavailable|authentication|rate-limited|unsupported)$"
    FacilitatorUnavailable:
      description: |
        The facilitator's `/supported` sync failed, so no challenge can be issued (retried on the next priced
        request). Categories: `unavailable` (timeout, network error, 5xx, malformed body), `authentication`
        (401 or 403), `rate-limited` (429 or 402), `unsupported` (`exact` on this network missing from `/supported`).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, category]
            properties:
              error:
                type: string
                pattern: "^facilitator (unavailable|authentication|rate-limited|unsupported)$"
              category:
                type: string
                enum: [unavailable, authentication, rate-limited, unsupported]

    TooManyRequests:
      description: |
        More than 600 requests in a minute from this client address to anything but the free routes (v1.24). Every
        such request can reach the facilitator, so the seller bounds them before the payment middleware; the catalog
        and the docs never count. Nothing was verified or settled.
      headers:
        Retry-After:
          description: Seconds until the address may send again.
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: string
                enum: [too many requests]

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    AtomicAmount:
      type: string
      pattern: "^[0-9]+$"
      description: Decimal string of atomic units.

    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"

    Network:
      type: string
      pattern: "^eip155:[0-9]+$"
      description: CAIP-2 chain ID (`eip155:31337` local, `eip155:84532` Base Sepolia).

    Catalog:
      type: object
      additionalProperties: false
      required: [network, asset, decimals, items]
      properties:
        network:
          $ref: "#/components/schemas/Network"
        asset:
          $ref: "#/components/schemas/Address"
        decimals:
          type: integer
          description: Token decimals (always `6` for USDC).
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"

    CatalogItem:
      type: object
      additionalProperties: false
      required: [path, priceAtomic, description, tier]
      properties:
        path:
          type: string
          examples: [/api/weather?city=]
        priceAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        description:
          type: string
        tier:
          type: string
          enum: [pay-per-use, premium, enterprise]
          description: The route's monetization tier. The catalog lists priced routes only, so never `free`.

    Weather:
      type: object
      additionalProperties: false
      required: [city, tempC, condition, source]
      properties:
        city:
          type: string
        tempC:
          type: integer
          description: Deterministic mock temperature in Celsius (`0`–`34`).
        condition:
          type: string
          enum: [sunny, cloudy, rain, fog]
        source:
          type: string

    MarketBrief:
      type: object
      additionalProperties: false
      required: [headline, bullets, source]
      properties:
        headline:
          type: string
        bullets:
          type: array
          items:
            type: string
        source:
          type: string

    PremiumReport:
      type: object
      additionalProperties: false
      required: [title, pages, source]
      properties:
        title:
          type: string
        pages:
          type: integer
        source:
          type: string

    DatasetExport:
      type: object
      additionalProperties: false
      required: [rows, source]
      properties:
        rows:
          type: integer
        source:
          type: string

    ResourceInfo:
      type: object
      required: [url]
      properties:
        url:
          type: string
        description:
          type: string
        mimeType:
          type: string

    PaymentRequirements:
      type: object
      required: [scheme, network, amount, asset, payTo, maxTimeoutSeconds]
      description: One way to pay. This seller offers exactly one per route.
      properties:
        scheme:
          const: exact
        network:
          $ref: "#/components/schemas/Network"
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        asset:
          $ref: "#/components/schemas/Address"
        payTo:
          $ref: "#/components/schemas/Address"
        maxTimeoutSeconds:
          type: integer
          description: Maximum authorization validity window in seconds (`120` on this seller).
        extra:
          type: object
          description: The token's EIP-712 domain (`name`, `version`).
          properties:
            name:
              type: string
              examples: [USD Coin, USDC]
            version:
              type: string
              examples: ["2"]

    PaymentRequired:
      type: object
      required: [x402Version, resource, accepts]
      description: The decoded `PAYMENT-REQUIRED` header (x402 v2).
      properties:
        x402Version:
          const: 2
        error:
          type: string
          description: Why the request wasn't served, e.g. `Payment required`, `invalid_signature`, `No matching payment requirements`.
        resource:
          $ref: "#/components/schemas/ResourceInfo"
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequirements"

    PaymentPayload:
      type: object
      required: [x402Version, accepted, payload]
      description: The decoded `PAYMENT-SIGNATURE` header (x402 v2).
      properties:
        x402Version:
          const: 2
        resource:
          $ref: "#/components/schemas/ResourceInfo"
        accepted:
          $ref: "#/components/schemas/PaymentRequirements"
        payload:
          type: object
          description: The scheme's proof; for `exact` on EVM, an EIP-3009 authorization and its signature.

    SettleResponse:
      type: object
      required: [success, transaction, network]
      description: The decoded `PAYMENT-RESPONSE` header (x402 v2).
      properties:
        success:
          type: boolean
        errorReason:
          type: string
        errorMessage:
          type: string
        payer:
          $ref: "#/components/schemas/Address"
        transaction:
          type: string
          description: The transaction hash (`0x…`), or empty when no transaction was submitted; may still be present on a failed settlement.
        network:
          $ref: "#/components/schemas/Network"
        amount:
          $ref: "#/components/schemas/AtomicAmount"
