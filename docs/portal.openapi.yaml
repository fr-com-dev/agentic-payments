            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such setup for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
