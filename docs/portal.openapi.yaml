# Portal HTTP API (SPEC.md §8.2 L2-8; specs/013, 014, 017, 020 contracts) as OpenAPI 3.1.
# SPEC.md and the contracts stay normative. test/openapi-portal.test.ts (T-API-12..15) fails when this file and the
# running portal disagree on routes, the bearer scheme or response shapes, so change both together.
openapi: 3.1.0
info:
  title: Portal API
  version: "1.31.0"
  summary: Onboarding, profile, wallet, connected platforms, expense policies and administration of the x402 three-layer agent payments PoC.
  description: |
    The portal is where a person sets up what their agent may spend. It serves a web app and this API from one
    origin, and it holds no payment key: deciding and signing stay in L2.

    - **One person per request.** Every `/api` operation except `GET /api/config` needs the person's own access token
      (`Authorization: Bearer <token>`, no cookie) from the sign-in tenant (Auth0): for the API, issued to the
      portal's web app (`PORTAL_CLIENT_ID`). No permission and no role is asked for on user routes (since v1.14):
      whoever signs in through the portal's web app may use it, for their own account. The user is derived from the
      token (`userIdFor(issuer, sub)`) and nothing else: no operation takes a user identifier. Since v1.19, the portal
      also forwards the person's token unchanged to L2 in `X-Person-Authorization` on every user and administration
      call (except `GET /v1/platform`), and L2 verifies it itself.
    - **A token for the agent service is refused** (403: it comes from another client), and so is a machine token.
      A token of any other issuer, the organization's directory included, is not valid here (401). Since v1.27, every
      401 carries `WWW-Authenticate: Bearer realm="x402-portal"`, with `, error="invalid_token"` when a token was sent
      and failed a check; 403 carries none.
    - **Local dev sign-in guard (v1.27).** With the local dev issuer (`AUTH_JWKS_FILE`, `NETWORK=local` only), the
      portal binds a loopback address with `TRUSTED_PROXY_HOPS=0` and, right after setting security headers and before
      every route (health, docs, `/api/config` and static screens included), answers `421 { "error": "misdirected
      request" }` to any request whose `Host` is not a loopback name (`localhost`, `127.0.0.1`, `[::1]`, with or
      without port) or that carries any forwarding header (`Forwarded`, `X-Forwarded-For`, `X-Forwarded-Host`,
      `X-Forwarded-Proto`, `Via`).
    - **Rate and body limits.** On every `/api` route except `GET /api/config` (unauthenticated and uncounted): 300
      requests/minute per client address (before token verification), then 20 failed authentications (`401`) per
      client address per minute (once reached, every `/api` request from that address gets 429 before the token is
      read, v1.27), then 120 requests/minute per person, all per replica (`429 { "error": "too many requests" }` with
      `Retry-After`). `POST /api/connections/coinbase/start` also enforces 10 starts/minute per person. JSON request
      bodies are limited to 16 KB (`413 { "error": "body too large" }`); unparsable JSON answers `400 { "error":
      "malformed JSON body" }`.
    - **Security headers and SPA routing (v1.27).** Every response (errors and 421 included) carries
      `Content-Security-Policy`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`,
      `Permissions-Policy`, `Cross-Origin-Resource-Policy: same-origin`, `Cross-Origin-Opener-Policy:
      same-origin-allow-popups`, and `Strict-Transport-Security: max-age=31536000; includeSubDomains` whenever `Host`
      is not a loopback name. Every `/api` response also carries `Cache-Control: no-store`. Outside `/api`, the portal
      returns 200 with the web app only for known screen paths (including `/wallet/return`, v1.30.1); unknown paths
      return 404 (the web app HTML for browser `GET`/`HEAD` requests accepting `text/html`, otherwise `{ "error":
      "not found" }`; dot-paths, traversals and missing `/assets/*` files always return JSON 404).
    - **Amounts.** Policy inputs take USDC text with at most 6 decimals (never rounded) and come back as decimal
      strings of atomic units (`"20000"` is 0.02 USDC). Connected-platform (Coinbase) balances come back as exact
      decimal strings in each asset's own units with USD values rounded half-to-even to the cent.
    - **Step-up and MFA.** Creating or loosening a policy, resuming one, or enabling the account needs a sign-in
      (`AUTH_TIME_CLAIM`, default `https://x402.dev/auth_time`) at most 15 minutes old (60 s tolerance); otherwise
      403 `step_up_required`. Approving an escalation in the administration area also needs a second factor
      (`https://x402.dev/mfa_time`) at most 15 minutes old (v1.19); otherwise 403 `step_up_required`.
    - **Cards** are saved at a card vault (Stripe in test mode, restricted test key `rk_test_…`, `usage=on_session`)
      and never charged. The card number and security code never reach this API. Off unless `CARD_VAULT=stripe`.
    - **Connected platforms (v1.30, v1.30.1).** Off by default (`CONNECTED_PLATFORMS` unset). With
      `CONNECTED_PLATFORMS=coinbase`, users with a profile may connect their own Coinbase account read-only
      (`wallet:accounts:read offline_access`) via OAuth 2.0 authorization code + PKCE S256 returning to
      `/wallet/return` (v1.30.1). Balances are view-only and never enter any payment, policy, budget, approval or
      reconciliation path.
    - **Administration area (v1.15).** Mounted under `/api/admin/*` only when `PORTAL_ADMIN=1`; requires the
      `portal:admin` permission.
    - **API docs.** With `API_DOCS=1`, the portal also serves this document and Swagger UI at `/docs`. Those
      routes take no token and are not mounted by default. When served, `servers` points at that portal.
servers:
  - url: http://127.0.0.1:4025
    description: Default local bind
tags:
  - name: health
    description: Liveness and readiness. No token.
  - name: session
    description: Public configuration for the web app, and the signed-in person.
  - name: wallet
    description: The crypto account, registered cards, and connected platforms (view-only Coinbase balances, v1.30).
  - name: policies
    description: Expense policies.
  - name: account
    description: Disabling and enabling the account.
  - name: administration
    description: >-
      v1.15 the administration area (L2-8). Mounted only when `PORTAL_ADMIN=1`. For a signed-in person whose token
      carries the permission `portal:admin` (verified by the portal and again by L2 on the forwarded token, v1.19);
      anyone else gets 403 and the control service is not called. No operation takes a user identifier or any free
      text: the decider, sign-in time and second-factor time come from the verified token.
  - name: docs
    description: Swagger UI and this document. Mounted only when `API_DOCS=1`; no token.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: "Liveness"
      security: []
      responses:
        "200":
          description: "Alive."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: "Readiness"
      security: []
      responses:
        "200":
          description: "Ready."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: "Still starting."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/config:
    get:
      tags: [session]
      operationId: getConfig
      summary: "Public values the web app needs before anyone signs in"
      description: |
        The sign-in mode and identifiers, and whether cards are available (plus the card vault's publishable test key
        when cards are on). Nothing here is a secret. Unauthenticated and exempt from the `/api` rate limits. The
        network profile and administration flag were removed in v1.27 (the web app reads `admin` from `GET /api/me`).
      security: []
      responses:
        "200":
          description: "The configuration."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /api/me:
    get:
      tags: [session]
      operationId: getMe
      summary: "The signed-in person: onboarding steps, account state and profile"
      description: |
        v1.15: `admin` is `true` only when `PORTAL_ADMIN=1` and the token carries `portal:admin`. Every signed-in
        person is a user, an administrator included. `profile` is present once saved via `PUT /api/profile`.
      security:
        - personToken: []
      responses:
        "200":
          description: "The person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/profile:
    put:
      tags: [session]
      operationId: putProfile
      summary: "Create or change the profile"
      description: |
        The first save needs `acknowledgedTestFunds: true` and registers the user. Later saves change the name and
        email only; they never touch the wallet, the policies or the ledger. Allowed while the account is disabled.
      security:
        - personToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: "The person, with the saved profile."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: "Malformed body: not an object, an unknown field, or unparsable JSON."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: "A field is invalid, or the first save lacks the acknowledgement."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidProfile"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/platform:
    get:
      tags: [policies]
      operationId: getPlatform
      summary: "The limits and the sellers a policy may use"
      description: |
        The operator's ceilings and seller list, as a person needs them: sellers by name and host. Payee addresses
        are not returned.
      security:
        - personToken: []
      responses:
        "200":
          description: "Limits and sellers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations:
    get:
      tags: [administration]
      operationId: adminListEscalations
      summary: "Payments waiting for a person's approval, oldest first"
      description: |
        Every pending escalation of the deployment, for every user and for the platform account. A user is named by
        identifier only. `mine` marks the signed-in administrator's own payments, which they can see and can't decide.
      security:
        - personToken: []
      responses:
        "200":
          description: "The waiting list and when it was read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEscalationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/events:
    get:
      tags: [administration]
      operationId: adminListEvents
      summary: "What happened to each escalation, in pages"
      description: |
        Each escalation created, each phone request, each approval and rejection with its path and who decided, each
        expiry. Oldest first within a page. With `after`: the next events after a sequence number. With `before`:
        the ones just before it. With neither: the latest. Reading by cursor yields every event exactly once.
      security:
        - personToken: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: -1
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: -1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: "One page of events."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEventPage"
        "400":
          description: "A bad `limit` or cursor, both cursors, or any other query parameter. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/{authorizationId}:
    get:
      tags: [administration]
      operationId: adminGetEscalation
      summary: "One payment in any state, with how it ended and the budget behind it"
      description: |
        For a payment from the waiting list or the activity trail: what it is, its state, who decided it and on which
        path, and the budget it counts against: this agent run, the last 24 hours under the same rules, and for a
        user's payment the user's last 24 hours against the daily ceiling. `fits: false` means approving will not
        make it payable as things stand.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/EscalationId"
      responses:
        "200":
          description: "The payment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEscalationDetail"
        "400":
          description: "A malformed ID. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No escalation has this ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/{authorizationId}/approve:
    post:
      tags: [administration]
      operationId: adminApproveEscalation
      summary: "Approve one waiting payment"
      description: |
        The request says only which payment. Who decides, when they last entered their credentials (`AUTH_TIME_CLAIM`),
        and when they last completed a second factor (`https://x402.dev/mfa_time`, v1.19) all come from the verified
        token forwarded to L2 in `X-Person-Authorization`; any body field is refused before L2 is called. The control
        service then checks that the payment is still pending, that it is not the decider's own (`own_payment`), that
        the sign-in is at most 15 minutes old (60 s tolerance), and that the second factor (`mfa_time`) is present and
        also at most 15 minutes old (60 s tolerance). An approval is valid for 600 s and lets the agent make that one
        payment once, if it still fits the rules at that moment.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/EscalationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: "Decided now, or already decided the same way on any path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedOutcome"
        "400":
          description: "A malformed ID, unparsable JSON, or any body field. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (not an administrator), `own_payment` (the payment is the decider's own), or `step_up_required` (the sign-in or second factor `https://x402.dev/mfa_time` is missing or older than 15 minutes)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/StepUpRequired"
        "404":
          description: "No escalation has this ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The payment already ended another way: `state`, and the path and decider when a person ended it. Nothing is recorded."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotPending"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/{authorizationId}/reject:
    post:
      tags: [administration]
      operationId: adminRejectEscalation
      summary: "Reject one waiting payment"
      description: |
        A reason from the fixed list and nothing else: there is no text field. Runs the same checks as an approval,
        without the sign-in or second-factor (MFA) age checks. The agent's next attempt at that purchase is refused,
        and it learns neither the reason nor who rejected.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/EscalationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionInput"
      responses:
        "200":
          description: "Decided now, or already decided the same way on any path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedOutcome"
        "400":
          description: "A malformed ID, unparsable JSON, an invalid `reasonCode`, or any other body field. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (not an administrator), or `own_payment` (the payment is the decider's own)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "No escalation has this ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The payment already ended another way: `state`, and the path and decider when a person ended it. Nothing is recorded."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotPending"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/ledger/verify:
    get:
      tags: [administration]
      operationId: adminVerifyLedger
      summary: "Whether the ledger's integrity chain verifies"
      description: |
        The number of entries, whether the ledger's chain (including keyed MAC when configured, v1.19, and external
        ledger head check against truncation, v1.23) verifies, the position of the first entry that does not, and when
        it was checked. Read-only: nothing here repairs, rewrites or deletes. One successful check answers for 10
        seconds, whoever asks (failures are not cached).
      security:
        - personToken: []
      responses:
        "200":
          description: "The result of the check."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      summary: "The wallet: the crypto account, registered cards, and connected platforms"
      description: |
        Returns the L2 crypto account (if created), registered cards, and connected-platform rows (v1.30).
        The on-chain USDC balance is read from the network RPC (at most 20 s cached) and comes with its read time; if
        the read fails, the last value is returned with `balanceStale: true` (or `balanceAtomic`/`balanceReadAt` are
        omitted if never read). Committed and spent figures come from L2's ledger. When cards are on, the card list is
        reconciled between the card vault and L2; if the vault fails, the wallet still returns with `cards: []` and
        `cardsAvailable: false`. For connected platforms, the portal reconciles its local grant store against L2's
        active connections whenever either is non-empty (removing local grants absent at L2 and revoking them in the
        background after answering, and closing L2 connections whose local grant is gone) without calling Coinbase;
        balances are fetched separately from `GET /api/connections/coinbase/balances`.
      security:
        - personToken: []
      responses:
        "200":
          description: "The wallet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`profile_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/wallet/account:
    put:
      tags: [wallet]
      operationId: createAccount
      summary: "Create the crypto account, once"
      description: |
        A second call returns the same account. The key is created and held by L2's signer and is never shown.
      security:
        - personToken: []
      responses:
        "200":
          description: "The wallet, with the account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`profile_required` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/connections/coinbase/start:
    post:
      tags: [wallet]
      operationId: startCoinbaseConnection
      summary: "Start connecting the person's Coinbase account (read only)"
      description: |
        v1.30 (return path updated in v1.30.1). Returns Coinbase's authorize address with the read-only scopes
        (`wallet:accounts:read offline_access`), a `state` bound to this person and this sign-in for 10 minutes (at
        most 3 pending starts per person; a fourth drops the oldest; lost on restart), a PKCE S256 challenge, and
        `redirect_uri` pointing at the portal's `/wallet/return` screen. The web app opens it in the same tab. With
        connected platforms off: 404 `not found`. At most 10 starts a minute per person (`429` with `Retry-After`).
      security:
        - personToken: []
      responses:
        "200":
          description: "The address to open."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinbaseStart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not found`: connected platforms are off."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`profile_required` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"
        "503":
          description: "`not_ready`: the deployment's privacy policy or support contact is missing (FR-030)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/connections/coinbase/complete:
    post:
      tags: [wallet]
      operationId: completeCoinbaseConnection
      summary: "Finish connecting Coinbase with the returned authorization code"
      description: |
        v1.30 (return path `/wallet/return` in v1.30.1). Called by the web app's `/wallet/return` screen after
        stripping `code` and `state` from the URL. Checks and consumes the pending `state` first (single use, within
        10 minutes, same user and same sign-in time), verifies the account is registered and enabled, exchanges `code`
        with the start's PKCE verifier, and keeps the grant only when its scopes match the read-only allow-list
        (`wallet:accounts:read`, `offline_access`) and a refresh token is returned; any other grant is revoked and
        checked first. Seals the refresh token in the portal's grant store under a new `connectionId`, records the
        connection at L2 (identifiers only), and removes and revokes any replaced earlier Coinbase connection. Every
        failure after Coinbase issues a grant revokes it.
      security:
        - personToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinbaseComplete"
      responses:
        "200":
          description: "Connected."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinbaseConnected"
        "400":
          description: "`invalid_request` (the body) or malformed JSON, `invalid_state` (unknown, used, expired, another person's or another sign-in's start, or a code Coinbase refused), or `scope_refused` with `reason`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ScopeRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not found`: connected platforms are off."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`profile_required` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: "`platform_unavailable` (Coinbase didn't answer or refused the client) or `control_unavailable` (L2 can't be reached; the grant was removed and revoked)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`unavailable`: the grant couldn't be stored; it was revoked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/connections/coinbase/balances:
    get:
      tags: [wallet]
      operationId: getCoinbaseBalances
      summary: "The connected Coinbase account's balances (view only)"
      description: |
        v1.30. Reads funded `wallet`, `fiat` and `vault` accounts from Coinbase (up to 10 pages of 100; at most 200
        assets returned, sorted by USD value descending then code) with exact decimal amounts, USD values at Coinbase's
        public exchange rates (cached 60 s across users, rounded half-to-even to the cent) and the exact USD total.
        Figures under 20 s old come from memory; `fresh=1` reads again at most every 10 s per person. Renewals and
        reads are serialized per person so rotating refresh tokens are never used twice. Answers within 5 s: on
        Coinbase failure, timeout or 429 (which backs off reads for that person for 60 s), returns the last figures
        with `stale: true` or `{ "status": "unreadable" }`; when Coinbase refuses the grant (or a renewal returns a
        disallowed scope), drops the grant and answers `{ "status": "reconnect" }`. Never stored on disk, never sent
        to L2, and never used on the payment path.
      security:
        - personToken: []
      parameters:
        - name: fresh
          in: query
          required: false
          description: "Pass `1` to bypass the 20 s cache (throttled to at most one fresh read every 10 s per person)."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: "The figures, or `reconnect` (Coinbase no longer accepts the grant), or `unreadable`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlatformBalances"
                  - $ref: "#/components/schemas/BalancesStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_connected`, or `not found` with connected platforms off."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`profile_required` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"
        "503":
          description: "`unavailable`: the person's stored connection can't be read right now; nothing was changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/connections/coinbase:
    delete:
      tags: [wallet]
      operationId: disconnectCoinbase
      summary: "Disconnect Coinbase"
      description: |
        v1.30. Removes the grant from the local store first, then revokes it at Coinbase and verifies revocation
        within a 5 s deadline (only a 401 on the revoked token confirms, because Coinbase's revoke endpoint answers
        200 regardless; a connection already in `reconnect` state returns `revokedAtPlatform: true`), then closes the
        connection at L2. If L2 cannot be reached after local removal, this route still returns 200 and the next
        `GET /api/wallet` reconciles L2. Allowed while the account is disabled, and with connected platforms switched
        off for a connection stored before (then `revokedAtPlatform` is `false`).
      security:
        - personToken: []
      responses:
        "200":
          description: "Disconnected."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinbaseDisconnected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_connected`, or `not found` with connected platforms off and nothing stored."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"
        "503":
          description: "`unavailable`: the person's stored connection can't be read right now; nothing was changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cards/setup:
    post:
      tags: [wallet]
      operationId: startCardSetup
      summary: "Start saving a card at the card vault"
      description: |
        Returns a client secret for the vault's own fields in the browser. The card number and security code go
        from those fields to the vault; this API never receives them.
      security:
        - personToken: []
      responses:
        "200":
          description: "The client secret, once."
