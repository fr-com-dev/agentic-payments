# Portal HTTP API (SPEC.md §8.2 L2-8; specs/013 contracts/portal-api.md) as OpenAPI 3.1.
# SPEC.md and the contract stay normative. test/openapi-portal.test.ts (T-API-12..15) fails when this file and the
# running portal disagree on routes, the bearer scheme or response shapes, so change both together.
openapi: 3.1.0
info:
  title: Portal API
  version: "1.9"
  summary: Onboarding, profile, wallet and expense policies of the x402 three-layer agent payments PoC.
  description: |
    The portal is where a person sets up what their agent may spend. It serves a web app and this API from one
    origin, and it holds no payment key: deciding and signing stay in L2.

    - **One person per request.** Every `/api` operation except `/api/config` needs the person's own access token
      from the sign-in tenant (Auth0): for the API, issued to the portal's web app, with the permission
      `agent:run`. The user is derived from the token and nothing else: no operation takes a user identifier.
    - **A token for the agent service is refused** (403: it comes from another client), and so is a machine token.
      A token of any other issuer, the organization's directory included, is not valid here (401).
    - **Amounts** go in as USDC text with at most 6 decimals (never rounded) and come back as decimal strings of
      atomic units (`"20000"` is 0.02 USDC).
    - **Loosening** a policy, resuming one or enabling the account needs a sign-in at most 15 minutes old; otherwise
      403 `step_up_required`.
    - **Cards** are saved at a card vault in test mode and never charged. The card number and security code never
      reach this API.
    - **API docs.** With `API_DOCS=1`, the portal also serves this document and Swagger UI at `/docs`. Those
      routes take no token and are not mounted by default. When served, `servers` points at that portal.
servers:
  - url: http://127.0.0.1:4025
    description: Default local bind
tags:
  - name: health
    description: Liveness and readiness. No token.
  - name: session
    description: Public configuration for the web app, and the signed-in person.
  - name: wallet
    description: The crypto account and registered cards.
  - name: policies
    description: Expense policies.
  - name: account
    description: Disabling and enabling the account.
  - name: administration
    description: >-
      v1.14 the administration area (L2-8). Mounted only when `PORTAL_ADMIN=1`. For a signed-in person whose token
      carries the `Portal.Admin` role; anyone else gets 403 and the control service is not called. No operation takes
      a user identifier or any text: the decider comes from the verified token.
  - name: docs
    description: Swagger UI and this document. Mounted only when `API_DOCS=1`; no token.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: "Liveness"
      security: []
      responses:
        "200":
          description: "Alive."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: "Readiness"
      security: []
      responses:
        "200":
          description: "Ready."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: "Still starting."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/config:
    get:
      tags: [session]
      operationId: getConfig
      summary: "Public values the web app needs before anyone signs in"
      description: |
        The sign-in mode and identifiers, the network, whether cards are available, and (v1.14) whether the
        administration area is on. Nothing here is a secret.
      security: []
      responses:
        "200":
          description: "The configuration."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /api/me:
    get:
      tags: [session]
      operationId: getMe
      summary: "The signed-in person: onboarding steps, account state and profile"
      description: |
        v1.14: `user` says whether the person may start agent runs (and so has a profile, a wallet and policies), and
        `admin` whether they may use the administration area. A person who is only an administrator gets
        `{ userId, user: false, admin: true }` and nothing else; the control service is not asked.
      security:
        - personToken: []
      responses:
        "200":
          description: "The person."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Me"
                  - $ref: "#/components/schemas/AdministratorOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/profile:
    put:
      tags: [session]
      operationId: putProfile
      summary: "Create or change the profile"
      description: |
        The first save needs `acknowledgedTestFunds: true` and registers the user. Later saves change the name and
        email only; they never touch the wallet, the policies or the ledger. Allowed while the account is disabled.
      security:
        - personToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: "The person, with the saved profile."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: "Malformed body: not an object, an unknown field, or unparsable JSON."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "Body over 16 KB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "A field is invalid, or the first save lacks the acknowledgement."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidProfile"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/platform:
    get:
      tags: [policies]
      operationId: getPlatform
      summary: "The limits and the sellers a policy may use"
      description: |
        The operator's ceilings and seller list, as a person needs them: sellers by name and host. Payee addresses
        are not returned.
      security:
        - personToken: []
      responses:
        "200":
          description: "Limits and sellers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations:
    get:
      tags: [administration]
      operationId: adminListEscalations
      summary: "Payments waiting for a person's approval, oldest first"
      description: |
        Every pending escalation of the deployment, for every user and for the platform account. A user is named by
        identifier only. `mine` marks the signed-in administrator's own payments, which they can see and can't decide.
      security:
        - personToken: []
      responses:
        "200":
          description: "The waiting list and when it was read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEscalationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/events:
    get:
      tags: [administration]
      operationId: adminListEvents
      summary: "What happened to each escalation, in pages"
      description: |
        Each escalation created, each phone request, each approval and rejection with its path and who decided, each
        expiry. Oldest first within a page. With `after`: the next events after a sequence number. With `before`:
        the ones just before it. With neither: the latest. Reading by cursor yields every event exactly once.
      security:
        - personToken: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: -1
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: -1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: "One page of events."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEventPage"
        "400":
          description: "A bad `limit` or cursor, both cursors, or any other query parameter. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/{authorizationId}:
    get:
      tags: [administration]
      operationId: adminGetEscalation
      summary: "One payment in any state, with how it ended and the budget behind it"
      description: |
        For a payment from the waiting list or the activity trail: what it is, its state, who decided it and on which
        path, and the budget it counts against: this agent run, the last 24 hours under the same rules, and for a
        user's payment the user's last 24 hours against the daily ceiling. `fits: false` means approving will not
        make it payable as things stand.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/EscalationId"
      responses:
        "200":
          description: "The payment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEscalationDetail"
        "400":
          description: "A malformed ID. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No escalation has this ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/{authorizationId}/approve:
    post:
      tags: [administration]
      operationId: adminApproveEscalation
      summary: "Approve one waiting payment"
      description: |
        The request says only which payment. Who decides, and when they last entered their credentials, come from
        the verified token; a body that tries to say either is refused. The control service then checks that the
        payment is still pending, that it is not the decider's own, and that the sign-in is at most 15 minutes old.
        An approval lets the agent make that one payment once, if it still fits the rules at that moment.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/EscalationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyBody"
      responses:
        "200":
          description: "Decided now, or already decided the same way on any path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedOutcome"
        "400":
          description: "A malformed ID, or a body field that is not allowed. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (not an administrator), `own_payment` (the payment is the decider's own), or `step_up_required` (the sign-in is older than 15 minutes)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/StepUpRequired"
        "404":
          description: "No escalation has this ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The payment already ended another way: `state`, and the path and decider when a person ended it. Nothing is recorded."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotPending"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/escalations/{authorizationId}/reject:
    post:
      tags: [administration]
      operationId: adminRejectEscalation
      summary: "Reject one waiting payment"
      description: |
        A reason from the fixed list and nothing else: there is no text field. The same checks as an approval, without
        the sign-in age. The agent's next attempt at that purchase is refused, and it learns neither the reason nor
        who rejected.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/EscalationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionInput"
      responses:
        "200":
          description: "Decided now, or already decided the same way on any path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedOutcome"
        "400":
          description: "A malformed ID, or a body field that is not allowed. The control service is not called."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (not an administrator), or `own_payment` (the payment is the decider's own)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "No escalation has this ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The payment already ended another way: `state`, and the path and decider when a person ended it. Nothing is recorded."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotPending"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/admin/ledger/verify:
    get:
      tags: [administration]
      operationId: adminVerifyLedger
      summary: "Whether the ledger's hash chain verifies"
      description: |
        The number of entries, whether the chain verifies, the position of the first entry that does not, and when it
        was checked. Read-only: nothing here repairs, rewrites or deletes. One check answers for 10 seconds, whoever
        asks.
      security:
        - personToken: []
      responses:
        "200":
          description: "The result of the check."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      summary: "The wallet: the crypto account and registered cards"
      description: |
        The balance is read from the network (at most 20 s cached) and comes with its read time; if the read fails,
        the last value is returned with `balanceStale: true`. Committed and spent figures come from L2's ledger.
      security:
        - personToken: []
      responses:
        "200":
          description: "The wallet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`profile_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/wallet/account:
    put:
      tags: [wallet]
      operationId: createAccount
      summary: "Create the crypto account, once"
      description: |
        A second call returns the same account. The key is created and held by L2's signer and is never shown.
      security:
        - personToken: []
      responses:
        "200":
          description: "The wallet, with the account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`profile_required` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/cards/setup:
    post:
      tags: [wallet]
      operationId: startCardSetup
      summary: "Start saving a card at the card vault"
      description: |
        Returns a client secret for the vault's own fields in the browser. The card number and security code go
        from those fields to the vault; this API never receives them.
      security:
        - personToken: []
      responses:
        "200":
          description: "The client secret, once."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`profile_required`, `account_disabled` or `card_limit` (5 cards)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"
        "503":
          description: "`cards_unavailable` (cards are off) or `card_vault_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cards:
    post:
      tags: [wallet]
      operationId: confirmCard
      summary: "Finish saving a card"
      description: |
        Checks the vault's result, refuses a duplicate or an expired card, and records the card's identifier.
      security:
        - personToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardConfirm"
      responses:
        "201":
          description: "The registered card."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: "Malformed body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such setup for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`card_not_confirmed`, `card_already_registered`, `card_limit` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardRefused"
        "422":
          description: "`card_expired` or `not_a_card`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"
        "503":
          description: "`cards_unavailable` or `card_vault_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cards/{cardId}:
    delete:
      tags: [wallet]
      operationId: removeCard
      summary: "Remove a registered card"
      description: |
        Removes the card at the vault, then records the removal. Allowed while the account is disabled.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: "The remaining cards."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such card for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"
        "503":
          description: "`cards_unavailable` or `card_vault_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/policies:
    get:
      tags: [policies]
      operationId: listPolicies
      summary: "Every policy of the person, newest first"
      security:
        - personToken: []
      responses:
        "200":
          description: "The policies."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

    post:
      tags: [policies]
      operationId: createPolicy
      summary: "Create an expense policy"
      description: |
        Where (sellers from the operator's list), how much (four USDC amounts) and how (payments per minute, an end
        date, the payment method). Creating always needs a sign-in at most 15 minutes old.
      security:
        - personToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyInput"
      responses:
        "201":
          description: "The new policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: "Malformed body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (the token is not allowed here), or `step_up_required` (the change loosens and the sign-in is older than 15 minutes)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/StepUpRequired"
        "409":
          description: "`profile_required`, `wallet_required` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "One or more values are invalid. Every issue is listed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicy"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/policies/{policyId}:
    get:
      tags: [policies]
      operationId: getPolicy
      summary: "One policy with its history"
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: "The policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such policy for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

    put:
      tags: [policies]
      operationId: changePolicy
      summary: "Change a policy"
      description: |
        Every change of values makes a new version. The same values with another name only renames. A change that
        raises a limit, adds a seller or moves the end date later needs a sign-in at most 15 minutes old.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyChange"
      responses:
        "200":
          description: "The policy after the change."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: "Malformed body, or no `expectedVersion`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (the token is not allowed here), or `step_up_required` (the change loosens and the sign-in is older than 15 minutes)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/StepUpRequired"
        "404":
          description: "No such policy for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`policy_removed`, `account_disabled`, or `version_conflict` with the current policy."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/VersionConflict"
        "422":
          description: "One or more values are invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicy"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/policies/{policyId}/pause:
    post:
      tags: [policies]
      operationId: pausePolicy
      summary: "Pause a policy"
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: "The policy, paused."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such policy for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`policy_removed` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/policies/{policyId}/resume:
    post:
      tags: [policies]
      operationId: resumePolicy
      summary: "Resume a paused policy"
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: "The policy, active."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (the token is not allowed here), or `step_up_required` (the change loosens and the sign-in is older than 15 minutes)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/StepUpRequired"
        "404":
          description: "No such policy for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`policy_removed` or `account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The policy can't be active now (a seller conflict, a seller no longer listed, an end date in the past)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPolicy"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/policies/{policyId}/remove:
    post:
      tags: [policies]
      operationId: removePolicy
      summary: "Remove a policy"
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: "The policy, removed. It stays in the history."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such policy for this person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`account_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/account/disable:
    post:
      tags: [account]
      operationId: disableAccount
      summary: "Disable the account"
      description: |
        From the next decision on, the agent can pay nothing for this person. Nothing is deleted.
      security:
        - personToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableRequest"
      responses:
        "200":
          description: "The person, disabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: "`confirm` is not `true`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`profile_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /api/account/enable:
    post:
      tags: [account]
      operationId: enableAccount
      summary: "Enable a disabled account"
      description: |
        Needs a sign-in at most 15 minutes old. Every policy that was active comes back paused.
      security:
        - personToken: []
      responses:
        "200":
          description: "The person, enabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (the token is not allowed here), or `step_up_required` (the change loosens and the sign-in is older than 15 minutes)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/StepUpRequired"
        "409":
          description: "`profile_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /docs:
    get:
      tags: [docs]
      operationId: getDocs
      summary: "Swagger UI page"
      security: []
      responses:
        "200":
          description: "The page."
          content:
            text/html:
              schema:
                type: string

  /docs/{asset}:
    get:
      tags: [docs]
      operationId: getDocsAsset
      summary: "Swagger UI asset"
      security: []
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [swagger-ui.css, swagger-ui-bundle.js, swagger-initializer.js]
      responses:
        "200":
          description: "The file."
          content:
            text/css:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
        "404":
          description: "Any other name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi.yaml:
    get:
      tags: [docs]
      operationId: getOpenApi
      summary: "This document"
      security: []
      responses:
        "200":
          description: "The document."
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    personToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The person's access token from the sign-in tenant (Auth0): `iss` the tenant, `aud` containing the API's
        identifier, the portal's web app as the client (`azp`, or `client_id`), `permissions` containing
        `agent:run`, and the sign-in time claim (`https://x402.dev/auth_time` by default). Never a machine token.

  parameters:
    EscalationId:
      name: authorizationId
      in: path
      required: true
      description: The payment's ID, from the waiting list or the activity trail. Any other shape is a 400.
      schema:
        type: string
        pattern: "^auth_[0-9a-f-]{36}$"
    PolicyId:
      name: policyId
      in: path
      required: true
      description: A policy of the signed-in person. Anyone else's answers 404, like an unknown one.
      schema:
        type: string
    CardId:
      name: cardId
      in: path
      required: true
      description: A registered card of the signed-in person.
      schema:
        type: string

  responses:
    Unauthorized:
      description: >-
        Missing, malformed, invalid or expired token, a token of another issuer (the organization's directory
        included), or the portal's own token without a usable sign-in time. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        A valid token that is not allowed here: a machine token, a token issued to an agent client or to any other
        client, or a person without the permission the route needs: `agent:run` for a person's own routes, and
        (v1.14) `portal:admin` for the administration routes. Nothing is written and the control service is not called.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: More than 120 requests in a minute for this person.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ControlUnavailable:
      description: The control service (L2) can't be reached. Nothing was granted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    AdminEscalation:
      type: object
      additionalProperties: false
      required: [authorizationId, referenceCode, owner, mine, resourceKey, payTo, amountAtomic, createdAt, expiresAt]
      description: v1.14. One payment waiting for a person.
      properties:
        authorizationId:
          type: string
          pattern: "^auth_[0-9a-f-]{36}$"
        referenceCode:
          type: string
          description: The short code the same payment carries on every decision path.
        owner:
          type: object
          additionalProperties: false
          required: [platformAccount]
          properties:
            userId:
              type: string
              pattern: "^usr_[0-9a-f]{32}$"
              description: Whose payment it is, by identifier only. Absent for the platform account.
            platformAccount:
              type: boolean
        mine:
          type: boolean
          description: The signed-in administrator's own payment. They can see it and can't decide it.
        resourceKey:
          type: string
          description: The resource being bought. Text from the seller; shown as plain text.
        payTo:
          type: string
        amountAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalRequest:
          type: string
          description: The state of the approver's phone request, when backchannel approval is on.

    EmptyBody:
      type: object
      additionalProperties: false
      description: Nothing. The decider and the time of their identity confirmation come from the token.

    RejectionReasonCode:
      type: string
      enum: [not_expected, amount_too_high, wrong_seller, duplicate, other]

    RejectionInput:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"

    DecisionChannel:
      type: string
      description: "Where a decision came from: the operator's command line, the approver's phone, or the portal."
      enum: [operator, backchannel, portal]

    ApprovedOutcome:
      type: object
      additionalProperties: false
      required: [ok, state, approvalId, expiresAt, already, channel, decidedBy]
      properties:
        ok:
          const: true
        state:
          const: approved
        approvalId:
          type: string
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        already:
          type: boolean
          description: True when it was approved before this request, on any path. Nothing was recorded.
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
          description: "An identifier for the portal and the phone; the operator's label for the command line (text someone typed, shown as text)."

    DeniedOutcome:
      type: object
      additionalProperties: false
      required: [ok, state, rejectionId, rejectedAt, already, channel, decidedBy]
      properties:
        ok:
          const: true
        state:
          const: denied
        rejectionId:
          type: string
        rejectedAt:
          $ref: "#/components/schemas/IsoTime"
        already:
          type: boolean
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string

    NotPending:
      type: object
      additionalProperties: false
      required: [error, state]
      properties:
        error:
          const: not_pending
        state:
          type: string
          enum: [approved, denied, expired]
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
        approvalId:
          type: string
        rejectionId:
          type: string
        expiresAt:
          $ref: "#/components/schemas/IsoTime"

    AdminEvent:
      type: object
      additionalProperties: false
      required: [seq, at, kind, authorizationId, resourceKey, payTo, amount, mine]
      description: >-
        v1.14. One step in an escalation's life. `operator` and `reason` are text an operator typed on the command
        line: plain strings, to be shown as text. A user is named by identifier only.
      properties:
        mine:
          type: boolean
          description: The payment is the signed-in administrator's own.
        seq:
          type: integer
        at:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum:
            - escalated
            - approved
            - denied
            - expired
            - approval_lapsed
            - approval_requested
            - approval_request_failed
            - approval_request_lapsed
            - approval_verification_failed
        authorizationId:
          type: string
        resourceKey:
          type: string
        payTo:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalId:
          type: string
        approver:
          type: string
        approvalExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        rejectionId:
          type: string
        operator:
          type: string
          description: Operator-channel rejections only.
        reason:
          type: string
          description: Operator-channel rejections only.
        referenceCode:
          type: string
          pattern: "^[0-9a-f]{8}$"
        approvalRequest:
          type: string
          enum: [requested, capped, operator_only, reevaluation]
          description: v1.8. On `escalated` events, when backchannel approval is on.
        channel:
          type: string
          enum: [operator, backchannel, portal]
          description: v1.8. On `approved` and `denied` events, the path that decided. v1.14 adds `portal`.
        decidedBy:
          type: string
          description: >-
            v1.8. The operator's label, or the approver's verified identity (`sub`). v1.14: for the portal channel,
            the administrator's identifier (`usr_…`).
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        requestId:
          type: string
        requestExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        failure:
          type: string
          enum: [unreachable, transient, permanent, interrupted, unrecoverable]
        error:
          type: string
          description: An OAuth error code from a fixed list, or `other`. Never the service's text.
        cause:
          type: string
          enum: [expired, late_refusal]
        check:
          type: string
          enum: [malformed, signature, issuer, audience, client, expired, approver, request, details, replay]
        userId:
          type: string
          pattern: "^usr_[0-9a-f]{32}$"
          description: v1.10. On `escalated` events of a user's payment.

    AdminEventPage:
      type: object
      additionalProperties: false
      required: [events, first, last, cursor, more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AdminEvent"
        first:
          type: integer
          description: "The first event's sequence number, or -1 for an empty page. Pass it as `before` to read earlier."
        last:
          type: integer
          description: "The last event's sequence number, or -1 for an empty page."
        cursor:
          type: integer
          description: "The ledger's last sequence number at the read. Pass it as `after` to read what comes next."
        more:
          type: boolean

    BudgetLine:
      type: object
      additionalProperties: false
      required: [capAtomic, spentAtomic, remainingAtomic]
      description: v1.14. One budget a payment counts against. `remainingAtomic` is never below 0.
      properties:
        capAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        spentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        remainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"

    EscalationBudget:
      type: object
      additionalProperties: false
      required: [asset, decimals, applies, autoApproveMaxAtomic, hardCapPerPaymentAtomic, run, day, fits]
      description: >-
        v1.14. The budget behind an escalation, as of the read, under the rules that apply to its owner now: the
        same ledger-derived figures a decision uses. `fits: true` is no promise; the payment is decided again when
        the agent retries.
      properties:
        asset:
          type: string
        decimals:
          type: integer
        applies:
          type: boolean
          description: False when no rule set applies to this purchase now. Every line is then zero.
        notApplying:
          type: string
          enum: [user_not_onboarded, user_disabled, no_active_policy]
        autoApproveMaxAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        run:
          $ref: "#/components/schemas/BudgetLine"
        day:
          $ref: "#/components/schemas/BudgetLine"
        userDay:
          $ref: "#/components/schemas/BudgetLine"
        fits:
          type: boolean
          description: The amount is within the per-payment cap and within every remaining amount.

    EscalationDecision:
      type: object
      additionalProperties: false
      required: [at, channel, decidedBy]
      description: v1.14. How a person ended an escalation.
      properties:
        at:
          $ref: "#/components/schemas/IsoTime"
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
          description: "An identifier for the portal, the approver's subject for the phone, the operator's label for the command line (text someone typed, shown as text)."
        approvalId:
          type: string
        approvalExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        rejectionId:
          type: string
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        reason:
          type: string
          description: An operator's own words, from the command line. Untrusted text.

    AdminEscalationDetail:
      type: object
      additionalProperties: false
      required: [authorizationId, referenceCode, owner, mine, resourceKey, payTo, amountAtomic, createdAt, expiresAt, state, budget, readAt]
      description: "v1.14. A payment in any state, and the portal's clock at the read (`readAt`): the browser counts the time left from it."
      properties:
        authorizationId:
          type: string
          pattern: "^auth_[0-9a-f-]{36}$"
        referenceCode:
          type: string
        owner:
          type: object
          additionalProperties: false
          required: [platformAccount]
          properties:
            userId:
              type: string
              pattern: "^usr_[0-9a-f]{32}$"
            platformAccount:
              type: boolean
        mine:
          type: boolean
        resourceKey:
          type: string
        payTo:
          type: string
        amountAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalRequest:
          type: string
        state:
          type: string
          enum: [pending, approved, denied, expired]
        decision:
          $ref: "#/components/schemas/EscalationDecision"
        budget:
          $ref: "#/components/schemas/EscalationBudget"
        readAt:
          $ref: "#/components/schemas/IsoTime"

    LedgerCheck:
      type: object
      additionalProperties: false
      required: [entries, ok, checkedAt]
      properties:
        entries:
          type: integer
        ok:
          type: boolean
        brokenAt:
          type: integer
          description: The position of the first entry that fails verification.
        checkedAt:
          $ref: "#/components/schemas/IsoTime"

    AdminEscalationList:
      type: object
      additionalProperties: false
      required: [pending, readAt]
      properties:
        pending:
          type: array
          items:
            $ref: "#/components/schemas/AdminEscalation"
        readAt:
          $ref: "#/components/schemas/IsoTime"

    AtomicAmount:
      type: string
      pattern: "^[0-9]+$"
      description: Decimal string of atomic units (USDC has 6 decimals).

    IsoTime:
      type: string
      format: date-time

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, starting]

    Config:
      type: object
      additionalProperties: false
      required: [auth, network, cards, admin]
      properties:
        auth:
          type: object
          additionalProperties: false
          required: [mode, domain, clientId, audience]
          properties:
            mode:
              type: string
              enum: [auth0, dev]
            domain:
              type: string
              description: The sign-in tenant's domain. Empty with the local dev issuer.
            clientId:
              type: string
              description: The portal's web app at the sign-in tenant. Public.
            audience:
              type: string
              description: The API's identifier, which the web app asks a token for.
        network:
          type: string
        cards:
          type: object
          additionalProperties: false
          required: [available]
          properties:
            available:
              type: boolean
            publishableKey:
              type: string
              description: The card vault's publishable test key. Public.
        admin:
          type: object
          additionalProperties: false
          required: [available]
          description: v1.14. Whether the administration area is on. Who may use it comes from the person's token.
          properties:
            available:
              type: boolean

    Onboarding:
      type: object
      additionalProperties: false
      required: [profile, wallet, policy]
      properties:
        profile:
          type: boolean
        wallet:
          type: boolean
        policy:
          type: boolean

    Me:
      type: object
      additionalProperties: false
      required: [userId, enabled, onboarding, user, admin]
      description: A person who may start agent runs. For a person who is only an administrator see AdministratorOnly.
      properties:
        userId:
          type: string
          pattern: "^usr_[0-9a-f]{32}$"
        user:
          type: boolean
          enum: [true]
          description: v1.14. Holds the permission to start agent runs.
        admin:
          type: boolean
          description: v1.14. Holds the administrator permission, and the administration area is on.
        enabled:
          type: boolean
        onboarding:
          $ref: "#/components/schemas/Onboarding"
        profile:
          type: object
          additionalProperties: false
          required: [displayName, contactEmail]
          properties:
            displayName:
              type: string
            contactEmail:
              type: string

    AdministratorOnly:
      type: object
      additionalProperties: false
      required: [userId, user, admin]
      description: |
        v1.14. A person who holds the administrator permission and not the permission to start agent runs: they have
        no profile, wallet or policy, and only the administration area is theirs.
      properties:
        userId:
          type: string
          pattern: "^usr_[0-9a-f]{32}$"
        user:
          type: boolean
          enum: [false]
        admin:
          type: boolean
          enum: [true]

    ProfileInput:
      type: object
      additionalProperties: false
      required: [displayName, contactEmail]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        contactEmail:
          type: string
          maxLength: 254
        acknowledgedTestFunds:
          type: boolean
          description: Required as `true` on the first save - the wallet holds test funds only.

    FieldIssue:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string

    InvalidProfile:
      type: object
      additionalProperties: false
      required: [error, issues]
      properties:
        error:
          const: invalid_profile
        issues:
          type: array
          items:
            $ref: "#/components/schemas/FieldIssue"

    Platform:
      type: object
      additionalProperties: false
      required: [limits, sellers, network, asset, decimals]
      properties:
        limits:
          type: object
          additionalProperties: false
          required: [hardCapPerPaymentAtomic, sessionBudgetAtomic, userDailyCeilingAtomic, maxAuthorizationsPerMinute, maxPolicyDays]
          properties:
            hardCapPerPaymentAtomic:
              $ref: "#/components/schemas/AtomicAmount"
            sessionBudgetAtomic:
              $ref: "#/components/schemas/AtomicAmount"
            userDailyCeilingAtomic:
              $ref: "#/components/schemas/AtomicAmount"
            maxAuthorizationsPerMinute:
              type: integer
            maxPolicyDays:
              type: integer
        sellers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [host, name]
            properties:
              host:
                type: string
              name:
                type: string
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer

    Account:
      type: object
      additionalProperties: false
      required:
        - address
        - network
        - asset
        - decimals
        - balanceStale
        - committedAtomic
        - spent24hAtomic
        - dailyCeilingAtomic
        - dailyRemainingAtomic
        - lowBalance
      properties:
        address:
          type: string
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer
        balanceAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Absent when the balance was never read and can't be read now.
        balanceReadAt:
          $ref: "#/components/schemas/IsoTime"
        balanceStale:
          type: boolean
        committedAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        spent24hAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyCeilingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyRemainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        lowBalance:
          type: boolean

    Card:
      type: object
      additionalProperties: false
      required: [cardId, brand, last4, expMonth, expYear, addedAt, expired]
      properties:
        cardId:
          type: string
          pattern: "^card_[0-9a-f-]{36}$"
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
        expYear:
          type: integer
        nickname:
          type: string
          maxLength: 40
        addedAt:
          $ref: "#/components/schemas/IsoTime"
        expired:
          type: boolean

    CardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"

    Wallet:
      type: object
      additionalProperties: false
      required: [cards, cardsAvailable, disabled]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        cardsAvailable:
          type: boolean
        disabled:
          type: boolean

    CardSetup:
      type: object
      additionalProperties: false
      required: [clientSecret]
      properties:
        clientSecret:
          type: string
          description: For the card vault's fields in the browser. Returned once; never stored or logged.

    CardConfirm:
      type: object
      additionalProperties: false
      required: [setupIntentId]
      properties:
        setupIntentId:
          type: string
        nickname:
          type: string
          maxLength: 40

    CardRefused:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        vaultCode:
          type: string
          description: A code from a fixed list (or `other`) when the vault refused the card. Never the vault's text.

    PolicyInput:
      type: object
      additionalProperties: false
      required: [name, sellers, autoApproveUsdc, perPaymentUsdc, perRunUsdc, perDayUsdc, paymentsPerMinute, endsOn, paymentMethod]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        sellers:
          type: array
          items:
            type: string
        autoApproveUsdc:
          type: string
          description: USDC text, at most 6 decimals. `0` means every payment needs a person.
        perPaymentUsdc:
          type: string
        perRunUsdc:
          type: string
        perDayUsdc:
          type: string
        paymentsPerMinute:
          type: number
        endsOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The policy ends at the end of this day, UTC.
        paymentMethod:
          type: string

    PolicyChange:
      type: object
      additionalProperties: false
      required: [name, sellers, autoApproveUsdc, perPaymentUsdc, perRunUsdc, perDayUsdc, paymentsPerMinute, endsOn, paymentMethod, expectedVersion]
      properties:
        name:
          type: string
        sellers:
          type: array
          items:
            type: string
        autoApproveUsdc:
          type: string
        perPaymentUsdc:
          type: string
        perRunUsdc:
          type: string
        perDayUsdc:
          type: string
        paymentsPerMinute:
          type: number
        endsOn:
          type: string
        paymentMethod:
          type: string
        expectedVersion:
          type: integer

    PolicyValues:
      type: object
      additionalProperties: false
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
      properties:
        sellers:
          type: array
          items:
            type: string
        autoApproveMaxAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        sessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        maxAuthorizationsPerMinute:
          type: integer
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string
          enum: [crypto_account]

    PolicyVersion:
      type: object
      additionalProperties: false
      required: [seq, ts, kind, version]
      properties:
        seq:
          type: integer
        ts:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum: [created, changed, paused, resumed, removed]
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        cause:
          type: string
          enum: [user, account_enabled]

    Policy:
      type: object
      additionalProperties: false
      required: [policyId, name, version, values, state, displayState, expired, limitedByPlatform, unlistedSellers, updatedAt]
      properties:
        policyId:
          type: string
        name:
          type: string
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        state:
          type: string
          enum: [active, paused, removed]
        displayState:
          type: string
          enum: [active, paused, removed, expired, disabled]
        expired:
          type: boolean
        limitedByPlatform:
          type: array
          items:
            type: string
        unlistedSellers:
          type: array
          items:
            type: string
        updatedAt:
          $ref: "#/components/schemas/IsoTime"
        history:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"

    PolicyList:
      type: object
      additionalProperties: false
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/Policy"

    PolicyIssue:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        host:
          type: string
        policyId:
          type: string
        limitAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        limit:
          type: integer

    InvalidPolicy:
      type: object
      additionalProperties: false
      required: [error, issues]
      properties:
        error:
          const: invalid_policy
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PolicyIssue"

    StepUpRequired:
      type: object
      additionalProperties: false
      required: [error, maxAgeSec]
      properties:
        error:
          const: step_up_required
        maxAgeSec:
          type: integer

    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, current]
      properties:
        error:
          const: version_conflict
        current:
          $ref: "#/components/schemas/Policy"

    DisableRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          const: true
