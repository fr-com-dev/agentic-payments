                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

    put:
      tags: [policies]
      operationId: changePolicy
      summary: "Change a policy"
      description: |
        Every change of values makes a new version. The same values with another name only renames. A change that
        raises a limit, adds a seller or moves the end date later needs a sign-in at most 15 minutes old.
      security:
        - personToken: []
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyChange"
      responses:
        "200":
          description: "The policy after the change."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: "Malformed body, unknown field, unparsable JSON, or missing/invalid `expectedVersion` (integer >= 1)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
