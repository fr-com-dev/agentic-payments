                $ref: "#/components/schemas/Policy"
        "400":
          description: "Malformed body: not an object, unknown field (including `expectedVersion`), wrong field type, or unparsable JSON."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (the token is not allowed here), or `step_up_required` (creating a policy always loosens and the sign-in is older than 15 minutes)."
