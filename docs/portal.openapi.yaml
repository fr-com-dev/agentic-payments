    post:
      tags: [account]
      operationId: enableAccount
      summary: "Enable a disabled account"
      description: |
        Needs a sign-in at most 15 minutes old (unless already enabled). Every policy that was active comes back
        paused (`cause: "account_enabled"`). Connected platforms disconnected on disable stay disconnected.
      security:
        - personToken: []
      responses:
        "200":
          description: "The person, enabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden` (the token is not allowed here), or `step_up_required` (enabling loosens and the sign-in is older than 15 minutes)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/StepUpRequired"
        "409":
          description: "`profile_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

  /docs:
    get:
      tags: [docs]
      operationId: getDocs
      summary: "Swagger UI page"
      description: >-
        Same-origin Swagger UI page backed by the pinned `swagger-ui-dist` assets. Overrides `Content-Security-Policy`
        with a same-origin policy (`default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src
        'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'`).
      security: []
      responses:
        "200":
          description: "The page."
          headers:
            Content-Security-Policy:
              required: true
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string

  /docs/{asset}:
    get:
      tags: [docs]
      operationId: getDocsAsset
      summary: "Swagger UI asset"
      security: []
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [swagger-ui.css, swagger-ui-bundle.js, swagger-initializer.js]
      responses:
        "200":
          description: "The file."
          content:
            text/css:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
        "404":
          description: "Any other name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi.yaml:
    get:
      tags: [docs]
      operationId: getOpenApi
      summary: "This document"
      security: []
      responses:
        "200":
          description: "The document."
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    personToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The person's access token from the sign-in tenant (Auth0, RS256; or the local dev issuer `urn:x402:dev-issuer`,
        ES256, with `NETWORK=local` and `AUTH_JWKS_FILE`): `iss` exact, `aud` containing `AUTH_AUDIENCE`, non-empty
        `sub`, the portal's web app as the client (`azp`, or `client_id`), and the sign-in time claim
        (`AUTH_TIME_CLAIM`, default `https://x402.dev/auth_time`). Never a machine token. For user routes no
        permission is required (v1.14); when `PORTAL_ADMIN=1` (v1.15), `/api/admin/*` requires `portal:admin` in
        `permissions`, and escalation approvals also require a fresh second-factor claim (`https://x402.dev/mfa_time`,
        v1.19). Forwarded unchanged to L2 in `X-Person-Authorization` on every user and admin call (v1.19).

  parameters:
    EscalationId:
      name: authorizationId
      in: path
      required: true
      description: The payment's ID, from the waiting list or the activity trail. Any other shape is a 400.
      schema:
        type: string
        pattern: "^auth_[0-9a-f-]{36}$"
    PolicyId:
      name: policyId
      in: path
      required: true
      description: A policy of the signed-in person. Anyone else's answers 404, like an unknown one.
      schema:
        type: string
    CardId:
      name: cardId
      in: path
      required: true
      description: A registered card of the signed-in person. Anyone else's answers 404, like an unknown one.
      schema:
        type: string

  responses:
    Unauthorized:
      description: >-
        Missing, malformed, invalid or expired token, a token of another issuer (the organization's directory
        included), or the portal's own token without a usable sign-in time. Nothing is written.
      headers:
        WWW-Authenticate:
          description: >-
            v1.27 (RFC 6750): `Bearer realm="x402-portal"` when no bearer token was sent, and
            `Bearer realm="x402-portal", error="invalid_token"` when one was sent and failed a check. Never a
            description of the check.
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        A valid token that is not allowed here: a machine token, or a token issued to an agent client or to any
        other client. Since v1.14 never a missing permission, except on the administration routes (v1.15), which
        need `portal:admin`. Carries no `WWW-Authenticate` header. Nothing is written and the control service is not
        called.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: 'JSON request body over 16 KB (`{ "error": "body too large" }`).'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        Too many requests: more than 120 in a minute for this person, more than 300 in a minute from this address,
        20 failed authentications (401) from this address in a minute counted before the token is read (v1.27), or
        more than 10 Coinbase connection starts in a minute for this person (`POST /api/connections/coinbase/start`,
        v1.30).
      headers:
        Retry-After:
          description: Seconds until the rate-limit window resets (at least 1).
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ControlUnavailable:
      description: The control service (L2) can't be reached, timed out, or returned 401/5xx (`control_unavailable`). Nothing was granted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    AdminEscalation:
      type: object
      additionalProperties: false
      required: [authorizationId, referenceCode, owner, mine, resourceKey, payTo, amountAtomic, createdAt, expiresAt]
      description: v1.15. One payment waiting for a person.
      properties:
        authorizationId:
          type: string
          pattern: "^auth_[0-9a-f-]{36}$"
        referenceCode:
          type: string
          description: The short code the same payment carries on every decision path.
        owner:
          type: object
          additionalProperties: false
          required: [platformAccount]
          properties:
            userId:
              type: string
              pattern: "^usr_[0-9a-f]{32}$"
              description: Whose payment it is, by identifier only. Absent for the platform account.
            platformAccount:
              type: boolean
        mine:
          type: boolean
          description: The signed-in administrator's own payment. They can see it and can't decide it.
        resourceKey:
          type: string
          description: The resource being bought. Text from the seller; shown as plain text.
        payTo:
          type: string
        amountAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalRequest:
          type: string
          description: >-
            The state of the phone request to the payment's owner, when backchannel approval is on (`requested`,
            `capped`, `operator_only`, `reevaluation`, `no_owner`, `no_identity`, `identity_mismatch`, `failed`,
            `verification_failed`, `lapsed`, `answered`, `abandoned`, or `unanswered`). v1.16: `no_owner`,
            `no_identity` and `identity_mismatch` mean nobody was asked by phone.

    EmptyBody:
      type: object
      additionalProperties: false
      description: Nothing. The decider, sign-in time, and second-factor (MFA) time come from the verified token.

    RejectionReasonCode:
      type: string
      enum: [not_expected, amount_too_high, wrong_seller, duplicate, other]

    RejectionInput:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"

    DecisionChannel:
      type: string
      description: "Where a decision came from: the operator's command line, the phone of the payment's owner (v1.16; one configured approver before), or the portal."
      enum: [operator, backchannel, portal]

    ApprovedOutcome:
      type: object
      additionalProperties: false
      required: [ok, state, approvalId, expiresAt, already, channel, decidedBy]
      properties:
        ok:
          const: true
        state:
          const: approved
        approvalId:
          type: string
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        already:
          type: boolean
          description: True when it was approved before this request, on any path. Nothing was recorded.
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
          description: "An identifier for the portal and the phone; the operator's label for the command line (text someone typed, shown as text)."

    DeniedOutcome:
      type: object
      additionalProperties: false
      required: [ok, state, rejectionId, rejectedAt, already, channel, decidedBy]
      properties:
        ok:
          const: true
        state:
          const: denied
        rejectionId:
          type: string
        rejectedAt:
          $ref: "#/components/schemas/IsoTime"
        already:
          type: boolean
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string

    NotPending:
      type: object
      additionalProperties: false
      required: [error, state]
      properties:
        error:
          const: not_pending
        state:
          type: string
          enum: [approved, denied, expired]
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
        approvalId:
          type: string
        rejectionId:
          type: string
        expiresAt:
          $ref: "#/components/schemas/IsoTime"

    AdminEvent:
      type: object
      additionalProperties: false
      required: [seq, at, kind, authorizationId, resourceKey, payTo, amount, mine]
      description: >-
        v1.15. One step in an escalation's life. `operator` and `reason` are text an operator typed on the command
        line: plain strings, to be shown as text. A user is named by identifier only.
      properties:
        mine:
          type: boolean
          description: The payment is the signed-in administrator's own.
        seq:
          type: integer
        at:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum:
            - escalated
            - approved
            - denied
            - expired
            - approval_lapsed
            - approval_requested
            - approval_request_failed
            - approval_request_lapsed
            - approval_verification_failed
        authorizationId:
          type: string
        resourceKey:
          type: string
        payTo:
          type: string
        amount:
          $ref: "#/components/schemas/AtomicAmount"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalId:
          type: string
        approver:
          type: string
          description: >-
            On `approved` events, who approved, as the entry holds it: the operator's label; the administrator's
            identifier for the portal; for the phone the owner's identifier (v1.16), or the configured approver's
            subject in an entry written before v1.16.
        approvalExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        rejectionId:
          type: string
        operator:
          type: string
          description: Operator-channel rejections only.
        reason:
          type: string
          description: Operator-channel rejections only.
        referenceCode:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: The short 8-hex-character code carried on every event in the admin event page for the same escalation.
        approvalRequest:
          type: string
          enum: [requested, capped, operator_only, reevaluation, no_owner, no_identity, identity_mismatch]
          description: >-
            v1.8. On `escalated` events, when backchannel approval is on. v1.16 adds `no_owner`, `no_identity` and
            `identity_mismatch`, which ask nobody.
        channel:
          type: string
          enum: [operator, backchannel, portal]
          description: v1.8. On `approved` and `denied` events, the path that decided. v1.15 adds `portal`.
        decidedBy:
          type: string
          description: >-
            v1.8. The operator's label, or who answered on the phone. v1.15: for the portal channel, the
            administrator's identifier (`usr_…`). v1.16: for the phone, the identifier (`usr_…`) of the payment's
            owner; an entry written before v1.16 holds the configured approver's subject instead.
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        requestId:
          type: string
        requestExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        failure:
          type: string
          enum: [unreachable, transient, permanent, interrupted, unrecoverable, no_owner]
        error:
          type: string
          description: An OAuth error code from a fixed list, or `other`. Never the service's text.
        cause:
          type: string
          enum: [expired, late_refusal]
        check:
          type: string
          enum: [malformed, signature, issuer, audience, client, expired, owner, approver, request, details, replay]
          description: "The verification step an answer failed. v1.16: `owner` replaces `approver`, which only entries written before hold."
        userId:
          type: string
          pattern: "^usr_[0-9a-f]{32}$"
          description: v1.15. Present on every event of a user's payment (absent for the platform account).

    AdminEventPage:
      type: object
      additionalProperties: false
      required: [events, first, last, cursor, more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AdminEvent"
        first:
          type: integer
          description: "The first event's sequence number, or -1 for an empty page. Pass it as `before` to read earlier."
        last:
          type: integer
          description: "The last event's sequence number, or -1 for an empty page."
        cursor:
          type: integer
          description: "The ledger's last sequence number at the read. Pass it as `after` to read what comes next."
        more:
          type: boolean

    BudgetLine:
      type: object
      additionalProperties: false
      required: [capAtomic, spentAtomic, remainingAtomic]
      description: v1.15. One budget a payment counts against. `remainingAtomic` is never below 0.
      properties:
        capAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        spentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        remainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"

    EscalationBudget:
      type: object
      additionalProperties: false
      required: [asset, decimals, applies, autoApproveMaxAtomic, hardCapPerPaymentAtomic, run, day, fits]
      description: >-
        v1.15. The budget behind an escalation, as of the read, under the rules that apply to its owner now: the
        same ledger-derived figures a decision uses. `fits: true` is no promise; the payment is decided again when
        the agent retries.
      properties:
        asset:
          type: string
        decimals:
          type: integer
        applies:
          type: boolean
          description: False when no rule set applies to this purchase now. Every line is then zero.
        notApplying:
          type: string
          enum: [user_not_onboarded, user_disabled, no_active_policy]
        autoApproveMaxAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        run:
          $ref: "#/components/schemas/BudgetLine"
        day:
          $ref: "#/components/schemas/BudgetLine"
        userDay:
          $ref: "#/components/schemas/BudgetLine"
        fits:
          type: boolean
          description: The amount is within the per-payment cap and within every remaining amount.

    EscalationDecision:
      type: object
      additionalProperties: false
      required: [at, channel, decidedBy]
      description: v1.15. How a person ended an escalation.
      properties:
        at:
          $ref: "#/components/schemas/IsoTime"
        channel:
          $ref: "#/components/schemas/DecisionChannel"
        decidedBy:
          type: string
          description: "An identifier for the portal; for the phone the owner's identifier (v1.16; the configured approver's subject in an entry written before); the operator's label for the command line (text someone typed, shown as text)."
        approvalId:
          type: string
        approvalExpiresAt:
          $ref: "#/components/schemas/IsoTime"
        rejectionId:
          type: string
        reasonCode:
          $ref: "#/components/schemas/RejectionReasonCode"
        reason:
          type: string
          description: An operator's own words, from the command line. Untrusted text.

    AdminEscalationDetail:
      type: object
      additionalProperties: false
      required: [authorizationId, referenceCode, owner, mine, resourceKey, payTo, amountAtomic, createdAt, expiresAt, state, budget, readAt]
      description: "v1.15. A payment in any state, and the portal's clock at the read (`readAt`): the browser counts the time left from it."
      properties:
        authorizationId:
          type: string
          pattern: "^auth_[0-9a-f-]{36}$"
        referenceCode:
          type: string
        owner:
          type: object
          additionalProperties: false
          required: [platformAccount]
          properties:
            userId:
              type: string
              pattern: "^usr_[0-9a-f]{32}$"
            platformAccount:
              type: boolean
        mine:
          type: boolean
        resourceKey:
          type: string
        payTo:
          type: string
        amountAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        createdAt:
          $ref: "#/components/schemas/IsoTime"
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        approvalRequest:
          type: string
          description: >-
            The state of the phone request to the payment's owner when backchannel approval is on (`requested`,
            `capped`, `operator_only`, `reevaluation`, `no_owner`, `no_identity`, `identity_mismatch`, `failed`,
            `verification_failed`, `lapsed`, `answered`, `abandoned`, or `unanswered`).
        state:
          type: string
          enum: [pending, approved, denied, expired]
        decision:
          $ref: "#/components/schemas/EscalationDecision"
        budget:
          $ref: "#/components/schemas/EscalationBudget"
        readAt:
          $ref: "#/components/schemas/IsoTime"

    LedgerCheck:
      type: object
      additionalProperties: false
      required: [entries, ok, checkedAt]
      properties:
        entries:
          type: integer
        ok:
          type: boolean
        brokenAt:
          type: integer
          description: The position of the first entry that fails verification.
        checkedAt:
          $ref: "#/components/schemas/IsoTime"

    AdminEscalationList:
      type: object
      additionalProperties: false
      required: [pending, readAt]
      properties:
        pending:
          type: array
          items:
            $ref: "#/components/schemas/AdminEscalation"
        readAt:
          $ref: "#/components/schemas/IsoTime"

    AtomicAmount:
      type: string
      pattern: "^[0-9]+$"
      description: Decimal string of atomic units (USDC has 6 decimals).

    IsoTime:
      type: string
      format: date-time

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, starting]

    Config:
      type: object
      additionalProperties: false
      description: >-
        v1.27: what sign-in and cards need, nothing else. The network profile and whether the administration area
        is on are no longer here; the web app reads the area from `GET /api/me` (`admin`).
      required: [auth, cards]
      properties:
        auth:
          type: object
          additionalProperties: false
          required: [mode, domain, clientId, audience]
          properties:
            mode:
              type: string
              enum: [auth0, dev]
            domain:
              type: string
              description: The sign-in tenant's domain. Empty with the local dev issuer.
            clientId:
              type: string
              description: The portal's web app at the sign-in tenant. Public.
            audience:
              type: string
              description: The API's identifier, which the web app asks a token for.
        cards:
          type: object
          additionalProperties: false
          required: [available]
          properties:
            available:
              type: boolean
            publishableKey:
              type: string
              description: The card vault's publishable test key. Public.

    Onboarding:
      type: object
      additionalProperties: false
      required: [profile, wallet, policy]
      properties:
        profile:
          type: boolean
        wallet:
          type: boolean
        policy:
          type: boolean

    Me:
      type: object
      additionalProperties: false
      required: [userId, enabled, onboarding, admin]
      properties:
        userId:
          type: string
          pattern: "^usr_[0-9a-f]{32}$"
        admin:
          type: boolean
          description: v1.15. The token carries the administrator permission (`portal:admin`), and the administration area is on.
        enabled:
          type: boolean
        onboarding:
          $ref: "#/components/schemas/Onboarding"
        profile:
          type: object
          additionalProperties: false
          required: [displayName, contactEmail]
          properties:
            displayName:
              type: string
            contactEmail:
              type: string

    ProfileInput:
      type: object
      additionalProperties: false
      required: [displayName, contactEmail]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        contactEmail:
          type: string
          maxLength: 254
        acknowledgedTestFunds:
          type: boolean
          description: Required as `true` on the first save - the wallet holds test funds only.

    FieldIssue:
      type: object
      additionalProperties: false
      required: [field, code]
      description: "Profile validation issue (`invalid_name` on `displayName`, `invalid_email` on `contactEmail`, `required` on `acknowledgedTestFunds`)."
      properties:
        field:
          type: string
        code:
          type: string

    InvalidProfile:
      type: object
      additionalProperties: false
      required: [error, issues]
      properties:
        error:
          const: invalid_profile
        issues:
          type: array
          items:
            $ref: "#/components/schemas/FieldIssue"

    Platform:
      type: object
      additionalProperties: false
      required: [limits, sellers, network, asset, decimals]
      properties:
        limits:
          type: object
          additionalProperties: false
          required: [hardCapPerPaymentAtomic, sessionBudgetAtomic, userDailyCeilingAtomic, maxAuthorizationsPerMinute, maxPolicyDays]
          properties:
            hardCapPerPaymentAtomic:
              $ref: "#/components/schemas/AtomicAmount"
            sessionBudgetAtomic:
              $ref: "#/components/schemas/AtomicAmount"
            userDailyCeilingAtomic:
              $ref: "#/components/schemas/AtomicAmount"
            maxAuthorizationsPerMinute:
              type: integer
            maxPolicyDays:
              type: integer
        sellers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [host, name]
            properties:
              host:
                type: string
              name:
                type: string
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer

    Account:
      type: object
      additionalProperties: false
      required:
        - address
        - network
        - asset
        - decimals
        - balanceStale
        - committedAtomic
        - spent24hAtomic
        - dailyCeilingAtomic
        - dailyRemainingAtomic
        - lowBalance
      properties:
        address:
          type: string
        network:
          type: string
        asset:
          type: string
        decimals:
          type: integer
        balanceAtomic:
          $ref: "#/components/schemas/AtomicAmount"
          description: Absent when the balance was never read and can't be read now.
        balanceReadAt:
          $ref: "#/components/schemas/IsoTime"
        balanceStale:
          type: boolean
        committedAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        spent24hAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyCeilingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyRemainingAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        lowBalance:
          type: boolean

    Card:
      type: object
      additionalProperties: false
      required: [cardId, brand, last4, expMonth, expYear, addedAt, expired]
      properties:
        cardId:
          type: string
          pattern: "^card_[0-9a-f-]{36}$"
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
        expYear:
          type: integer
        nickname:
          type: string
          maxLength: 40
        addedAt:
          $ref: "#/components/schemas/IsoTime"
        expired:
          type: boolean

    CardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"

    Wallet:
      type: object
      additionalProperties: false
      required: [cards, cardsAvailable, disabled, connections]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        cardsAvailable:
          type: boolean
        disabled:
          type: boolean
        connections:
          description: >-
            v1.30: one row per platform offered (only `coinbase`); empty with connected platforms off and nothing
            stored, or a single `unavailable` row when off with a stored connection or when the grant file cannot be
            read.
          type: array
          items:
            $ref: "#/components/schemas/ConnectionRow"

    ConnectionRow:
      type: object
      additionalProperties: false
      required: [platform, status, privacyPolicyUrl, supportUrl]
      properties:
        platform:
          type: string
          enum: [coinbase]
        status:
          type: string
          enum: [not_connected, connected, reconnect, unavailable]
          description: >-
            `not_connected` (offered, no connection), `connected` (active), `reconnect` (Coinbase refused the grant),
            or `unavailable` (feature switched off with a stored connection, or the grant file cannot be read).
        connectedAt:
          type: string
          format: date-time
          description: Present for `connected`, `reconnect`, and readable `unavailable` rows; absent for `not_connected` or an unreadable grant file.
        privacyPolicyUrl:
          type: string
          description: Deployment's `PRIVACY_POLICY_URL` (empty when connected platforms are off or unset).
        supportUrl:
          type: string
          description: Deployment's `SUPPORT_URL` (empty when connected platforms are off or unset).

    CoinbaseStart:
      type: object
      additionalProperties: false
      required: [authorizeUrl]
      properties:
        authorizeUrl:
          type: string

    CoinbaseComplete:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
        state:
          type: string
          minLength: 1
          maxLength: 512

    CoinbaseConnected:
      type: object
      additionalProperties: false
      required: [platform, status, connectedAt]
      properties:
        platform:
          type: string
          enum: [coinbase]
        status:
          type: string
          enum: [connected]
        connectedAt:
          type: string
          format: date-time

    ScopeRefused:
      type: object
      additionalProperties: false
      required: [error, reason]
      properties:
        error:
          type: string
          enum: [scope_refused]
        reason:
          type: string
          enum: [too_wide, too_narrow]

    UsdMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
        currency:
          type: string
          enum: [USD]

    PlatformAsset:
      type: object
      additionalProperties: false
      required: [code, name, amount]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,16}$"
        name:
          type: string
          maxLength: 60
        amount:
          type: string
          pattern: "^-?[0-9]{1,30}(\\.[0-9]{1,30})?$"
        value:
          $ref: "#/components/schemas/UsdMoney"

    PlatformBalances:
      type: object
      additionalProperties: false
      required: [readAt, stale, assets, more, leftOutOfTotal]
      properties:
        readAt:
          type: string
          format: date-time
        stale:
          type: boolean
        assets:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PlatformAsset"
        more:
          type: integer
          minimum: 0
        moreIsAtLeast:
          description: "Present (true) when Coinbase had more accounts than the 10 pages read: `more` is then a lower bound."
          type: boolean
          enum: [true]
        total:
          $ref: "#/components/schemas/UsdMoney"
        leftOutOfTotal:
          type: array
          items:
            type: string

    BalancesStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [reconnect, unreadable]

    CoinbaseDisconnected:
      type: object
      additionalProperties: false
      required: [revokedAtPlatform]
      properties:
        revokedAtPlatform:
          type: boolean

    CardSetup:
      type: object
      additionalProperties: false
      required: [clientSecret]
      properties:
        clientSecret:
          type: string
          description: For the card vault's fields in the browser. Returned once; never stored or logged.

    CardConfirm:
      type: object
      additionalProperties: false
      required: [setupIntentId]
      properties:
        setupIntentId:
          type: string
          pattern: "^seti_[A-Za-z0-9_]{1,200}$"
        nickname:
          type: string
          maxLength: 40

    CardRefused:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        vaultCode:
          type: string
          description: >-
            A whitelisted code when the vault refused the card (`card_declined`, `expired_card`, `incorrect_cvc`,
            `invalid_cvc`, `invalid_expiry_month`, `invalid_expiry_year`, `incorrect_number`, `processing_error`,
            `setup_intent_authentication_failure`, or `other`). Never the vault's text.

    PolicyInput:
      type: object
      additionalProperties: false
      required: [name, sellers, autoApproveUsdc, perPaymentUsdc, perRunUsdc, perDayUsdc, paymentsPerMinute, endsOn, paymentMethod]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        sellers:
          type: array
          items:
            type: string
        autoApproveUsdc:
          type: string
          description: USDC text, at most 6 decimals. `0` means every payment needs a person.
        perPaymentUsdc:
          type: string
        perRunUsdc:
          type: string
        perDayUsdc:
          type: string
        paymentsPerMinute:
          type: number
        endsOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The policy ends at the end of this day, UTC.
        paymentMethod:
          type: string
          description: Must be `crypto_account` (cards can never pay; any other value is refused with 422 `payment_method_unsupported`).

    PolicyChange:
      type: object
      additionalProperties: false
      required: [name, sellers, autoApproveUsdc, perPaymentUsdc, perRunUsdc, perDayUsdc, paymentsPerMinute, endsOn, paymentMethod, expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        sellers:
          type: array
          items:
            type: string
        autoApproveUsdc:
          type: string
          description: USDC text, at most 6 decimals. `0` means every payment needs a person.
        perPaymentUsdc:
          type: string
        perRunUsdc:
          type: string
        perDayUsdc:
          type: string
        paymentsPerMinute:
          type: number
        endsOn:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The policy ends at the end of this day, UTC.
        paymentMethod:
          type: string
          description: Must be `crypto_account`.
        expectedVersion:
          type: integer
          minimum: 1

    PolicyValues:
      type: object
      additionalProperties: false
      required:
        - sellers
        - autoApproveMaxAtomic
        - hardCapPerPaymentAtomic
        - sessionBudgetAtomic
        - dailyBudgetAtomic
        - maxAuthorizationsPerMinute
        - expiresAt
        - paymentMethod
      properties:
        sellers:
          type: array
          items:
            type: string
        autoApproveMaxAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        hardCapPerPaymentAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        sessionBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        dailyBudgetAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        maxAuthorizationsPerMinute:
          type: integer
        expiresAt:
          $ref: "#/components/schemas/IsoTime"
        paymentMethod:
          type: string
          enum: [crypto_account]

    PolicyVersion:
      type: object
      additionalProperties: false
      required: [seq, ts, kind, version]
      properties:
        seq:
          type: integer
        ts:
          $ref: "#/components/schemas/IsoTime"
        kind:
          type: string
          enum: [created, changed, paused, resumed, removed]
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        cause:
          type: string
          enum: [user, account_enabled]

    Policy:
      type: object
      additionalProperties: false
      required: [policyId, name, version, values, state, displayState, expired, limitedByPlatform, unlistedSellers, updatedAt]
      properties:
        policyId:
          type: string
        name:
          type: string
        version:
          type: integer
        values:
          $ref: "#/components/schemas/PolicyValues"
        state:
          type: string
          enum: [active, paused, removed]
        displayState:
          type: string
          enum: [active, paused, removed, expired, disabled]
        expired:
          type: boolean
        limitedByPlatform:
          type: array
          description: L2 policy field names (`hardCapPerPaymentAtomic`, `sessionBudgetAtomic`, `dailyBudgetAtomic`, `maxAuthorizationsPerMinute`) where the current platform limit is stricter than the saved value.
          items:
            type: string
        unlistedSellers:
          type: array
          description: Sellers in the policy that are no longer on the platform seller list.
          items:
            type: string
        updatedAt:
          $ref: "#/components/schemas/IsoTime"
        history:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"

    PolicyList:
      type: object
      additionalProperties: false
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/Policy"

    PolicyIssue:
      type: object
      additionalProperties: false
      required: [field, code]
      description: >-
        One validation issue, with L2's field names mapped to the portal's input field names (`autoApproveUsdc`,
        `perPaymentUsdc`, `perRunUsdc`, `perDayUsdc`, `paymentsPerMinute`, `endsOn`, plus `name`, `sellers`,
        `sellers[i]`, `paymentMethod`, `policy`). Codes: `invalid_name`, `not_a_number`, `too_many_decimals`,
        `negative`, `invalid_date`, `not_atomic`, `order_auto_below_cap`, `order_cap_within_session`,
        `above_platform_limit`, `rate_invalid`, `no_sellers`, `too_many_sellers`, `seller_not_listed`,
        `seller_conflict`, `expires_in_past`, `expires_too_late`, `payment_method_unsupported`, `policy_limit`.
      properties:
        field:
          type: string
        code:
          type: string
        host:
          type: string
        policyId:
          type: string
        limitAtomic:
          $ref: "#/components/schemas/AtomicAmount"
        limit:
          type: integer

    InvalidPolicy:
      type: object
      additionalProperties: false
      required: [error, issues]
      properties:
        error:
          const: invalid_policy
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PolicyIssue"

    StepUpRequired:
      type: object
      additionalProperties: false
      required: [error, maxAgeSec]
      properties:
        error:
          const: step_up_required
        maxAgeSec:
          type: integer

    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, current]
      properties:
        error:
          const: version_conflict
        current:
          $ref: "#/components/schemas/Policy"

    DisableRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          const: true
