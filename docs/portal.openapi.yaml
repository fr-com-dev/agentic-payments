              $ref: "#/components/schemas/DisableRequest"
      responses:
        "200":
          description: "The person, disabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: "Malformed body, unknown field, unparsable JSON, or `confirm` is not `true`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`profile_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ControlUnavailable"

