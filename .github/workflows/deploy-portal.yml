# The portal's pipeline (SPEC.md §3.1 Azure profile; specs/011 contracts/deploy-pipeline.md; specs/013 contracts/
# config-and-secrets.md "Image and pipeline"): the web portal, from the x402-portal image only. By hand or on a
# deploy-portal-* tag; the steps are the shared deploy.yml's, with unit portal: build and scan the image, deploy the
# portal's app (infra/main.bicep with UNIT=portal), wait for its new revision, check it through every unit, then
# promote the image to last-good, or roll the portal back to its last-good. On a new environment its first run is a
# first deployment, after L2's and before L1's (quickstart §4): only the portal smoke runs.
name: deploy-portal

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (infra/main.<environment>.bicepparam)
        required: true
        default: dev
        type: choice
        options: [dev]
      first-deployment:
        description: A new environment, where the units deployed after this one don't exist yet - skip the checks through them, and promote nothing
        required: false
        default: false
        type: boolean
  push:
    tags: ["deploy-portal-*"]

permissions:
  id-token: write
  contents: read

# One deployment at a time in the environment, whichever the pipeline: every run's checks go through all the units.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      unit: portal
      environment: ${{ inputs.environment || 'dev' }}
      first-deployment: ${{ inputs.first-deployment || false }}
