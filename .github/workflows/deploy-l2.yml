# L2's pipeline (SPEC.md §3.1 Azure profile; specs/011 contracts/deploy-pipeline.md): the control service, the sole
# signer, from the x402-l2-control image only. By hand or on a deploy-l2-* tag; the steps are the shared deploy.yml's,
# with unit l2: build and scan the image, deploy L2's app (infra/main.bicep with UNIT=l2), wait for its ledger lock
# handover, check it through every unit, then promote the image to last-good, or roll L2 back to its last-good. On a
# new environment its first run is a first deployment, after the operator's (quickstart §4): the wait runs the
# operator job.
name: deploy-l2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (infra/main.<environment>.bicepparam)
        required: true
        default: dev
        type: choice
        options: [dev]
      first-deployment:
        description: A new environment, where the units deployed after this one don't exist yet - skip the checks through them, and promote nothing
        required: false
        default: false
        type: boolean
  push:
    tags: ["deploy-l2-*"]

permissions:
  id-token: write
  contents: read

# One deployment at a time in the environment, whichever the pipeline: every run's checks go through all the units.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      unit: l2
      environment: ${{ inputs.environment || 'dev' }}
      first-deployment: ${{ inputs.first-deployment || false }}
