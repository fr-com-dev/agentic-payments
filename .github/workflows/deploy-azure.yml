# Deploy the Azure profile from one commit and gate the release on the L1-4 baseline (SPEC.md §3.1 Azure
# profile, FR-023, FR-024; specs/011 contracts/deploy-pipeline.md). T-E2E-AZ: test/deploy-workflow.test.ts
# checks this file's step order and rollback offline.
#
# Repository variables (not secrets; nothing secret lives in GitHub): AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID (OIDC federated credential of the deploy app), AGENT_API_CLIENT_ID (the API app's
# client ID that infra/entra-app.sh prints as AUTH_AUDIENCE), SELLER_PAY_TO, PAYER_ADDRESS (public
# addresses). The Key Vaults are seeded by hand (quickstart §4 step 2); this workflow never reads them.
name: deploy-azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (resource group rg-x402-<environment>)
        required: true
        default: dev
        type: choice
        options: [dev]
  push:
    tags: ["deploy-*"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  RG: rg-x402-${{ inputs.environment || 'dev' }}
  IMAGE_TAG: ${{ github.sha }}
  # name:Dockerfile of each image, one per layer and the seller's (scripts/image-closure.ts IMAGES, research R14).
  IMAGES: l1-agent:docker/l1-agent.Dockerfile l2-control:docker/l2-control.Dockerfile l3-verifier:docker/l3-verifier.Dockerfile seller:Dockerfile
  BICEP_VERSION: v0.47.16
  SELLER_PAY_TO: ${{ vars.SELLER_PAY_TO }}
  # The agent's token audience; infra/params/dev.bicepparam reads it, and the build fails when it is empty.
  AUTH_AUDIENCE: ${{ vars.AGENT_API_CLIENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "1 typecheck and tests"
        id: tests
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: "2 T-IAC-01 with the Bicep CLI"
        id: iac
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bicep"
          export BICEP_PATH="$RUNNER_TEMP/bicep"
          test -x "$BICEP_PATH"
          npx vitest run test/infra.test.ts

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "3a base infrastructure (no apps yet, so the registry exists before the images)"
        id: base
        run: |
          az group create -n "$RG" -l eastus2 -o none
          az deployment group create -g "$RG" -n "x402-base-$IMAGE_TAG" \
            --template-file infra/main.bicep --parameters infra/params/dev.bicepparam --parameters deployApps=false -o none
          echo "acr=$(az deployment group show -g "$RG" -n "x402-base-$IMAGE_TAG" --query properties.outputs.registry.value -o tsv)" >> "$GITHUB_OUTPUT"

      - name: "3 build and push the images tagged with the commit"
        id: build
        run: |
          ACR="${{ steps.base.outputs.acr }}"
          az acr login -n "$ACR"
          for spec in $IMAGES; do
            docker build -f "${spec#*:}" -t "$ACR/x402-${spec%%:*}:$IMAGE_TAG" .
            docker push "$ACR/x402-${spec%%:*}:$IMAGE_TAG"
          done

      - name: "3b image secret check (SC-005)"
        id: image-scan
        run: |
          for spec in $IMAGES; do
            IMG="${{ steps.base.outputs.acr }}/x402-${spec%%:*}:$IMAGE_TAG"
            if (docker history --no-trunc "$IMG"; docker run --rm "$IMG" env) | grep -E 'PRIVATE_KEY[=]|_SECRET[=]|_TOKEN[=]'; then
              echo "secret assignment found in $IMG"; exit 1
            fi
          done

      - name: "4 what-if, then deploy everything"
        id: deploy
        run: |
          STABLE=$(az containerapp revision list -n ca-l1-agent -g "$RG" --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv 2>/dev/null || true)
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          export AGENT_STABLE_REVISION="$STABLE"
          az deployment group what-if -g "$RG" --template-file infra/main.bicep --parameters infra/params/dev.bicepparam
          az deployment group create -g "$RG" -n "x402-$IMAGE_TAG" --template-file infra/main.bicep --parameters infra/params/dev.bicepparam -o none
          OUT=$(az deployment group show -g "$RG" -n "x402-$IMAGE_TAG" --query properties.outputs -o json)
          {
            echo "agent=$(jq -r .agentFqdn.value <<<"$OUT")"
            echo "law=$(jq -r .logWorkspaceCustomerId.value <<<"$OUT")"
            echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: "5 wait for L2 (ledger lock handover) and L3"
        id: wait-l2
        run: |
          for _ in $(seq 1 20); do
            JOB_TIMEOUT_S=120 infra/run-job.sh "$RG" job-operator node dist/scripts/ledger-verify.js && exit 0
            sleep 15
          done
          echo "L2 did not answer ledger-verify within 5 minutes"; exit 1

      - name: "5b payer balance (read-only)"
        id: balance
        run: npm run -s payer-balance -- "${{ vars.PAYER_ADDRESS }}"

      - name: "6 regression: L1-4 scripted plan with --check-baseline"
        id: regression
        run: infra/run-job.sh "$RG" job-regression

      - name: "7 ledger-verify"
        id: chain
        run: infra/run-job.sh "$RG" job-operator node dist/scripts/ledger-verify.js

      - name: "8 hosted smoke through the new agent revision"
        id: smoke
        run: |
          AGENT="${{ steps.deploy.outputs.agent }}"
          if [ -n "${{ steps.deploy.outputs.stable }}" ]; then AGENT="${AGENT/ca-l1-agent/ca-l1-agent---candidate}"; fi
          ACCESS=$(az account get-access-token --resource api://x402-l1-agent --query accessToken -o tsv)
          START=$(date +%s)
          curl -fsS -m 210 -X POST "https://$AGENT/v1/runs" -H "authorization: Bearer $ACCESS" -H "content-type: application/json" \
            -d '{"goal":"Get today'"'"'s weather for Lima and a short market brief, then give me a receipt list of what you bought."}' > "$RUNNER_TEMP/smoke.json"
          SECS=$(( $(date +%s) - START ))
          echo "hosted smoke: ${SECS}s (SC-009 target: p95 <= 120 s)" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.status == "completed"' "$RUNNER_TEMP/smoke.json" > /dev/null
          for p in /api/weather /api/market-brief; do
            jq -e --arg p "$p" '[.steps[] | select((.url // "") | contains($p)) | select(.result.outcome == "PAID" and .result.payment.settlement.status == "CONFIRMED")] | length >= 1' "$RUNNER_TEMP/smoke.json" > /dev/null
          done
          test "$SECS" -le 120

      - name: "9 log secret scan (credential shapes)"
        id: log-scan
        run: |
          az monitor log-analytics query -w "${{ steps.deploy.outputs.law }}" \
            --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated >= datetime(${{ steps.deploy.outputs.started }}) | project Log_s" \
            --query "[].Log_s" -o tsv | npm run -s scan-logs

      - name: "10 promote the agent revision"
        id: promote
        run: |
          az containerapp ingress traffic set -n ca-l1-agent -g "$RG" --revision-weight latest=100 -o none
          for spec in $IMAGES; do
            az acr import -n "${{ steps.base.outputs.acr }}" --source "${{ steps.base.outputs.acr }}/x402-${spec%%:*}:$IMAGE_TAG" --image "x402-${spec%%:*}:last-good" --force
          done

      - name: "rollback L2, L3 and sellers to last-good (the agent keeps its previous revision)"
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          IMAGE_TAG=last-good AGENT_STABLE_REVISION="${{ steps.deploy.outputs.stable }}" \
            az deployment group create -g "$RG" -n "x402-rollback-${{ github.sha }}" --template-file infra/main.bicep --parameters infra/params/dev.bicepparam -o none
          infra/run-job.sh "$RG" job-operator node dist/scripts/ledger-verify.js
