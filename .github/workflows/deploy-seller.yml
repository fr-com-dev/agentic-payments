# The sellers' pipeline (SPEC.md §3.1 Azure profile; specs/011 contracts/deploy-pipeline.md): the seller and its
# alias, from the x402-seller image only. By hand or on a deploy-seller-* tag; the steps are the shared deploy.yml's,
# with unit seller: build and scan the image, deploy both sellers (infra/main.bicep with UNIT=seller), check them
# through every unit, then promote the image to last-good, or roll the sellers back to their last-good. On a new
# environment its first run is a first deployment, right after the platform (quickstart §4).
name: deploy-seller

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (infra/main.<environment>.bicepparam)
        required: true
        default: dev
        type: choice
        options: [dev]
      first-deployment:
        description: A new environment, where the units deployed after this one don't exist yet - skip the checks through them, and promote nothing
        required: false
        default: false
        type: boolean
  push:
    tags: ["deploy-seller-*"]

permissions:
  id-token: write
  contents: read

# One deployment at a time in the environment, whichever the pipeline: every run's checks go through all the units.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      unit: seller
      environment: ${{ inputs.environment || 'dev' }}
      first-deployment: ${{ inputs.first-deployment || false }}
