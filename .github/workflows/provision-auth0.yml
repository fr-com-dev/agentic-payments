# The Auth0 tenant's pipeline (SPEC.md §13; specs/012 research R17): applies auth0/, the Terraform for what L2's
# backchannel approval needs from Auth0 (SPEC L2-7) and for people's sign-in at the portal and the agent service
# (specs/013 research R19). By hand only. Every run shows the plan; it applies that same plan
# only when `apply` is checked. T-IAC-02 (test/auth0-iac.test.ts) checks this file.
# - The job runs in the GitHub environment auth0-<environment>, never the deploy pipelines' one. Protect it with
#   required reviewers: it holds the only secrets in GitHub, the Auth0 Management API application's credential
#   (AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET) and, with credential = "secret" only, L2's client secret
#   (AUTH0_L2_CLIENT_SECRET). Auth0 has no sign-in without a credential for this. Only the plan and apply steps see them.
# - The state is a blob in the storage account infra/pre-deploy.bicep makes (names.stateStorage). Terraform signs in
#   to Azure as the deploy app with OIDC, for that container only, and asks GitHub for a fresh token itself on each
#   command. No Azure credential exists, and the state holds no secret.
# - The Azure sign-in and names come from the Bicep parameter files, as in deploy.yml. The tenant's values (its
#   domain, the API identifier, the approver, the public half of L2's key, the deployed portal's origin) are variables
#   of the same GitHub environment, AUTH0_*: the plan step turns them into Terraform's TF_VAR_* variables. No tfvars file exists, in the
#   repository or on the runner.
name: provision-auth0

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (the GitHub environment auth0-<environment>, infra/pre-deploy.<environment>.bicepparam)
        required: true
        default: dev
        type: choice
        options: [dev]
      apply:
        description: Apply the plan this run shows. Unchecked, the run only plans
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

# One run at a time for the tenant: a second one waits, and the state's lock refuses anything else.
concurrency:
  group: provision-auth0
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ENVIRONMENT: ${{ inputs.environment }}
  BICEP_VERSION: v0.47.16
  TERRAFORM_VERSION: 1.15.5
  TERRAFORM_SHA256: 702b2136af6728c8ff037f843dd2dbce2b7ad88786b7381d1d72aefa250f601c
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  # The state's sign-in: OIDC as the deploy app, Entra authorization on the blob (the account has no key access).
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  provision:
    runs-on: ubuntu-latest
    # The deploy app's second federated credential trusts this repository's jobs in this GitHub environment only.
    environment: auth0-${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The pinned Bicep CLI
      # compiles the parameter files (the sign-in, target and the state's storage account, never GitHub secrets), and
      # the pinned Terraform CLI is checked against its published SHA-256.
      - name: "0 the Bicep and Terraform CLIs, then the sign-in and the state's storage"
        id: target
        run: |
          if [[ ! "$ENVIRONMENT" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::environment $ENVIRONMENT is not an environment name. Nothing was planned."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bicep" "$RUNNER_TEMP/terraform"
          curl -fsSL -o "$RUNNER_TEMP/bicep/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bicep/bicep"
          for t in main pre-deploy; do
            "$RUNNER_TEMP/bicep/bicep" build-params "infra/$t.$ENVIRONMENT.bicepparam" --stdout | jq '.parametersJson | fromjson | .parameters | map_values(.value)' > "$RUNNER_TEMP/$t.json"
          done
          jq -r 'def v(p): getpath(p) // error("the parameter file has no \(p | join("."))");
            "ARM_TENANT_ID=\(v(["tenantId"]))", "ARM_SUBSCRIPTION_ID=\(v(["subscriptionId"]))", "ARM_CLIENT_ID=\(v(["deployClientId"]))"' "$RUNNER_TEMP/main.json" >> "$GITHUB_ENV"
          jq -r 'def v(p): getpath(p) // error("the parameter file has no \(p | join("."))");
            "STATE_STORAGE=\(v(["names", "stateStorage"]))"' "$RUNNER_TEMP/pre-deploy.json" >> "$GITHUB_ENV"
          trusted=$(jq -r '.githubAuth0Environment' "$RUNNER_TEMP/pre-deploy.json")
          if [[ "$trusted" != "auth0-$ENVIRONMENT" ]]; then
            echo "::error::infra/pre-deploy.$ENVIRONMENT.bicepparam's githubAuth0Environment is $trusted, not auth0-$ENVIRONMENT, the environment this job runs in. Nothing was planned."
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "$TERRAFORM_SHA256  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      # No dependency cache, as in deploy.yml: this job can change the tenant.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      # T-IAC-02 on this commit, with `terraform fmt -check`: least privilege, no secret in the folder or the state.
      - name: "1 the offline checks (T-IAC-02)"
        id: tests
        run: |
          npm install --no-audit --no-fund
          npx vitest run test/auth0-iac.test.ts

      # The provider exactly as .terraform.lock.hcl pins it; the state at auth0.<environment>.tfstate.
      - name: "2 init with the locked provider and the state in Azure, then validate"
        id: init
        run: |
          terraform -chdir=auth0 init -lockfile=readonly \
            -backend-config="storage_account_name=$STATE_STORAGE" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=auth0.$ENVIRONMENT.tfstate"
          terraform -chdir=auth0 validate -no-color

      # Terraform's variables are built here, from the GitHub environment's variables: each one that is set becomes
      # TF_VAR_<name>, and one left unset keeps the default of auth0/variables.tf. The first three have no default.
      # The saved plan carries them to the apply step. L2's client secret reaches Terraform only when the environment
      # holds one (credential = "secret"): it is an ephemeral, write-only value, in neither the plan file nor the state.
      - name: "3 plan, with the variables of the GitHub environment"
        id: plan
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          L2_CLIENT_SECRET: ${{ secrets.AUTH0_L2_CLIENT_SECRET }}
          VAR_tenant_domain: ${{ vars.AUTH0_TENANT_DOMAIN }}
          VAR_api_identifier: ${{ vars.AUTH0_API_IDENTIFIER }}
          VAR_approver_user_id: ${{ vars.AUTH0_APPROVER_USER_ID }}
          VAR_credential: ${{ vars.AUTH0_CREDENTIAL }}
          VAR_client_public_key_pem: ${{ vars.AUTH0_CLIENT_PUBLIC_KEY }}
          VAR_client_secret_version: ${{ vars.AUTH0_CLIENT_SECRET_VERSION }}
          VAR_manage_guardian: ${{ vars.AUTH0_MANAGE_GUARDIAN }}
          VAR_guardian_policy: ${{ vars.AUTH0_GUARDIAN_POLICY }}
          VAR_portal_origin: ${{ vars.AUTH0_PORTAL_ORIGIN }}
        run: |
          if [[ -z "$AUTH0_CLIENT_ID" || -z "$AUTH0_CLIENT_SECRET" ]]; then
            echo "::error::the GitHub environment auth0-$ENVIRONMENT has no secret AUTH0_CLIENT_ID or AUTH0_CLIENT_SECRET (auth0/README.md). Nothing was planned."
            exit 1
          fi
          for name in tenant_domain api_identifier approver_user_id; do
            source="VAR_$name"
            if [[ -z "${!source}" ]]; then
              echo "::error::the GitHub environment auth0-$ENVIRONMENT has no variable AUTH0_${name^^} (auth0/README.md). Nothing was planned."
              exit 1
            fi
          done
          # infra/github-setup.sh creates the variables without a default as this placeholder.
          for source in "${!VAR_@}"; do
            if [[ "${!source}" == REPLACE_ME ]]; then
              echo "::error::a variable of the GitHub environment auth0-$ENVIRONMENT still holds the placeholder REPLACE_ME (Terraform's ${source#VAR_}): set its real value (auth0/README.md). Nothing was planned."
              exit 1
            fi
          done
          export TF_VAR_environment="$ENVIRONMENT"
          for name in tenant_domain api_identifier approver_user_id credential client_public_key_pem client_secret_version manage_guardian guardian_policy portal_origin; do
            source="VAR_$name"
            if [[ -n "${!source}" ]]; then export "TF_VAR_$name=${!source}"; fi
          done
          if [[ -n "$L2_CLIENT_SECRET" ]]; then export TF_VAR_client_secret="$L2_CLIENT_SECRET"; fi
          terraform -chdir=auth0 plan -no-color -lock-timeout=120s -out="$RUNNER_TEMP/auth0.tfplan"
          {
            echo "### Plan for the Auth0 tenant ($ENVIRONMENT)"
            echo '```'
            terraform -chdir=auth0 show -no-color "$RUNNER_TEMP/auth0.tfplan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Exactly the plan of step 3, never a new one. Then the values the parameter file takes, none of them secret:
      # L2's ciba object, and for people's sign-in the identity object and the portal web app's client ID.
      - name: "4 apply the plan"
        id: apply
        if: ${{ inputs.apply }}
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          L2_CLIENT_SECRET: ${{ secrets.AUTH0_L2_CLIENT_SECRET }}
        run: |
          if [[ -n "$L2_CLIENT_SECRET" ]]; then export TF_VAR_client_secret="$L2_CLIENT_SECRET"; fi
          terraform -chdir=auth0 apply -no-color -lock-timeout=120s "$RUNNER_TEMP/auth0.tfplan"
          {
            echo "### Applied. The ciba object for infra/main.$ENVIRONMENT.bicepparam"
            echo '```json'
            terraform -chdir=auth0 output -json bicepparam_ciba
            echo '```'
            echo "### The identity object, for the same file"
            echo '```json'
            terraform -chdir=auth0 output -json bicepparam_identity
            echo '```'
            echo "### userAccounts.portalClientId, for the same file"
            echo '```json'
            terraform -chdir=auth0 output -json bicepparam_portal_client_id
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
