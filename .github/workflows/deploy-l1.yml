# Deploy L1 (the hosted agent and job-regression) from one commit (specs/011 contracts/deploy-pipeline.md).
# It builds the x402-l1-agent image and deploys infra/l1-agent.bicep through the shared steps of
# deploy-layer.yml. Every deploy workflow shares one concurrency group, so deployments never overlap.
name: deploy-l1

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (resource group rg-x402-<environment>)
        required: true
        default: dev
        type: choice
        options: [dev]
  push:
    tags: ["deploy-l1-*"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-layer.yml
    secrets: inherit
    with:
      image: l1-agent
      environment: ${{ inputs.environment || 'dev' }}
