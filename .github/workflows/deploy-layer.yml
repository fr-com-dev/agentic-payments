# Deploy one layer from one commit: its image and its own apps (SPEC.md §3.1 Azure profile, FR-023, FR-024;
# specs/011 contracts/deploy-pipeline.md). Called by deploy-l1.yml, deploy-l2.yml and deploy-l3.yml;
# deploy-infra.yml maintains the platform and the sellers. The layers deploy on their own, so every layer run
# repeats the cloud regression through all of them before it promotes anything. T-E2E-AZ:
# test/deploy-workflow.test.ts checks this file's step order and rollback offline.
#
# GitHub secrets, passed by the callers with `secrets: inherit` (store them as repository secrets):
# - AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID: the deploy app's OIDC sign-in;
# - AGENT_API_CLIENT_ID: the API app's client ID, which infra/entra-app.sh prints as AUTH_AUDIENCE;
# - SELLER_PAY_TO, PAYER_ADDRESS: public addresses.
# They are identifiers, kept as secrets so the logs mask them. No credential is stored in GitHub: Azure sign-in is
# OIDC, and the application's secrets live only in the Key Vaults, seeded by hand (quickstart §4). T-E2E-AZ allows
# no other secret here.
name: deploy-layer

on:
  workflow_call:
    inputs:
      image:
        description: The layer's image and template name (scripts/image-closure.ts IMAGES)
        required: true
        type: string
      environment:
        description: Target environment (resource group rg-x402-<environment>)
        required: true
        type: string
      first-deployment:
        description: The other layers don't exist yet, so skip the cloud checks and record no last-good
        required: false
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AGENT_API_CLIENT_ID:
        required: true
      SELLER_PAY_TO:
        required: true
      PAYER_ADDRESS:
        required: true

permissions:
  id-token: write
  contents: read

env:
  RG: rg-x402-${{ inputs.environment }}
  IMAGE: ${{ inputs.image }}
  IMAGE_TAG: ${{ github.sha }}
  TEMPLATE: infra/${{ inputs.image }}.bicep
  PARAMS: infra/params/${{ inputs.environment }}-${{ inputs.image }}.bicepparam
  BICEP_VERSION: v0.47.16
  SELLER_PAY_TO: ${{ secrets.SELLER_PAY_TO }}
  # The agent's token audience; infra/params/<env>-l1-agent.bicepparam reads it, and the build fails when it is empty.
  AUTH_AUDIENCE: ${{ secrets.AGENT_API_CLIENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "1 typecheck and tests"
        id: tests
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: "2 T-IAC-01 with the Bicep CLI"
        id: iac
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bicep"
          export BICEP_PATH="$RUNNER_TEMP/bicep"
          test -x "$BICEP_PATH"
          npx vitest run test/infra.test.ts

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "3a the platform exists (deploy-infra.yml)"
        id: platform
        run: |
          read -r NAME SERVER < <(az acr list -g "$RG" --query "[0].[name, loginServer]" -o tsv | paste -sd' ' -)
          if [ -z "$SERVER" ]; then echo "no registry in $RG: run deploy-infra first"; exit 1; fi
          {
            echo "acr-name=$NAME"
            echo "acr=$SERVER"
            echo "law=$(az monitor log-analytics workspace show -g "$RG" -n log-x402 --query customerId -o tsv)"
          } >> "$GITHUB_OUTPUT"

      - name: "3 build and push the layer's image tagged with the commit"
        id: build
        run: |
          az acr login -n "${{ steps.platform.outputs.acr-name }}"
          docker build -f "docker/$IMAGE.Dockerfile" -t "${{ steps.platform.outputs.acr }}/x402-$IMAGE:$IMAGE_TAG" .
          docker push "${{ steps.platform.outputs.acr }}/x402-$IMAGE:$IMAGE_TAG"

      - name: "3b image secret check (SC-005)"
        id: image-scan
        run: |
          IMG="${{ steps.platform.outputs.acr }}/x402-$IMAGE:$IMAGE_TAG"
          if (docker history --no-trunc "$IMG"; docker run --rm "$IMG" env) | grep -E 'PRIVATE_KEY[=]|_SECRET[=]|_TOKEN[=]'; then
            echo "secret assignment found in $IMG"; exit 1
          fi

      - name: "4 what-if, then deploy the layer's apps"
        id: deploy
        run: |
          if [ "$IMAGE" = l1-agent ]; then
            STABLE=$(az containerapp revision list -n ca-l1-agent -g "$RG" --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv 2>/dev/null || true)
            echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
            export AGENT_STABLE_REVISION="$STABLE"
          fi
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.first-deployment }}" = true ]; then
            echo "first deployment of $IMAGE: deployed without the cloud checks, so unverified, and no last-good recorded" >> "$GITHUB_STEP_SUMMARY"
          fi
          az deployment group what-if -g "$RG" --template-file "$TEMPLATE" --parameters "$PARAMS"
          az deployment group create -g "$RG" -n "x402-$IMAGE-$IMAGE_TAG" --template-file "$TEMPLATE" --parameters "$PARAMS" -o none

      - name: "5 wait for the layer (L2: the ledger lock handover)"
        id: wait
        run: |
          if [ "$IMAGE" = l2-control ]; then
            for _ in $(seq 1 20); do
              JOB_TIMEOUT_S=120 infra/run-job.sh "$RG" job-operator node dist/scripts/ledger-verify.js && exit 0
              sleep 15
            done
            echo "L2 did not answer ledger-verify within 5 minutes"; exit 1
          fi
          APP=$([ "$IMAGE" = l1-agent ] && echo ca-l1-agent || echo ca-l3-verifier)
          for _ in $(seq 1 30); do
            LATEST=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$LATEST" --query properties.provisioningState -o tsv)
            [ "$STATE" = Provisioned ] && exit 0
            sleep 10
          done
          echo "$APP revision $LATEST was not provisioned within 5 minutes"; exit 1

      - name: "5b payer balance (read-only)"
        id: balance
        if: ${{ !inputs.first-deployment }}
        run: npm run -s payer-balance -- "${{ secrets.PAYER_ADDRESS }}"

      - name: "6 regression: L1-4 scripted plan with --check-baseline"
        id: regression
        if: ${{ !inputs.first-deployment }}
        run: infra/run-job.sh "$RG" job-regression

      - name: "7 ledger-verify"
        id: chain
        if: ${{ !inputs.first-deployment }}
        run: infra/run-job.sh "$RG" job-operator node dist/scripts/ledger-verify.js

      - name: "8 hosted smoke through the agent (the new revision when L1 is the layer)"
        id: smoke
        if: ${{ !inputs.first-deployment }}
        run: |
          AGENT=$(az containerapp show -n ca-l1-agent -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          if [ "$IMAGE" = l1-agent ] && [ -n "${{ steps.deploy.outputs.stable }}" ]; then AGENT="${AGENT/ca-l1-agent/ca-l1-agent---candidate}"; fi
          ACCESS=$(az account get-access-token --resource api://x402-l1-agent --query accessToken -o tsv)
          START=$(date +%s)
          curl -fsS -m 210 -X POST "https://$AGENT/v1/runs" -H "authorization: Bearer $ACCESS" -H "content-type: application/json" \
            -d '{"goal":"Get today'"'"'s weather for Lima and a short market brief, then give me a receipt list of what you bought."}' > "$RUNNER_TEMP/smoke.json"
          SECS=$(( $(date +%s) - START ))
          echo "hosted smoke: ${SECS}s (SC-009 target: p95 <= 120 s)" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.status == "completed"' "$RUNNER_TEMP/smoke.json" > /dev/null
          for p in /api/weather /api/market-brief; do
            jq -e --arg p "$p" '[.steps[] | select((.url // "") | contains($p)) | select(.result.outcome == "PAID" and .result.payment.settlement.status == "CONFIRMED")] | length >= 1' "$RUNNER_TEMP/smoke.json" > /dev/null
          done
          test "$SECS" -le 120

      - name: "9 log secret scan (credential shapes)"
        id: log-scan
        run: |
          az monitor log-analytics query -w "${{ steps.platform.outputs.law }}" \
            --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated >= datetime(${{ steps.deploy.outputs.started }}) | project Log_s" \
            --query "[].Log_s" -o tsv | npm run -s scan-logs

      - name: "10 promote: the agent's traffic (L1), and the image as last-good"
        id: promote
        if: ${{ !inputs.first-deployment }}
        run: |
          if [ "$IMAGE" = l1-agent ]; then
            az containerapp ingress traffic set -n ca-l1-agent -g "$RG" --revision-weight latest=100 -o none
          fi
          az acr import -n "${{ steps.platform.outputs.acr-name }}" --source "${{ steps.platform.outputs.acr }}/x402-$IMAGE:$IMAGE_TAG" --image "x402-$IMAGE:last-good" --force

      - name: "rollback the layer to last-good (the agent's traffic stays on its previous revision)"
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          if ! az acr repository show-tags -n "${{ steps.platform.outputs.acr-name }}" --repository "x402-$IMAGE" -o tsv | grep -qx last-good; then
            echo "x402-$IMAGE has no last-good yet: nothing to roll back to"; exit 1
          fi
          IMAGE_TAG=last-good AGENT_STABLE_REVISION="${{ steps.deploy.outputs.stable }}" \
            az deployment group create -g "$RG" -n "x402-$IMAGE-rollback-${{ github.sha }}" --template-file "$TEMPLATE" --parameters "$PARAMS" -o none
          infra/run-job.sh "$RG" job-operator node dist/scripts/ledger-verify.js
