# The operator's pipeline (SPEC.md §3.1 Azure profile; specs/011 contracts/deploy-pipeline.md): the operator job, from
# the x402-operator image only. By hand or on a deploy-operator-* tag; the steps are the shared deploy.yml's, with unit
# operator: build and scan the image, deploy the job (infra/main.bicep with UNIT=operator), check it through every
# unit (the chain check runs the new job), then promote the image to last-good, or roll the job back to its
# last-good. On a new environment its first run is a first deployment, after L3's and before L2's (quickstart §4).
name: deploy-operator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (infra/main.<environment>.bicepparam)
        required: true
        default: dev
        type: choice
        options: [dev]
      first-deployment:
        description: A new environment, where the units deployed after this one don't exist yet - skip the checks through them, and promote nothing
        required: false
        default: false
        type: boolean
  push:
    tags: ["deploy-operator-*"]

permissions:
  id-token: write
  contents: read

# One deployment at a time in the environment, whichever the pipeline: every run's checks go through all the units.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      unit: operator
      environment: ${{ inputs.environment || 'dev' }}
      first-deployment: ${{ inputs.first-deployment || false }}
