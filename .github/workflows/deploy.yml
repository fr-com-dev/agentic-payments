# The steps every pipeline runs (SPEC.md §3.1 Azure profile; specs/011 contracts/deploy-pipeline.md): one reusable
# workflow, called with its unit by the six pipelines, each run by hand or on its own tag:
#   deploy-infra.yml     unit platform   the platform (network, logs, identities, registry, vaults, storage, Foundry,
#                                        the environments); no image, no promotion, fixed forward
#   deploy-l1.yml        unit l1         x402-l1-agent: the agent and the regression job
#   deploy-l2.yml        unit l2         x402-l2-control: the control service
#   deploy-l3.yml        unit l3         x402-l3-verifier: the verifier
#   deploy-operator.yml  unit operator   x402-operator: the operator job
#   deploy-seller.yml    unit seller     x402-seller: the seller and its alias
# A run deploys infra/main.bicep with UNIT set, so only that unit's modules (everything else stays as it is), each
# deployment previewed with what-if first. Azure is provisioned by Bicep only. A unit's new image is promoted to
# last-good only after the cloud regression, the chain check, the hosted smoke run and the log scan pass through every
# unit; a failure rolls that unit back to its last-good. T-E2E-AZ: test/deploy-workflow.test.ts checks this file and
# the six pipelines offline.
#
# No GitHub secrets: the sign-in (OIDC, as pre-deploy.bicep's deploy app, in each step that calls Azure), the target
# (tenant, subscription, resource group) and every resource name come from infra/main.<environment>.bicepparam, which
# holds every value main.bicep uses; the pinned Bicep CLI compiles it, and every deployment uses that CLI. On a new
# environment each pipeline's first run is a first deployment (quickstart §4), which skips the checks through units
# that don't exist yet; seed-ip lets an operator's IP through the vault firewalls on a platform run, and the next
# platform run without it removes it. The pipelines hold the concurrency group: a called workflow sharing it would
# deadlock with its caller.
name: deploy

on:
  workflow_call:
    inputs:
      unit:
        description: What the run deploys (main.bicep's unit) - platform, l1, l2, l3, operator or seller
        required: true
        type: string
      environment:
        description: Target environment (infra/main.<environment>.bicepparam)
        required: true
        type: string
      first-deployment:
        description: A new environment, where the units deployed after this one don't exist yet - skip the checks through them, and promote nothing
        required: false
        default: false
        type: boolean
      seed-ip:
        description: The platform only - an operator's public IP, let through the vault firewalls while the vaults are seeded
        required: false
        default: ""
        type: string
      recover-vaults:
        description: The platform only, on a first deployment - recover the vaults infra/cleanup.sh left soft-deleted, with their secrets
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

# bash -eo pipefail: a failed command inside a pipe fails its step, so a gate fed by a pipe (the log scan) never
# passes on empty input.
defaults:
  run:
    shell: bash

env:
  UNIT: ${{ inputs.unit }}
  ENVIRONMENT: ${{ inputs.environment }}
  PARAMS: infra/main.${{ inputs.environment }}.bicepparam
  IMAGE_TAG: ${{ github.sha }}
  BICEP_VERSION: v0.47.16
  # The sign-in, as the deploy app (OIDC), that every step calling Azure starts with: `eval "$SIGN_IN"`. GitHub's
  # token is valid for 5 minutes and az can't renew it, so after one azure/login the first new token request past
  # that fails with AADSTS700024 (the registry's, after the platform's 17-minute deployment; 2026-11-04). Each step
  # gets a fresh GitHub token, and clears the CLI's cached tokens so its own Azure tokens last the whole step.
  # The token request retries a transient answer (a timeout, 429 or 5xx) with backoff, at most 30 s an attempt and
  # 120 s in all: a run signs in up to nine times, and one 503 from GitHub failed a run before it built anything
  # (2026-11-06, run 42158206985). A 401 or 403 still fails at once.
  SIGN_IN: |
    oidc=$(curl -fsS --retry 5 --retry-max-time 120 --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -er .value)
    az account clear
    az login --service-principal -u "$DEPLOY_CLIENT_ID" -t "$TENANT_ID" --federated-token "$oidc" -o none
    az account set -s "$SUBSCRIPTION_ID"
  # One execution of a manual job ($1) with the job's own command: waits for it (at most $2 seconds, 900 by
  # default), prints its logs and returns 0 only when it Succeeded. A step runs it as `eval "$RUN_JOB"; run_job …`.
  RUN_JOB: |
    run_job() {
      local job="$1" deadline=$(( $(date +%s) + ${2:-900} )) execution status=""
      execution=$(az containerapp job start -n "$job" -g "$RG" --query name -o tsv)
      echo "$job: execution $execution started"
      while [[ -z "$status" || "$status" == Running || "$status" == Processing || "$status" == Unknown ]]; do
        if (( $(date +%s) > deadline )); then echo "$job: execution $execution timed out"; return 1; fi
        sleep 10
        status=$(az containerapp job execution show -n "$job" -g "$RG" --job-execution-name "$execution" --query properties.status -o tsv 2>/dev/null || echo Unknown)
      done
      az containerapp job logs show -n "$job" -g "$RG" --execution "$execution" --format text \
        --container "$(az containerapp job show -n "$job" -g "$RG" --query 'properties.template.containers[0].name' -o tsv)" 2>/dev/null || true
      echo "$job: execution $execution $status"
      [[ "$status" == Succeeded ]]
    }

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy app's federated credential trusts this repository's jobs in this GitHub environment only.
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    steps:
      # v7 of checkout and setup-node run on Node 24: GitHub forces actions built for Node 20 (v4) onto it with a
      # deprecation warning.
      - uses: actions/checkout@v7

      # First the unit and its image (scripts/image-closure.ts IMAGES), then the inputs, before anything is downloaded
      # or deployed: seed-ip and recover-vaults belong to the platform; recover-vaults follows infra/cleanup.sh, so the
      # units are gone (a first deployment); L1 is deployed last, through every check. The inputs come in as INPUT_*:
      # the parameter file reads SEED_IP and RECOVER_VAULTS itself, and an input is never pasted into the script.
      # Then the pinned Bicep CLI, first on PATH, so the tests and every deployment use it. It compiles the parameter
      # file: the sign-in and target, never GitHub secrets, and every resource name the steps below use.
      - name: "0 the unit and its image, the Bicep CLI, then the sign-in, target and names (infra/main.<environment>.bicepparam)"
        id: target
        env:
          INPUT_FIRST_DEPLOYMENT: ${{ inputs.first-deployment }}
          INPUT_SEED_IP: ${{ inputs.seed-ip }}
          INPUT_RECOVER_VAULTS: ${{ inputs.recover-vaults }}
        run: |
          case "$UNIT" in
            platform) image="" dockerfile="" ;;
            l1) image=l1-agent dockerfile=docker/l1-agent.Dockerfile ;;
            l2) image=l2-control dockerfile=docker/l2-control.Dockerfile ;;
            l3) image=l3-verifier dockerfile=docker/l3-verifier.Dockerfile ;;
            operator) image=operator dockerfile=docker/operator.Dockerfile ;;
            seller) image=seller dockerfile=Dockerfile ;;
            *) echo "::error::unit $UNIT is not platform, l1, l2, l3, operator or seller. Nothing was deployed."; exit 1 ;;
          esac
          if [[ "$UNIT" != platform && ( -n "$INPUT_SEED_IP" || "$INPUT_RECOVER_VAULTS" == true ) ]]; then
            echo "::error::seed-ip and recover-vaults are for the platform: run deploy-infra (quickstart §4 and §6). Nothing was deployed."
            exit 1
          fi
          if [[ "$INPUT_RECOVER_VAULTS" == true && "$INPUT_FIRST_DEPLOYMENT" != true ]]; then
            echo "::error::recover-vaults follows infra/cleanup.sh, so the units are gone: check first-deployment too (quickstart §6). Nothing was deployed."
            exit 1
          fi
          if [[ "$UNIT" == l1 && "$INPUT_FIRST_DEPLOYMENT" == true ]]; then
            echo "::error::L1 is deployed last, through every check: it has no first deployment (quickstart §4). Nothing was deployed."
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "DOCKERFILE=$dockerfile" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bicep"
          curl -fsSL -o "$RUNNER_TEMP/bicep/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bicep/bicep"
          echo "$RUNNER_TEMP/bicep" >> "$GITHUB_PATH"
          echo "BICEP_PATH=$RUNNER_TEMP/bicep/bicep" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bicep/bicep" build-params "$PARAMS" --stdout | jq '.parametersJson | fromjson | .parameters | map_values(.value)' > "$RUNNER_TEMP/params.json"
          jq -r 'def v(p): getpath(p) // error("the parameter file has no \(p | join("."))");
            "authAudience=\(v(["authAudience"]))", "payerAddress=\(v(["payerAddress"]))"' "$RUNNER_TEMP/params.json" >> "$GITHUB_OUTPUT"
          jq -r 'def v(p): getpath(p) // error("the parameter file has no \(p | join("."))");
            "TENANT_ID=\(v(["tenantId"]))", "SUBSCRIPTION_ID=\(v(["subscriptionId"]))", "DEPLOY_CLIENT_ID=\(v(["deployClientId"]))"' "$RUNNER_TEMP/params.json" >> "$GITHUB_ENV"
          jq -r 'def v(p): getpath(["names"] + p) // error("the parameter file has no names.\(p | join("."))");
            "RG=\(v(["resourceGroup"]))", "LOG_X402=\(v(["logs"]))", "CR_X402=\(v(["registry"]))",
            "CA_L1=\(v(["apps", "l1"]))", "CA_L3=\(v(["apps", "l3"]))", "CA_SELLER=\(v(["apps", "seller"]))",
            "CA_SELLER_ALIAS=\(v(["apps", "sellerAlias"]))", "CAJ_L1=\(v(["jobs", "l1"]))", "CAJ_L2=\(v(["jobs", "l2"]))"' "$RUNNER_TEMP/params.json" >> "$GITHUB_ENV"

      # No dependency cache: this job can deploy, and a restored cache would be code no commit holds. setup-node v5+
      # turns caching on by itself once package.json names a packageManager.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      # With BICEP_PATH set, every suite runs, T-IAC-01 on the compiled templates included.
      - name: "1 typecheck and tests"
        id: tests
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

      - name: "2 build and push the unit's image, tagged with the commit"
        id: build
        if: ${{ inputs.unit != 'platform' }}
        run: |
          eval "$SIGN_IN"
          az acr login -n "$CR_X402"
          SERVER=$(az acr show -n "$CR_X402" --query loginServer -o tsv)
          docker build -f "$DOCKERFILE" -t "$SERVER/x402-$IMAGE:$IMAGE_TAG" .
          docker push "$SERVER/x402-$IMAGE:$IMAGE_TAG"
          echo "acr=$SERVER" >> "$GITHUB_OUTPUT"

      - name: "2b image secret check (SC-005)"
        id: image-scan
        if: ${{ inputs.unit != 'platform' }}
        run: |
          IMG="${{ steps.build.outputs.acr }}/x402-$IMAGE:$IMAGE_TAG"
          if (docker history --no-trunc "$IMG"; docker run --rm "$IMG" env) | grep -E 'PRIVATE_KEY[=]|_SECRET[=]|_TOKEN[=]'; then
            echo "secret assignment found in $IMG"; exit 1
          fi

      # main.bicep with UNIT: the platform, or this unit's apps only. On L1, the agent's current revision keeps all
      # traffic; the new one starts at 0% behind the `candidate` label.
      - name: "3 what-if, then deploy the unit (main.bicep with UNIT)"
        id: deploy
        env:
          FIRST_DEPLOYMENT: ${{ inputs.first-deployment }}
          SEED_IP: ${{ inputs.seed-ip }}
          RECOVER_VAULTS: ${{ inputs.recover-vaults }}
        run: |
          eval "$SIGN_IN"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$UNIT" == l1 ]]; then
            STABLE=$(az containerapp revision list -n "$CA_L1" -g "$RG" --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv 2>/dev/null || true)
            echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
            export AGENT_STABLE_REVISION="$STABLE"
          fi
          az deployment group what-if -g "$RG" -p "$PARAMS"
          az deployment group create -g "$RG" -n "x402-$UNIT-$IMAGE_TAG" -p "$PARAMS" -o none
          echo "law=$(az monitor log-analytics workspace show -g "$RG" -n "$LOG_X402" --query customerId -o tsv)" >> "$GITHUB_OUTPUT"
          if [[ -n "$SEED_IP" ]]; then
            echo "The vaults let the seed IP through until the next deploy-infra run without seed-ip." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$FIRST_DEPLOYMENT" == true ]]; then
            echo "First deployment of $UNIT: deployed without the checks through the other units, so unverified, and nothing promoted." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The operator job's own command is ledger-verify: the deploy identity never starts it with another.
      - name: "4 wait: the unit's new revision (L2: the ledger lock handover), then both sellers"
        id: wait
        if: ${{ inputs.unit != 'platform' || !inputs.first-deployment }}
        run: |
          eval "$SIGN_IN"
          eval "$RUN_JOB"
          if [[ "$UNIT" == platform || "$UNIT" == l2 ]]; then
            ok=""
            for _ in $(seq 1 20); do
              if run_job "$CAJ_L2" 120; then ok=1; break; fi
              sleep 15
            done
            if [ -z "$ok" ]; then echo "L2 did not answer ledger-verify within 5 minutes"; exit 1; fi
          fi
          if [[ "$UNIT" == l1 || "$UNIT" == l3 ]]; then
            if [[ "$UNIT" == l1 ]]; then app="$CA_L1"; else app="$CA_L3"; fi
            state=""
            for _ in $(seq 1 30); do
              LATEST=$(az containerapp show -n "$app" -g "$RG" --query properties.latestRevisionName -o tsv)
              state=$(az containerapp revision show -n "$app" -g "$RG" --revision "$LATEST" --query properties.provisioningState -o tsv)
              [ "$state" = Provisioned ] && break
              sleep 10
            done
            if [ "$state" != Provisioned ]; then echo "$app revision $LATEST was not provisioned within 5 minutes"; exit 1; fi
          fi
          for app in "$CA_SELLER" "$CA_SELLER_ALIAS"; do
            host=$(az containerapp show -n "$app" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            ok=""
            for _ in $(seq 1 18); do
              if curl -fsS -m 10 -o /dev/null "https://$host/api/catalog"; then ok=1; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then echo "$host did not answer /api/catalog within 3 minutes"; exit 1; fi
          done

      - name: "5 payer balance (read-only)"
        id: balance
        if: ${{ !inputs.first-deployment }}
        run: npm run -s payer-balance -- "${{ steps.target.outputs.payerAddress }}"

      - name: "6 regression: L1-4 scripted plan with --check-baseline"
        id: regression
        if: ${{ !inputs.first-deployment }}
        run: |
          eval "$SIGN_IN"
          eval "$RUN_JOB"
          run_job "$CAJ_L1"

      - name: "7 ledger-verify"
        id: chain
        if: ${{ !inputs.first-deployment }}
        run: |
          eval "$SIGN_IN"
          eval "$RUN_JOB"
          run_job "$CAJ_L2"

      # The token is for the API app's client ID, the audience the agent accepts (authAudience). On L1, the request
      # goes to the new revision.
      - name: "8 hosted smoke through the agent (on L1, its new revision)"
        id: smoke
        if: ${{ !inputs.first-deployment }}
        run: |
          eval "$SIGN_IN"
          AGENT=$(az containerapp show -n "$CA_L1" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          if [[ "$UNIT" == l1 && -n "${{ steps.deploy.outputs.stable }}" ]]; then AGENT="${AGENT/$CA_L1/$CA_L1---candidate}"; fi
          ACCESS=$(az account get-access-token --resource "${{ steps.target.outputs.authAudience }}" --query accessToken -o tsv)
          START=$(date +%s)
          curl -fsS -m 210 -X POST "https://$AGENT/v1/runs" -H "authorization: Bearer $ACCESS" -H "content-type: application/json" \
            -d '{"goal":"Get today'"'"'s weather for Lima and a short market brief, then give me a receipt list of what you bought."}' > "$RUNNER_TEMP/smoke.json"
          SECS=$(( $(date +%s) - START ))
          echo "hosted smoke: ${SECS}s (SC-009 target: p95 <= 120 s)" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.status == "completed"' "$RUNNER_TEMP/smoke.json" > /dev/null
          for p in /api/weather /api/market-brief; do
            jq -e --arg p "$p" '[.steps[] | select((.url // "") | contains($p)) | select(.result.outcome == "PAID" and .result.payment.settlement.status == "CONFIRMED")] | length >= 1' "$RUNNER_TEMP/smoke.json" > /dev/null
          done
          # specs/012 research R14: a deployment check never asks the approver; an escalation here fails the run.
          jq -e '[.steps[] | select(.result.outcome == "ESCALATED")] | length == 0' "$RUNNER_TEMP/smoke.json" > /dev/null
          test "$SECS" -le 120

      - name: "9 log secret scan (credential shapes)"
        id: log-scan
        if: ${{ !inputs.first-deployment }}
        run: |
          eval "$SIGN_IN"
          az monitor log-analytics query -w "${{ steps.deploy.outputs.law }}" \
            --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated >= datetime(${{ steps.deploy.outputs.started }}) | project Log_s" \
            --query "[].Log_s" -o tsv | npm run -s scan-logs

      # Bicep moves the traffic: on L1, main.bicep again without a stable revision gives the latest one 100%.
      - name: "10 promote: the unit's image as last-good (on L1, the agent's traffic first)"
        id: promote
        if: ${{ inputs.unit != 'platform' && !inputs.first-deployment }}
        run: |
          eval "$SIGN_IN"
          if [[ "$UNIT" == l1 ]]; then
            AGENT_STABLE_REVISION="" az deployment group create -g "$RG" -n "x402-l1-promote-$IMAGE_TAG" -p "$PARAMS" -o none
          fi
          az acr import -n "$CR_X402" --source "${{ steps.build.outputs.acr }}/x402-$IMAGE:$IMAGE_TAG" --image "x402-$IMAGE:last-good" --force

      # Once step 3 has run, even if it failed partway, the unit's apps may be on the new image: back to its last-good.
      # The other units keep theirs. A failed platform deployment is fixed forward: there is no previous platform to
      # return to.
      - name: "rollback the unit to last-good (the agent's traffic stays on its previous revision)"
        id: rollback
        if: failure() && inputs.unit != 'platform' && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: |
          eval "$SIGN_IN"
          eval "$RUN_JOB"
          if ! az acr repository show-tags -n "$CR_X402" --repository "x402-$IMAGE" -o tsv | grep -x last-good > /dev/null; then
            echo "x402-$IMAGE has no last-good yet: nothing to roll back to"; exit 1
          fi
          IMAGE_TAG=last-good AGENT_STABLE_REVISION="${{ steps.deploy.outputs.stable }}" \
            az deployment group create -g "$RG" -n "x402-$UNIT-rollback-${{ github.sha }}" -p "$PARAMS" -o none
          run_job "$CAJ_L2"
