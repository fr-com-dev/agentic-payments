# L3 loopback proxy sidecar (SPEC.md §3.1 Azure profile; specs/011 contracts/cloud-topology.md "Proxy sidecar").
# L3 keeps binding 127.0.0.1:4023 (NFR-001). This container shares its network namespace and exposes 8080 to
# the environment's internal-only ingress. It has no env, no secrets and no usable identity (lifecycle None).
# Image: nginxinc/nginx-unprivileged:1.29-alpine (pid and temp paths already under /tmp). Mounted as
# /etc/nginx/conf.d/default.conf, so these directives sit in the http context.

# Never log headers: the access log has no Authorization and no query string.
log_format x402_noauth '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

upstream x402_l3 {
  server 127.0.0.1:4023;
}

server {
  listen 8080;
  access_log /dev/stdout x402_noauth;
  client_max_body_size 256k;

  # Health without a token: an unauthenticated settlement claim must get L3's 401 ("the guard answered").
  # 401 → 200 ok; L3 down → 502.
  location = /healthz {
    proxy_method POST;
    proxy_set_header Content-Type application/json;
    proxy_set_body "{}";
    proxy_set_header Authorization "";
    proxy_pass http://x402_l3/v1/settlements;
    proxy_intercept_errors on;
    error_page 401 = @guard_answered;
  }
  location @guard_answered {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://x402_l3;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 230s;
  }
}
